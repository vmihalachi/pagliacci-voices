const svg = (body, sw) => `<svg viewBox="0 0 16 16" aria-hidden="true"${sw ? ` fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"` : ' fill="currentColor"'}>${body}</svg>`;
const ICON = {
  play: svg('<path d="M4.6 2.6v10.8c0 .5.5.8.9.5l8.4-5.4a.6.6 0 0 0 0-1L5.5 2.1a.6.6 0 0 0-.9.5Z"/>'),
  pause: svg('<rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/>'),
  check: svg('<path d="m3.5 8.5 3 3 6-7"/>', 2),
  chevron: svg('<path d="m4 10 4-4 4 4"/>', 1.8),
  prev: svg('<path d="m10 3.5-4.5 4.5 4.5 4.5"/>', 1.8),
  next: svg('<path d="m6 3.5 4.5 4.5-4.5 4.5"/>', 1.8),
  share: svg('<path d="M8 10V2.5m0 0L5 5.5m3-3 3 3M4.5 8H4a1.5 1.5 0 0 0-1.5 1.5v3A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5v-3A1.5 1.5 0 0 0 12 8h-.5"/>', 1.6),
  copy: svg('<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/>', 1.6),
};
const EQ = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>';
const $ = s => document.querySelector(s);
const el = (tag, props = {}, html) => { const e = Object.assign(document.createElement(tag), props); if (html != null) e.innerHTML = html; return e; };
const escape = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const rowAt = i => document.querySelector(`.row[data-index="${i}"]`);
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const audio = new Audio(), warm = new Audio();
warm.preload = "auto";
const failed = new Set();  // "index:kind" of clips that didn't load this visit
const noting = new Set();  // rows whose note field is open without a flag or a note yet
let page = 0, current = 0, listening = false, lastVoice = DATA.voices[0]?.kind, timer = 0, token = 0, playing = null, queue = [], step = 0;
let scrolledAt = 0;  // when the reader last scrolled by hand: a listen-through doesn't pull them back for a while

// ---------------------------------------------------------------------------------------------- the controls

for (const l of DATA.languages || [{ code: DATA.lang, name: DATA.languageName, recorded: true }]) {
  $("#lang").append(el("option", { value: l.code, disabled: !l.recorded, selected: l.code === DATA.lang,
    textContent: l.recorded ? l.name : t("{name} (not recorded yet)", { name: l.name }) }));
}
$("#lang").onchange = () => { location.href = `${encodeURIComponent($("#lang").value)}.html`; };
document.title = `${DATA.title} · ${languageLabel}`;
$("#title").textContent = DATA.title;
if (DATA.icon) { $("#icon").src = DATA.icon; $("#icon").hidden = false; }
if (DATA.voices.length > 1) {
  for (const v of DATA.voices) $("#voice").append(el("option", { value: v.kind, textContent: `${v.label}: ${v.name}` }));
  $("#voice").append(el("option", { value: "both", textContent: t("Both voices") }));
} else $("#voice").hidden = true;
{
  const options = [["all", "All lines"], ["todo", "Not heard yet"], ["flagged", "Flagged or noted"]];
  if (UP) options.push(["unrated", "Not rated yet"]);
  if (DATA.rows.some(r => !voiced(r))) options.push(["voiced", "Voiced"], ["waiting", "Waiting for a voice"]);
  for (const [value, label] of options) $("#filter").append(el("option", { value, textContent: t(label) }));
  if (DATA.flavors.length) {
    const group = el("optgroup", { label: t("Mood") });
    for (const f of DATA.flavors) group.append(el("option", { value: `flavor:${f}`, textContent: capital(flavorLabel(f)) }));
    $("#filter").append(group);
  }
}
const canShare = SITE && !!navigator.share;
$("#copy").innerHTML = `${ICON.copy}<span>${WORDS.copy}</span>`;
$("#send").innerHTML = `${canShare ? ICON.share : ICON.copy}<span>${WORDS.send}</span>`;
$("#toggle").insertAdjacentHTML("beforeend", ICON.chevron);
$("#summary").placeholder = SITE ? t("Flag what sounds off or reads wrong; your notes collect here.") : "Flag what sounds off; your notes for Claude collect here.";
if (SITE) {
  $("#notice").textContent = DATA.notice; $("#notice").hidden = false;
  $("#name-field").hidden = false;
  $("#name").value = store.get(`${DATA.app}-review-name`, "");
  $("#name").oninput = () => { store.set(`${DATA.app}-review-name`, $("#name").value); summarize(); };
}
if (canShare) { $("#share").hidden = false; $("#share").innerHTML = `${ICON.share}<span>${t("Share notes")}</span>`; }
else $("#copy").classList.add("primary");
$("#keys").innerHTML = `<kbd>${t("Space")}</kbd> ${t("listen through / pause")} · <kbd>↓</kbd> <kbd>↑</kbd> ${t("next / previous")} · <kbd>←</kbd> <kbd>→</kbd> ${t("page")} · ` +
  (DATA.voices.length > 1 ? DATA.voices.map((v, n) => `<kbd>${n + 1}</kbd>`).join(" ") + ` ${t("play a voice")} · ` : `<kbd>1</kbd> ${t("play")} · `) +
  `<kbd>R</kbd> ${WORDS.retake.toLowerCase()} · <kbd>T</kbd> ${WORDS.text.toLowerCase()} · <kbd>N</kbd> ${t("note")}` +
  (UP ? ` · <kbd>+</kbd> ${escape(UP_LABEL)} · <kbd>-</kbd> ${escape(DOWN_LABEL)}` : "") + `. ${t("Your notes stay in this browser until you send them.")}`;

// The first visit: what to do, in a few steps (friends only; the owner knows).
if (SITE && !store.get(`${DATA.app}-review-intro`, false)) {
  const steps = [
    t("<b>Listen.</b> Press Listen through and read along, or play any line on its own. Each line plays the way the app says it."),
    t("<b>Flag what's wrong.</b> <b>{retake}</b> when a recording is off: a mispronounced word, a strange tone, a glitch. <b>{text}</b> when the words themselves read wrong. <b>Note</b> to say why, or anything else.",
      { retake: WORDS.retake, text: WORDS.text }),
    t("<b>Send your notes</b> with the button at the bottom. They stay in this browser until then, so you can stop and come back later."),
  ];
  if (UP) steps.splice(2, 0, t("<b>Rate the jokes.</b> <b>{up}</b> or <b>{down}</b> after each punchline tells us which ones land.", { up: escape(UP_LABEL), down: escape(DOWN_LABEL) }));
  $("#steps").innerHTML = steps.map(s => `<li>${s}</li>`).join("");
  $("#intro").hidden = false;
  $("#got-it").onclick = () => { store.set(`${DATA.app}-review-intro`, true); $("#intro").hidden = true; };
}

// ---------------------------------------------------------------------------------------------- the list

function visible() {
  const f = $("#filter").value;
  return DATA.rows.map((r, i) => i).filter(i => {
    const r = DATA.rows[i];
    if (f === "all") return true;
    if (f === "todo") return unheard(r);
    if (f === "flagged") return flagged(r) || noted(r);
    if (f === "unrated") return rated(r) && !state[reactKey(r)]?.reaction;
    if (f === "voiced") return voiced(r);
    if (f === "waiting") return !voiced(r);
    return r.flavor === f.slice("flavor:".length);
  });
}

const EMPTY = {
  todo: t("You've heard every line. Thank you!"),
  flagged: t("Nothing flagged yet. Lines you mark {retake} or {text}, or write a note on, gather here.", { retake: WORDS.retake, text: WORDS.text }),
  unrated: t("Every joke is rated."),
  voiced: t("Nothing is recorded yet."),
  waiting: t("Every line has a voice."),
};

function render() {
  const list = $("#list"); list.innerHTML = "";
  const order = visible(), pages = Math.max(1, Math.ceil(order.length / PAGE));
  page = Math.min(page, pages - 1);
  for (const i of order.slice(page * PAGE, (page + 1) * PAGE)) list.append(rowElement(i));
  $("#empty").hidden = order.length > 0;
  if (!order.length) {
    $("#empty").innerHTML = `<p>${escape(EMPTY[$("#filter").value] || t("No lines in this mood."))}</p><button id="show-all">${t("Show all lines")}</button>`;
    $("#show-all").onclick = () => setFilter("all");
  }
  ending(order.length, pages);
  pager(order.length, pages); progress(); summarize();
}

function rowElement(i) {
  const r = DATA.rows[i], e = state[r.id] || { heard: {}, retake: {}, text: false, note: "" };
  const waiting = !voiced(r);
  const done = !waiting && !unheard(r);
  const open = flagged(r) || noted(r) || noting.has(i);
  const fresh = DATA.voices.filter(v => newTake(r, v.kind)).map(v => v.label.toLowerCase());
  const broken = DATA.voices.filter(v => failed.has(`${i}:${v.kind}`)).map(v => v.label.toLowerCase());
  const row = el("article", {
    className: `row${r.joke && r.part > 1 ? " part" : ""}${i === current ? " current" : ""}${flagged(r) ? " flagged" : ""}${open ? " noting" : ""}`,
    id: `line-${r.id}`,
  });
  row.dataset.index = i;
  const chips = [];
  const many = DATA.voices.length > 1;
  if (fresh.length) chips.push(`<span class="chip new">${escape(many ? t("New take: {voices}", { voices: fresh.join(", ") }) : t("New take"))}</span>`);
  if (broken.length) chips.push(`<span class="chip failed">${escape(many ? t("Didn't load ({voices}): press play to try again", { voices: broken.join(", ") }) : t("Didn't load: press play to try again"))}</span>`);
  if (waiting) chips.push(`<span class="chip waiting" title="${escape(t("Not recorded for this text yet: check the words; the voice comes later"))}">${t("Waiting for a voice")}</span>`);
  if (r.flavor) chips.push(`<span class="chip flavor-${DATA.flavors.indexOf(r.flavor) % 4}">${escape(flavorLabel(r.flavor))}</span>`);
  if (r.joke) chips.push(`<span class="chip">${r.part === 1 ? t("Joke: setup") : r.part === r.parts ? t("Punchline") : t("Joke: part {part} of {parts}", { part: r.part, parts: r.parts })}</span>`);
  if (r.tags) chips.push(`<span class="chip">${escape(r.tags)}</span>`);
  if (!SITE) chips.push(`<span class="chip">${escape(r.slot)}</span><span class="id">${escape(r.id)}</span>`);
  row.innerHTML = `
    <a class="num" href="#${encodeURIComponent(r.id)}" title="${escape(t("Link to this line"))}">${i + 1}${done ? ICON.check : ""}</a>
    <div><p class="line" lang="${escape(DATA.lang)}"></p>${DATA.lang === DATA.source ? "" : `<p class="gloss" lang="${escape(DATA.source)}"></p>`}
      <div class="meta">${chips.join("")}</div></div>
    <div class="actions"><div class="voices actions"></div></div>
    <div class="note"><input type="text" aria-label="${escape(t("Note on line {n}", { n: i + 1 }))}" placeholder="${escape(t("What's off? Or anything else"))}"></div>`;
  row.querySelector(".line").textContent = r.text;
  const gloss = row.querySelector(".gloss"); if (gloss) gloss.textContent = r.en;
  if (done) row.querySelector(".num").setAttribute("aria-label", t("Line {n}, heard", { n: i + 1 }));
  row.querySelector(".num").onclick = ev => { ev.preventDefault(); ev.stopPropagation(); select(i); };
  const actions = row.querySelector(".actions"), voices = row.querySelector(".voices");
  for (const [n, v] of DATA.voices.entries()) {
    if (!r.clips[v.kind]) continue;
    const play = el("button", { className: "play", title: `${v.name} (${n + 1})` }, `${ICON.play}${EQ}<span>${escape(many ? v.label : t("Play"))}</span>`);
    play.dataset.play = v.kind;
    play.setAttribute("aria-label", many ? t("Play the {voice} voice", { voice: v.label.toLowerCase() }) : t("Play"));
    play.onclick = ev => { ev.stopPropagation(); stopListening(); select(i, false); playOne(i, v.kind); };
    const flag = el("button", { className: "flag", textContent: WORDS.retake, title: WORDS.retakeTip(many ? v.label.toLowerCase() : "") });
    flag.setAttribute("aria-pressed", retake(r, v.kind));
    if (many) flag.setAttribute("aria-label", t("{flag}: {voice} voice", { flag: WORDS.retake, voice: v.label.toLowerCase() }));
    flag.onclick = ev => { ev.stopPropagation(); toggleRetake(i, v.kind); };
    const pair = el("span", { className: "pair" }); pair.append(play, flag); voices.append(pair);
  }
  // A joke's setup can play the whole joke, with the beat before the punchline.
  if (r.joke && r.part === 1 && voiced(r)) {
    const whole = el("button", { className: "whole", title: t("The setup, the beat, the punchline") }, `${ICON.play}${EQ}<span>${t("Whole joke")}</span>`);
    whole.onclick = ev => { ev.stopPropagation(); playJoke(i); };
    voices.append(whole);
  }
  const pair = el("span", { className: "pair" });
  const text = el("button", { className: "flag", textContent: WORDS.text, title: WORDS.textTip });
  text.setAttribute("aria-pressed", !!e.text);
  text.onclick = ev => { ev.stopPropagation(); toggleText(i); };
  const note = el("button", { className: noted(r) ? "noted" : "", textContent: t("Note"), title: t("Write a note (N)") });
  note.setAttribute("aria-expanded", open);
  note.onclick = ev => { ev.stopPropagation(); openNote(i); };
  pair.append(text, note); actions.append(pair);
  if (rated(r)) {
    const group = el("span", { className: "react", role: "group" });
    group.setAttribute("aria-label", r.joke ? t("How is the joke?") : t("How is it?"));
    for (const [value, label] of [["up", UP_LABEL], ["down", DOWN_LABEL]]) {
      const b = el("button", { className: value, textContent: label, title: `${label} (${value === "up" ? "+" : "-"})` });
      b.setAttribute("aria-pressed", state[reactKey(r)]?.reaction === value);
      b.onclick = ev => { ev.stopPropagation(); react(i, value); };
      group.append(b);
    }
    actions.append(group);
  }
  const input = row.querySelector(".note input");
  input.value = e.note || "";
  input.oninput = () => { entry(r.id).note = input.value; save(); summarize(); row.querySelector("[aria-expanded]").classList.toggle("noted", noted(r)); };
  input.onclick = ev => ev.stopPropagation();
  row.onclick = () => select(i, false);
  return row;
}

function redraw(i) {
  rowAt(i)?.replaceWith(rowElement(i));
  markPlaying(); progress(); summarize();
}

// The end of the list: what's left, and the way to send.
function ending(count, pages) {
  const end = $("#end");
  end.hidden = !count || page !== pages - 1 || $("#filter").value !== "all";
  if (end.hidden) return;
  const left = DATA.rows.filter(unheard).length;
  end.innerHTML = left
    ? `<strong>${t("That's the last line.")}</strong><p>${t("{n} lines are still unheard.", { n: left }, "{n} line is still unheard.")}</p><button id="end-todo">${t("Show only those")}</button>`
    : `<strong>${t("You've heard every line. Thank you!")}</strong><p>${SITE ? t("Send your notes back to whoever shared this page, even if nothing was wrong.") : "Copy the notes for Claude."}</p><button class="primary" id="end-send">${WORDS.send}</button>`;
  if (left) $("#end-todo").onclick = () => setFilter("todo");
  else $("#end-send").onclick = send;
}

// Page buttons: the first, the last, and two either side of the current one, with gaps between.
function pager(count, pages) {
  const nav = $("#pager"); nav.innerHTML = ""; nav.hidden = pages < 2;
  const button = (html, to, label) => {
    const b = el("button", { title: label || t("Page {n}", { n: to + 1 }) }, html);
    if (label) b.setAttribute("aria-label", label);
    else if (to === page) b.setAttribute("aria-current", "page");
    b.disabled = to < 0 || to >= pages;
    b.onclick = () => goPage(to); nav.append(b);
  };
  button(`${ICON.prev}<span class="word">${t("Previous")}</span>`, page - 1, t("Previous page (←)"));
  let last = -1;
  for (let p = 0; p < pages; p++) {
    if (p !== 0 && p !== pages - 1 && Math.abs(p - page) > 2) continue;
    if (p - last > 1) nav.append(el("span", { className: "gap", textContent: "…" }));
    button(String(p + 1), p); last = p;
  }
  button(`<span class="word">${t("Next")}</span>${ICON.next}`, page + 1, t("Next page (→)"));
  nav.append(el("span", { className: "range", textContent: t("{from}–{to} of {count}", { from: page * PAGE + 1, to: Math.min(count, (page + 1) * PAGE), count }) }));
}

function goPage(p) {
  const order = visible(), pages = Math.ceil(order.length / PAGE);
  if (p < 0 || p >= pages || p === page) return;
  stopListening(); page = p; render(); select(order[p * PAGE], false); window.scrollTo({ top: 0 });
}

function setFilter(value) { $("#filter").value = value; stopListening(); page = 0; render(); window.scrollTo({ top: 0 }); }

function progress() {
  let done = 0, total = 0;
  for (const r of DATA.rows) for (const v of DATA.voices) if (r.clips[v.kind]) { total++; if (heard(r, v.kind)) done++; }
  const waiting = DATA.rows.filter(r => !voiced(r)).length;
  $("#bar").style.width = `${total ? (100 * done / total) : 0}%`;
  const heardText = t("{done} of {total} heard", { done, total });
  const text = heardText + (waiting ? t(" · {n} waiting", { n: waiting }) : "");
  $("#progress").setAttribute("aria-valuemax", total); $("#progress").setAttribute("aria-valuenow", done);
  $("#progress").setAttribute("aria-valuetext", heardText + (waiting ? t(", {n} lines waiting for a voice", { n: waiting }, ", {n} line waiting for a voice") : ""));
  $("#count").textContent = text; $("#heard").textContent = text;
}

// The notes, in the shape the owner pastes to Claude.
function summarize() {
  const retakes = {}, texts = [], notes = [], up = [], down = [];
  for (const r of DATA.rows) {
    const e = state[r.id];
    if (e) {
      const note = e.note?.trim();
      const voice = DATA.voices.filter(v => retake(r, v.kind));
      for (const v of voice) (retakes[v.kind] ||= []).push(r.id + (note ? ` (${note})` : ""));
      if (e.text) texts.push(`${r.id}: "${r.text}"${note ? ` — ${note}` : ""}`);
      else if (note && !voice.length) notes.push(`${r.id}: "${r.text}" — ${note}`);
    }
    if (rated(r)) { const reaction = state[reactKey(r)]?.reaction; if (reaction) (reaction === "up" ? up : down).push(reactKey(r)); }
  }
  const lines = [];
  for (const v of DATA.voices) if (retakes[v.kind]) lines.push(`Retake ${DATA.lang}/${v.kind} (${v.name}): ${retakes[v.kind].join(", ")}`);
  if (texts.length) lines.push(`Change the ${DATA.languageName} text:`, ...texts.map(t => `- ${t}`));
  if (notes.length) lines.push(`Notes on the ${DATA.languageName} lines:`, ...notes.map(t => `- ${t}`));
  if (up.length) lines.push(`${UP} (${DATA.lang}): ${up.join(", ")}`);
  if (down.length) lines.push(`${DOWN} (${DATA.lang}): ${down.join(", ")}`);
  const name = SITE && $("#name").value.trim();
  if (lines.length && name) lines.unshift(`From ${name}, ${DATA.title} · ${DATA.languageName}:`);
  $("#summary").value = lines.join("\n");
  const flags = Object.values(retakes).reduce((n, l) => n + l.length, 0) + texts.length;
  const parts = [];
  if (flags) parts.push(t("{n} flagged", { n: flags }));
  if (notes.length) parts.push(t("{n} notes", { n: notes.length }, "{n} note"));
  if (up.length + down.length) parts.push(t("{n} rated", { n: up.length + down.length }));
  $("#tally").textContent = parts.length ? parts.join(" · ") : t("No notes yet");
}

// ---------------------------------------------------------------------------------------------- selection and playback

function select(i, scroll = true) {
  if (i == null || !DATA.rows[i]) return;
  current = i;
  const pos = visible().indexOf(i);
  if (pos >= 0 && Math.floor(pos / PAGE) !== page) { page = Math.floor(pos / PAGE); render(); }
  document.querySelectorAll(".row").forEach(row => row.classList.toggle("current", +row.dataset.index === i));
  try { history.replaceState(null, "", `#${encodeURIComponent(DATA.rows[i].id)}`); } catch {}
  if (scroll) rowAt(i)?.scrollIntoView({ block: "nearest", behavior: calm() ? "auto" : "smooth" });
}

function markPlaying() {
  document.querySelectorAll(".actions .playing").forEach(b => b.classList.remove("playing"));
  if (!playing) return;
  const sel = playing.whole != null ? ".whole" : `[data-play="${playing.kind}"]`;
  rowAt(playing.whole ?? playing.i)?.querySelector(sel)?.classList.add("playing");
}

function playOne(i, kind, then, whole) {
  const r = DATA.rows[i]; if (!r?.clips[kind]) { then && then(); return; }
  const mine = ++token;
  lastVoice = kind;
  if (failed.delete(`${i}:${kind}`)) redraw(i);
  audio.src = r.clips[kind]; audio.playbackRate = +$("#speed").value;
  playing = { i, kind, whole }; markPlaying(); media(r, kind);
  const finish = ok => {
    if (mine !== token) return;
    token++; playing = null;
    if (ok) entry(r.id).heard[kind] = r.versions[kind] || true; else failed.add(`${i}:${kind}`);
    save(); redraw(i);
    then && then(ok);
  };
  audio.onended = () => finish(true);
  audio.onerror = () => finish(false);
  audio.play().catch(err => {
    if (mine !== token) return;
    if (err.name === "NotAllowedError") stopListening();
    else if (err.name !== "AbortError") finish(false);
  });
}

// The setup, the beat, the punchline: as the app delivers a joke.
function playJoke(i) {
  stopListening(); select(i, false);
  const r = DATA.rows[i], kind = r.clips[lastVoice] ? lastVoice : Object.keys(r.clips)[0];
  const parts = DATA.rows.map((row, n) => n).filter(n => DATA.rows[n].joke === r.joke && DATA.rows[n].clips[kind]);
  const next = k => playOne(parts[k], kind, () => {
    if (k + 1 < parts.length) { playing = { i: parts[k + 1], kind, whole: i }; markPlaying(); timer = setTimeout(() => next(k + 1), BEAT); }
  }, i);
  next(0);
}

// A listen-through plays the visible lines in order; a joke's parts play together, one voice after the other, with
// the beat between them.
function plan(from) {
  const order = visible(); let pos = order.indexOf(from); if (pos < 0) pos = 0;
  while (pos > 0 && DATA.rows[order[pos]].joke && DATA.rows[order[pos - 1]].joke === DATA.rows[order[pos]].joke) pos--;
  const chosen = DATA.voices.length > 1 ? $("#voice").value : DATA.voices[0]?.kind;
  const kinds = chosen === "both" ? DATA.voices.map(v => v.kind) : [chosen];
  const out = [];
  for (let p = pos; p < order.length;) {
    const r = DATA.rows[order[p]];
    let q = p + 1;
    if (r.joke) while (q < order.length && DATA.rows[order[q]].joke === r.joke) q++;
    for (const kind of kinds) {
      const parts = order.slice(p, q).filter(i => DATA.rows[i].clips[kind]);
      parts.forEach((i, n) => out.push({ i, kind, gap: n < parts.length - 1 ? BEAT : GAP }));
    }
    p = q;
  }
  return out;
}

function listenFrom(i) {
  stopListening();
  queue = plan(i); step = 0;
  if (!queue.length) return;
  listening = true; paintListen(); go();
}
function go() {
  if (!listening || step >= queue.length) { stopListening(); return; }
  const { i, kind, gap } = queue[step];
  select(i, Date.now() - scrolledAt > 5000);
  const next = queue[step + 1];
  if (next) warm.src = DATA.rows[next.i].clips[next.kind];  // fetch the next clip while this one plays
  playOne(i, kind, () => { if (!listening) return; step++; timer = setTimeout(go, gap); });
}
// Next or previous line: inside a listen-through, it moves the queue; otherwise, the selection.
function skip(delta) {
  if (!listening) {
    const order = visible(), pos = order.indexOf(current);
    select(order[Math.max(0, Math.min(order.length - 1, pos + delta))] ?? current);
    return;
  }
  const at = queue[step]?.i;
  let s = step;
  if (delta > 0) while (s < queue.length && queue[s].i === at) s++;
  else { while (s > 0 && queue[s - 1].i === at) s--; if (s > 0) { const before = queue[--s].i; while (s > 0 && queue[s - 1].i === before) s--; } }
  clearTimeout(timer); token++; audio.pause(); step = s; go();
}
function stopListening() {
  listening = false; clearTimeout(timer); token++; audio.onended = audio.onerror = null; audio.pause();
  playing = null; markPlaying(); paintListen();
}
function paintListen() {
  $("#listen").innerHTML = listening ? `${ICON.pause}<span>${t("Pause")}</span>` : `${ICON.play}<span>${t("Listen through")}</span>`;
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = listening ? "playing" : "paused";
}
function media(r, kind) {
  if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
  const v = DATA.voices.find(v => v.kind === kind);
  navigator.mediaSession.metadata = new MediaMetadata({ title: r.text, artist: `${DATA.title} · ${v?.name || kind}`, album: languageLabel,
    artwork: DATA.icon ? [{ src: new URL(DATA.icon, location.href).href, sizes: "512x512", type: "image/png" }] : [] });
}
if ("mediaSession" in navigator) {
  const on = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch {} };
  on("play", () => listening || listenFrom(current));
  on("pause", stopListening);
  on("nexttrack", () => skip(1));
  on("previoustrack", () => skip(-1));
}

// ---------------------------------------------------------------------------------------------- flags and notes

function toggleRetake(i, kind) {
  const r = DATA.rows[i]; if (!r.clips[kind]) return;
  entry(r.id).retake[kind] = retake(r, kind) ? false : (r.versions[kind] || true); save(); redraw(i);
}
function toggleText(i) { const e = entry(DATA.rows[i].id); e.text = !e.text; save(); redraw(i); }
function openNote(i) {
  const r = DATA.rows[i];
  if (flagged(r) || noted(r)) noting.add(i); else if (noting.has(i)) noting.delete(i); else noting.add(i);
  redraw(i);
  if (rowAt(i)?.classList.contains("noting")) rowAt(i).querySelector(".note input").focus({ preventScroll: true });
}
function react(i, value) {
  const r = DATA.rows[i]; if (!rated(r)) return;
  const e = entry(reactKey(r)); e.reaction = e.reaction === value ? "" : value; save(); redraw(i);
}

function say(html, ms = 6000) {
  $("#status").innerHTML = html; clearTimeout(say.timer);
  if (ms) say.timer = setTimeout(() => { $("#status").textContent = ""; }, ms);
}
const text = () => $("#summary").value || "No flags: everything sounds right.";
async function copy() {
  try { await navigator.clipboard.writeText(text()); say(escape(WORDS.sent)); }
  catch { $("#summary").select(); document.execCommand("copy"); say(escape(t("Copied."))); }
}
async function share() {
  try { await navigator.share({ title: `${DATA.title} · ${languageLabel}`, text: text() }); say(escape(t("Sent. Thank you!"))); }
  catch (err) { if (err.name !== "AbortError") copy(); }
}
function send() { openPanel(true); canShare ? share() : copy(); }
function openPanel(open) { $("#notes").classList.toggle("open", open); $("#toggle").setAttribute("aria-expanded", open); }
$("#copy").onclick = copy;
$("#share").onclick = share;
$("#send").onclick = send;
$("#toggle").onclick = () => openPanel(!$("#notes").classList.contains("open"));
$("#clear").onclick = () => {
  const before = JSON.stringify(state);
  for (const id in state) Object.assign(state[id], { retake: {}, text: false, note: "", reaction: "" });
  noting.clear(); save(); render();
  say(`${escape(t("Cleared."))} <button class="quiet" id="undo">${escape(t("Undo"))}</button>`, 10000);
  $("#undo").onclick = () => { state = JSON.parse(before); save(); render(); say(escape(t("Restored."))); };
};

$("#listen").onclick = () => listening ? stopListening() : listenFrom(current);
$("#filter").onchange = () => setFilter($("#filter").value);
$("#speed").onchange = () => { audio.playbackRate = +$("#speed").value; };
for (const type of ["wheel", "touchmove"]) addEventListener(type, () => { scrolledAt = Date.now(); }, { passive: true });

document.addEventListener("keydown", ev => {
  const tag = ev.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { if (ev.key === "Escape") ev.target.blur(); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if ((ev.key === " " || ev.key === "Enter") && (tag === "BUTTON" || tag === "A")) return;  // the focused control's own
  if (["PageUp", "PageDown", "Home", "End"].includes(ev.key)) { scrolledAt = Date.now(); return; }
  const key = ev.key.toLowerCase();
  if (ev.key === " ") { ev.preventDefault(); listening ? stopListening() : listenFrom(current); }
  else if (ev.key === "ArrowDown" || key === "j") { ev.preventDefault(); skip(1); }
  else if (ev.key === "ArrowUp" || key === "k") { ev.preventDefault(); skip(-1); }
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { ev.preventDefault(); goPage(page + (ev.key === "ArrowLeft" ? -1 : 1)); }
  else if (/^[1-9]$/.test(ev.key)) { const v = DATA.voices[+ev.key - 1]; if (v) { stopListening(); playOne(current, v.kind); } }
  else if (key === "r") toggleRetake(current, lastVoice);
  else if (key === "t") toggleText(current);
  else if (key === "n") { ev.preventDefault(); openNote(current); }
  else if (UP && (ev.key === "+" || ev.key === "=")) react(current, "up");
  else if (UP && ev.key === "-") react(current, "down");
});

// The notes tray covers the bottom of the page: the list keeps room for it, whatever its height.
new ResizeObserver(() => document.documentElement.style.setProperty("--footer-h", `${$("#notes").offsetHeight}px`)).observe($("#notes"));

// A link to one line (`#<id>`, or a joke's id) opens on it.
function fromHash() {
  let want = ""; try { want = decodeURIComponent(location.hash.slice(1)); } catch {}
  return want ? DATA.rows.findIndex(r => r.id === want || r.joke === want) : -1;
}
addEventListener("hashchange", () => {
  const i = fromHash(); if (i < 0 || i === current) return;
  if (!visible().includes(i)) setFilter("all");
  select(i);
});
paintListen();
render();
{
  const i = fromHash();
  if (i >= 0) { select(i, false); requestAnimationFrame(() => rowAt(i)?.scrollIntoView({ block: "center" })); }
}
</script>
</body>
</html>
