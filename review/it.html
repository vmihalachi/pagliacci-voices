più quello di una volta.", "en": "Il circo non è più quello di una volta.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-non-e-piu", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-non-e-piu.1.m4a?v=859f76d4b3b2"}, "versions": {"clown": "859f76d4b3b2"}}, {"id": "general-non-e-piu.2", "text": "Nemmeno io. Una volta ero triste solo il lunedì.", "en": "Nemmeno io. Una volta ero triste solo il lunedì.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-non-e-piu", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-non-e-piu.2.m4a?v=286b0df85fb8"}, "versions": {"clown": "286b0df85fb8"}}, {"id": "general-aumento.1", "text": "Ho chiesto un aumento al direttore del circo.", "en": "Ho chiesto un aumento al direttore del circo.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-aumento", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-aumento.1.m4a?v=fdf91a6736e9"}, "versions": {"clown": "fdf91a6736e9"}}, {"id": "general-aumento.2", "text": "Mi ha alzato il trapezio.", "en": "Mi ha alzato il trapezio.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-aumento", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-aumento.2.m4a?v=3c4806c8420b"}, "versions": {"clown": "3c4806c8420b"}}, {"id": "general-carnevale.1", "text": "A Carnevale ogni scherzo vale.", "en": "A Carnevale ogni scherzo vale.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-carnevale", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-carnevale.1.m4a?v=c622bb2be6ea"}, "versions": {"clown": "c622bb2be6ea"}}, {"id": "general-carnevale.2", "text": "Il resto dell'anno vale la metà.", "en": "Il resto dell'anno vale la metà.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-carnevale", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-carnevale.2.m4a?v=5dfb0116090d"}, "versions": {"clown": "5dfb0116090d"}}, {"id": "general-torta-medico.1", "text": "Una torta in faccia al giorno toglie il medico di torno.", "en": "Una torta in faccia al giorno toglie il medico di torno.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-torta-medico", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-torta-medico.1.m4a?v=1dd18b703a70"}, "versions": {"clown": "1dd18b703a70"}}, {"id": "general-torta-medico.2", "text": "E pure gli amici.", "en": "E pure gli amici.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-torta-medico", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-torta-medico.2.m4a?v=2ab84a804d77"}, "versions": {"clown": "2ab84a804d77"}}, {"id": "general-va-piano.1", "text": "Chi va piano va sano e va lontano.", "en": "Chi va piano va sano e va lontano.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-va-piano", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-va-piano.1.m4a?v=d47a1b664728"}, "versions": {"clown": "d47a1b664728"}}, {"id": "general-va-piano.2", "text": "Con queste scarpe, arrivo domani.", "en": "Con queste scarpe, arrivo domani.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-va-piano", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-va-piano.2.m4a?v=574c080cb256"}, "versions": {"clown": "574c080cb256"}}, {"id": "general-coerente.1", "text": "Faccio sempre la figura del pagliaccio.", "en": "Faccio sempre la figura del pagliaccio.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-coerente", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-coerente.1.m4a?v=d0cb06a909df"}, "versions": {"clown": "d0cb06a909df"}}, {"id": "general-coerente.2", "text": "Almeno sono coerente.", "en": "Almeno sono coerente.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-coerente", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-coerente.2.m4a?v=cc2baeb8ffb6"}, "versions": {"clown": "cc2baeb8ffb6"}}, {"id": "general-fare-il-pagliaccio.1", "text": "Mamma diceva sempre: smettila di fare il pagliaccio.", "en": "Mamma diceva sempre: smettila di fare il pagliaccio.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fare-il-pagliaccio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fare-il-pagliaccio.1.m4a?v=834b11cfe1c5"}, "versions": {"clown": "834b11cfe1c5"}}, {"id": "general-fare-il-pagliaccio.2", "text": "Non ho smesso. Adesso mi pagano. Poco.", "en": "Non ho smesso. Adesso mi pagano. Poco.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fare-il-pagliaccio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fare-il-pagliaccio.2.m4a?v=67c13aceb2ed"}, "versions": {"clown": "67c13aceb2ed"}}, {"id": "general-riconoscimento.1", "text": "Mi hanno dato del pagliaccio.", "en": "Mi hanno dato del pagliaccio.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-riconoscimento", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-riconoscimento.1.m4a?v=203d73379645"}, "versions": {"clown": "203d73379645"}}, {"id": "general-riconoscimento.2", "text": "Finalmente un riconoscimento.", "en": "Finalmente un riconoscimento.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-riconoscimento", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-riconoscimento.2.m4a?v=1368d0c85901"}, "versions": {"clown": "1368d0c85901"}}, {"id": "general-bar-serio.1", "text": "Un pagliaccio entra in un bar. «Il solito?»", "en": "Un pagliaccio entra in un bar. «Il solito?»", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-bar-serio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-bar-serio.1.m4a?v=69c2e6e80655"}, "versions": {"clown": "69c2e6e80655"}}, {"id": "general-bar-serio.2", "text": "«No, oggi qualcosa di serio.» Gli portano una camomilla.", "en": "«No, oggi qualcosa di serio.» Gli portano una camomilla.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-bar-serio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-bar-serio.2.m4a?v=fec53e89c41f"}, "versions": {"clown": "fec53e89c41f"}}, {"id": "general-nascondino.1", "text": "Sai perché i pagliacci non giocano a nascondino?", "en": "Sai perché i pagliacci non giocano a nascondino?", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-nascondino", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-nascondino.1.m4a?v=6a7fb42826fb"}, "versions": {"clown": "6a7fb42826fb"}}, {"id": "general-nascondino.2", "text": "Il naso li tradisce sempre.", "en": "Il naso li tradisce sempre.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-nascondino", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-nascondino.2.m4a?v=7d627b450154"}, "versions": {"clown": "7d627b450154"}}, {"id": "general-fratello-mimo.1", "text": "Ho un fratello mimo.", "en": "Ho un fratello mimo.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-fratello-mimo", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fratello-mimo.1.m4a?v=456b84bf2fce"}, "versions": {"clown": "456b84bf2fce"}}, {"id": "general-fratello-mimo.2", "text": "Non ci parliamo da anni. Lui, almeno.", "en": "Non ci parliamo da anni. Lui, almeno.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-fratello-mimo", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fratello-mimo.2.m4a?v=7938946039d6"}, "versions": {"clown": "7938946039d6"}}, {"id": "general-clacson-ugo.1", "text": "Il mio clacson si chiama Ugo.", "en": "Il mio clacson si chiama Ugo.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-clacson-ugo", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-clacson-ugo.1.m4a?v=b0f6f40f320b"}, "versions": {"clown": "b0f6f40f320b"}}, {"id": "general-clacson-ugo.2", "text": "È l'unico che mi risponde.", "en": "È l'unico che mi risponde.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-clacson-ugo", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-clacson-ugo.2.m4a?v=3bb4ed9adda8"}, "versions": {"clown": "3bb4ed9adda8"}}, {"id": "general-pompiere.1", "text": "Da piccolo volevo fare il pompiere.", "en": "As a kid I wanted to be a firefighter.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pompiere", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pompiere.1.m4a?v=4bee7432ae64"}, "versions": {"clown": "4bee7432ae64"}}, {"id": "general-pompiere.2", "text": "Adesso spruzzo acqua dal fiore all'occhiello. Ci sono quasi.", "en": "Now I squirt water from my buttonhole. Nearly there.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pompiere", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pompiere.2.m4a?v=aa0c76d0f752"}, "versions": {"clown": "aa0c76d0f752"}}, {"id": "general-sorridi.1", "text": "Tutti mi dicono: sorridi!", "en": "Tutti mi dicono: sorridi!", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-sorridi", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-sorridi.1.m4a?v=39d6b58f709c"}, "versions": {"clown": "39d6b58f709c"}}, {"id": "general-sorridi.2", "text": "Lo faccio. È disegnato. Più di così…", "en": "Lo faccio. È disegnato. Più di così…", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-sorridi", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-sorridi.2.m4a?v=4b8cb204e9c6"}, "versions": {"clown": "4b8cb204e9c6"}}, {"id": "general-posto-sbagliato.1", "text": "Il pubblico ride sempre nel momento sbagliato.", "en": "The audience always laughs at the wrong moment.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-posto-sbagliato", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-posto-sbagliato.1.m4a?v=5d623e809def"}, "versions": {"clown": "5d623e809def"}}, {"id": "general-posto-sbagliato.2", "text": "Quando entro.", "en": "When I walk on.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-posto-sbagliato", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-posto-sbagliato.2.m4a?v=62d64d0da46b"}, "versions": {"clown": "62d64d0da46b"}}, {"id": "general-trucco-cola", "text": "Non sono triste. Mi cola il trucco, è diverso.", "en": "Non sono triste. Mi cola il trucco, è diverso.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-trucco-cola.m4a?v=000e6a471d6e"}, "versions": {"clown": "000e6a471d6e"}}, {"id": "general-faccia-cerone", "text": "Faccia di bronzo, io? No, di cerone.", "en": "Faccia di bronzo, io? No, di cerone.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-faccia-cerone.m4a?v=4a795b9e6d5c"}, "versions": {"clown": "4a795b9e6d5c"}}, {"id": "general-palestra.1", "text": "Mi sono iscritto in palestra.", "en": "I joined a gym.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-palestra", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-palestra.1.m4a?v=ae4cd2c16c73"}, "versions": {"clown": "ae4cd2c16c73"}}, {"id": "general-palestra.2", "text": "Faccio solo cadute. Sono il più bravo.", "en": "I only do the falls. I'm the best there.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-palestra", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-palestra.2.m4a?v=fd07f3205772"}, "versions": {"clown": "fd07f3205772"}}, {"id": "morning-understanding", "text": "Io e la mattina abbiamo un accordo: non ci rivolgiamo la parola.", "en": "Mornings and I have an understanding. We don't talk.", "flavor": "dry", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-understanding.m4a?v=47813e75d4f2"}, "versions": {"clown": "47813e75d4f2"}}, {"id": "morning-makeup", "text": "Mattina. Mezz'ora di trucco per avere quest'aria sorpresa.", "en": "Morning. Forty minutes of makeup to look this surprised.", "flavor": "absurd", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-makeup.m4a?v=08329d1719c6"}, "versions": {"clown": "08329d1719c6"}}, {"id": "morning-coffee-first", "text": "Prima il caffè, poi il trucco. Al contrario è stato un disastro.", "en": "Coffee, then makeup. The other way round was a disaster.", "flavor": "silly", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-coffee-first.m4a?v=a24977e3d53c"}, "versions": {"clown": "a24977e3d53c"}}, {"id": "morning-sun-show-off", "text": "Il sole si è alzato struccato. Che sfacciato.", "en": "The sun came up without any makeup. Show-off.", "flavor": "dry", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-sun-show-off.m4a?v=b277324bdbbe"}, "versions": {"clown": "b277324bdbbe"}}, {"id": "morning-horn-alarm.1", "text": "La mia sveglia è una trombetta da bicicletta.", "en": "My alarm clock is a bicycle horn.", "flavor": "absurd", "slot": "morning", "tags": "", "joke": "morning-horn-alarm", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-horn-alarm.1.m4a?v=ce5c9384a953"}, "versions": {"clown": "ce5c9384a953"}}, {"id": "morning-horn-alarm.2", "text": "Ogni mattina salto giù dal letto e mi inchino.", "en": "Every morning I jump out of bed and bow.", "flavor": "absurd", "slot": "morning", "tags": "", "joke": "morning-horn-alarm", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-horn-alarm.2.m4a?v=e814ab17855f"}, "versions": {"clown": "e814ab17855f"}}, {"id": "morning-early-clown.1", "text": "Chi tardi arriva, male alloggia.", "en": "The early bird catches the worm.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-early-clown", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-early-clown.1.m4a?v=aea3137396a9"}, "versions": {"clown": "aea3137396a9"}}, {"id": "morning-early-clown.2", "text": "Io arrivo sempre presto. Così alloggio male più a lungo.", "en": "The early clown catches an empty tent.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-early-clown", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-early-clown.2.m4a?v=199a02eb8674"}, "versions": {"clown": "199a02eb8674"}}, {"id": "morning-not-a-morning-clown", "text": "Non sono un pagliaccio mattiniero. A malapena sono pomeridiano.", "en": "I'm not a morning clown. I'm barely an afternoon clown.", "flavor": "dry", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-not-a-morning-clown.m4a?v=75eb0d025557"}, "versions": {"clown": "75eb0d025557"}}, {"id": "morning-buongiorno.1", "text": "Il buongiorno si vede dal mattino.", "en": "Il buongiorno si vede dal mattino.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-buongiorno", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-buongiorno.1.m4a?v=1bb55909749b"}, "versions": {"clown": "1bb55909749b"}}, {"id": "morning-buongiorno.2", "text": "Infatti stamattina mi sono visto allo specchio. Pazienza.", "en": "Infatti stamattina mi sono visto allo specchio. Pazienza.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-buongiorno", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-buongiorno.2.m4a?v=25fd659cc9e9"}, "versions": {"clown": "25fd659cc9e9"}}, {"id": "morning-oro-in-bocca.1", "text": "Il mattino ha l'oro in bocca.", "en": "Il mattino ha l'oro in bocca.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-oro-in-bocca", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-oro-in-bocca.1.m4a?v=074729d07b81"}, "versions": {"clown": "074729d07b81"}}, {"id": "morning-oro-in-bocca.2", "text": "Io ho il cerone, che vale un po' meno.", "en": "Io ho il cerone, che vale un po' meno.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-oro-in-bocca", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-oro-in-bocca.2.m4a?v=7c59c23027ae"}, "versions": {"clown": "7c59c23027ae"}}, {"id": "morning-zucchero.1", "text": "Caffè senza zucchero, come la mia vita.", "en": "Caffè senza zucchero, come la mia vita.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-zucchero", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-zucchero.1.m4a?v=c40cf82f150b"}, "versions": {"clown": "c40cf82f150b"}}, {"id": "morning-zucchero.2", "text": "No, scherzo. Due cucchiaini. La vita no.", "en": "No, scherzo. Due cucchiaini. La vita no.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-zucchero", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-zucchero.2.m4a?v=5d9101869012"}, "versions": {"clown": "5d9101869012"}}, {"id": "morning-prima-risata.1", "text": "Sveglia alle sette, trucco alle otto.", "en": "Sveglia alle sette, trucco alle otto.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-prima-risata", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-prima-risata.1.m4a?v=c3375238f3fe"}, "versions": {"clown": "c3375238f3fe"}}, {"id": "morning-prima-risata.2", "text": "Prima risata prevista per il 2031.", "en": "Prima risata prevista per il 2031.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-prima-risata", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-prima-risata.2.m4a?v=54b3f6de4338"}, "versions": {"clown": "54b3f6de4338"}}, {"id": "morning-stile.1", "text": "Buongiorno! Ho già sbagliato il trucco tre volte.", "en": "Buongiorno! Ho già sbagliato il trucco tre volte.", "flavor": "silly", "slot": "morning", "tags": "", "joke": "morning-stile", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-stile.1.m4a?v=4705df1081c6"}, "versions": {"clown": "4705df1081c6"}}, {"id": "morning-stile.2", "text": "La quarta la chiamo stile.", "en": "La quarta la chiamo stile.", "flavor": "silly", "slot": "morning", "tags": "", "joke": "morning-stile", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-stile.2.m4a?v=92d8fa156a6c"}, "versions": {"clown": "92d8fa156a6c"}}, {"id": "morning-ridi-pagliaccio.1", "text": "«Ridi, Pagliaccio», dice l'opera.", "en": "«Ridi, Pagliaccio», dice l'opera.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-ridi-pagliaccio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-ridi-pagliaccio.1.m4a?v=994bc33c56be"}, "versions": {"clown": "994bc33c56be"}}, {"id": "morning-ridi-pagliaccio.2", "text": "Facile, alle nove di mattina.", "en": "Facile, alle nove di mattina.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-ridi-pagliaccio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-ridi-pagliaccio.2.m4a?v=3f08cacdeaa8"}, "versions": {"clown": "3f08cacdeaa8"}}, {"id": "afternoon-shoes", "text": "Il pomeriggio è lungo. Le mie scarpe, di più.", "en": "The afternoon is long. My shoes are longer.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/afternoon-shoes.m4a?v=5a11dcd2abba"}, "versions": {"clown": "5a11dcd2abba"}}, {"id": "afternoon-matinee", "text": "Spettacolo pomeridiano: biglietto ridotto. Anche le risate.", "en": "Matinee time. Half-price tickets, half-price laughs.", "flavor": "dry", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/afternoon-matinee.m4a?v=2fc0703f9c23"}, "versions": {"clown": "2fc0703f9c23"}}, {"id": "afternoon-lunch-pie", "text": "Dopo pranzo ho lasciato il naso al sole. Adesso è maturo.", "en": "Lunch was a pie. I'm still finding it in my ears.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/afternoon-lunch-pie.m4a?v=3e609a8b0b1a"}, "versions": {"clown": "3e609a8b0b1a"}}, {"id": "afternoon-nap-horn.1", "text": "Ho provato a fare un pisolino.", "en": "I tried an afternoon nap.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "afternoon-nap-horn", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-nap-horn.1.m4a?v=ecbd73f39180"}, "versions": {"clown": "ecbd73f39180"}}, {"id": "afternoon-nap-horn.2", "text": "Mi sono girato sopra la trombetta. Si è svegliato tutto il circo.", "en": "Rolled over on my horn. Woke the whole circus.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "afternoon-nap-horn", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-nap-horn.2.m4a?v=6a90106db23b"}, "versions": {"clown": "6a90106db23b"}}, {"id": "afternoon-shadow.1", "text": "Nel pomeriggio la mia ombra si allunga.", "en": "My shadow's getting longer.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-shadow", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-shadow.1.m4a?v=8a82628ee544"}, "versions": {"clown": "8a82628ee544"}}, {"id": "afternoon-shadow.2", "text": "Ormai porta il mio numero di scarpe.", "en": "It's started wearing my shoes.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-shadow", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-shadow.2.m4a?v=1b1588a53444"}, "versions": {"clown": "1b1588a53444"}}, {"id": "afternoon-siesta.1", "text": "Siesta nella mia macchinina da circo.", "en": "Siesta time. I'll lie down in my tiny car.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-siesta", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-siesta.1.m4a?v=bf250b493991"}, "versions": {"clown": "bf250b493991"}}, {"id": "afternoon-siesta.2", "text": "C'è posto per dodici pagliacci. Mi allargo.", "en": "All twelve of me.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-siesta", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-siesta.2.m4a?v=95a51779db2f"}, "versions": {"clown": "95a51779db2f"}}, {"id": "afternoon-cannon.1", "text": "Il sole è nel punto più alto.", "en": "The sun is at its highest.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-cannon", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-cannon.1.m4a?v=18451ed456d6"}, "versions": {"clown": "18451ed456d6"}}, {"id": "afternoon-cannon.2", "text": "Io, sparato dal cannone, al massimo arrivo al primo piano.", "en": "Higher than any clown ever fired from a cannon.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-cannon", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-cannon.2.m4a?v=45fa195827a0"}, "versions": {"clown": "45fa195827a0"}}, {"id": "afternoon-pranzo-torta.1", "text": "Pausa pranzo: una torta. Stavolta in bocca.", "en": "Pausa pranzo: una torta. Stavolta in bocca.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "afternoon-pranzo-torta", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-pranzo-torta.1.m4a?v=ca8b501d425e"}, "versions": {"clown": "ca8b501d425e"}}, {"id": "afternoon-pranzo-torta.2", "text": "Che lusso.", "en": "Che lusso.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "afternoon-pranzo-torta", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-pranzo-torta.2.m4a?v=9cedaf502193"}, "versions": {"clown": "9cedaf502193"}}, {"id": "afternoon-naso-in-tasca.1", "text": "Le tre del pomeriggio, l'ora più seria del giorno.", "en": "Le tre del pomeriggio, l'ora più seria del giorno.", "flavor": "dry", "slot": "afternoon", "tags": "", "joke": "afternoon-naso-in-tasca", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-naso-in-tasca.1.m4a?v=b94241115030"}, "versions": {"clown": "b94241115030"}}, {"id": "afternoon-naso-in-tasca.2", "text": "Persino io tengo il naso in tasca.", "en": "Persino io tengo il naso in tasca.", "flavor": "dry", "slot": "afternoon", "tags": "", "joke": "afternoon-naso-in-tasca", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-naso-in-tasca.2.m4a?v=2e08a45eb57f"}, "versions": {"clown": "2e08a45eb57f"}}, {"id": "afternoon-equilibrio.1", "text": "Pomeriggio: il sole è alto, il morale è basso.", "en": "Pomeriggio: il sole è alto, il morale è basso.", "flavor": "bittersweet", "slot": "afternoon", "tags": "", "joke": "afternoon-equilibrio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-equilibrio.1.m4a?v=20a5fb216d74"}, "versions": {"clown": "20a5fb216d74"}}, {"id": "afternoon-equilibrio.2", "text": "Le scarpe, sempre lunghe. Equilibrio.", "en": "Le scarpe, sempre lunghe. Equilibrio.", "flavor": "bittersweet", "slot": "afternoon", "tags": "", "joke": "afternoon-equilibrio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-equilibrio.2.m4a?v=aa5c1c4bd7c5"}, "versions": {"clown": "aa5c1c4bd7c5"}}, {"id": "afternoon-merenda.1", "text": "Ora di merenda. Ho un panino nella manica.", "en": "Snack time. There's a sandwich up my sleeve.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-merenda", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-merenda.1.m4a?v=73ea2a7aea41"}, "versions": {"clown": "73ea2a7aea41"}}, {"id": "afternoon-merenda.2", "text": "Era per un numero di magia. È andato male.", "en": "It was for a magic trick. That went badly.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-merenda", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-merenda.2.m4a?v=3144a7039885"}, "versions": {"clown": "3144a7039885"}}, {"id": "evening-sincere", "text": "Sera: l'ora in cui il trucco comincia a sembrare sincero.", "en": "Evening: the hour my makeup starts to feel sincere.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/evening-sincere.m4a?v=a5f57c69ab91"}, "versions": {"clown": "a5f57c69ab91"}}, {"id": "evening-sun-bow", "text": "Tramonto. Il sole fa l'inchino. Nemmeno un fiore dal pubblico.", "en": "The sun's taking its bow. Not one flower thrown.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/evening-sun-bow.m4a?v=1f6b86f87077"}, "versions": {"clown": "1f6b86f87077"}}, {"id": "evening-waiter.1", "text": "Cena da solo. Il cameriere mi porta una torta.", "en": "Dinner for one. The waiter brought a pie.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-waiter", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-waiter.1.m4a?v=e6d0ed634811"}, "versions": {"clown": "e6d0ed634811"}}, {"id": "evening-waiter.2", "text": "Mi conosce.", "en": "He knows me.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-waiter", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-waiter.2.m4a?v=a97ef0cb0ac3"}, "versions": {"clown": "a97ef0cb0ac3"}}, {"id": "evening-shoes-off.1", "text": "La sera comincio a togliermi le scarpe.", "en": "I start taking my shoes off in the evening.", "flavor": "silly", "slot": "evening", "tags": "", "joke": "evening-shoes-off", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-shoes-off.1.m4a?v=9f7aa01b1d82"}, "versions": {"clown": "9f7aa01b1d82"}}, {"id": "evening-shoes-off.2", "text": "Finisco verso mezzanotte.", "en": "I finish around midnight.", "flavor": "silly", "slot": "evening", "tags": "", "joke": "evening-shoes-off", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-shoes-off.2.m4a?v=fd615c243946"}, "versions": {"clown": "fd615c243946"}}, {"id": "evening-quiet-applause.1", "text": "La sera metto su il disco degli applausi.", "en": "If the stars are applause, I'm doing great tonight.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-quiet-applause", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-quiet-applause.1.m4a?v=625a36de2fdf"}, "versions": {"clown": "625a36de2fdf"}}, {"id": "evening-quiet-applause.2", "text": "A volume basso. Non voglio montarmi la testa.", "en": "Very quiet applause.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-quiet-applause", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-quiet-applause.2.m4a?v=2884a34e2aca"}, "versions": {"clown": "2884a34e2aca"}}, {"id": "evening-sotto-il-trucco.1", "text": "La sera mi strucco.", "en": "Every evening I take my makeup off.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-sotto-il-trucco", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-sotto-il-trucco.1.m4a?v=3846ee3cdabc"}, "versions": {"clown": "3846ee3cdabc"}}, {"id": "evening-sotto-il-trucco.2", "text": "Sotto c'è un altro pagliaccio. Più piccolo.", "en": "Underneath there's another clown. Smaller.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-sotto-il-trucco", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-sotto-il-trucco.2.m4a?v=e3c6de566046"}, "versions": {"clown": "e3c6de566046"}}, {"id": "evening-conto-risate.1", "text": "La sera conto le risate della giornata.", "en": "In the evening I count the day's laughs.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-conto-risate", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-conto-risate.1.m4a?v=f6c61b7508fb"}, "versions": {"clown": "f6c61b7508fb"}}, {"id": "evening-conto-risate.2", "text": "Faccio presto.", "en": "It doesn't take long.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-conto-risate", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-conto-risate.2.m4a?v=0ef573f78fdf"}, "versions": {"clown": "0ef573f78fdf"}}, {"id": "evening-in-pigiama.1", "text": "Una volta a quest'ora andavo in scena.", "en": "Una volta a quest'ora andavo in scena.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-in-pigiama", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-in-pigiama.1.m4a?v=21aa47d450f2"}, "versions": {"clown": "21aa47d450f2"}}, {"id": "evening-in-pigiama.2", "text": "Adesso vado in pigiama. Stesso entusiasmo.", "en": "Adesso vado in pigiama. Stesso entusiasmo.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-in-pigiama", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-in-pigiama.2.m4a?v=ec05e85a9cc3"}, "versions": {"clown": "ec05e85a9cc3"}}, {"id": "evening-ultimo-a-dormire.1", "text": "Si fa sera. Il sorriso dipinto", "en": "Si fa sera. Il sorriso dipinto", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-ultimo-a-dormire", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-ultimo-a-dormire.1.m4a?v=70c1ed656f24"}, "versions": {"clown": "70c1ed656f24"}}, {"id": "evening-ultimo-a-dormire.2", "text": "è sempre l'ultimo ad andare a dormire.", "en": "è sempre l'ultimo ad andare a dormire.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-ultimo-a-dormire", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-ultimo-a-dormire.2.m4a?v=d50d780ebd80"}, "versions": {"clown": "d50d780ebd80"}}, {"id": "night-moon", "text": "È tardi. Anche la luna si è struccata.", "en": "It's late. Even the moon took its makeup off.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/night-moon.m4a?v=1829645ed70f"}, "versions": {"clown": "1829645ed70f"}}, {"id": "night-sheep.1", "text": "La notte conto le pecore.", "en": "I count sheep at night.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-sheep", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-sheep.1.m4a?v=0613324fe8fc"}, "versions": {"clown": "0613324fe8fc"}}, {"id": "night-sheep.2", "text": "Fanno un numero tutto loro. Meglio del mio.", "en": "They do a little routine. Better than mine.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-sheep", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-sheep.2.m4a?v=66f549f6c5c8"}, "versions": {"clown": "66f549f6c5c8"}}, {"id": "night-nightcap.1", "text": "Dormo col berretto da notte con il campanellino.", "en": "I sleep in a nightcap with a bell.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-nightcap", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-nightcap.1.m4a?v=d4404a3c4988"}, "versions": {"clown": "d4404a3c4988"}}, {"id": "night-nightcap.2", "text": "Ogni volta che mi giro: un piccolo bis.", "en": "Every time I turn over: a tiny encore.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-nightcap", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-nightcap.2.m4a?v=78a89ba5fe11"}, "versions": {"clown": "78a89ba5fe11"}}, {"id": "night-owl", "text": "Io e i gufi, svegli a quest'ora. Tutti e due con gli occhi molto truccati.", "en": "Night owls and clowns. We both wear a lot around the eyes.", "flavor": "silly", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/night-owl.m4a?v=70f34647f01b"}, "versions": {"clown": "70f34647f01b"}}, {"id": "night-clock", "text": "È tardi. A dare i numeri siamo rimasti io e l'orologio.", "en": "It's late. The clock and I are the only ones still doing bits.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/night-clock.m4a?v=dba49354eaca"}, "versions": {"clown": "dba49354eaca"}}, {"id": "night-nightlight.1", "text": "Di notte faccio la guardia al circo.", "en": "I keep my nose on at night.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-nightlight", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-nightlight.1.m4a?v=ea0c1b4538da"}, "versions": {"clown": "ea0c1b4538da"}}, {"id": "night-nightlight.2", "text": "Nessuno ruba mai niente. Neanche le mie battute.", "en": "It's a nightlight. A sad one, but it works.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-nightlight", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-nightlight.2.m4a?v=77d1375e5da9"}, "versions": {"clown": "77d1375e5da9"}}, {"id": "night-pie-drop.1", "text": "Di notte il circo è così silenzioso", "en": "At night the circus is so quiet", "flavor": "silly", "slot": "night", "tags": "[whispers]", "joke": "night-pie-drop", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-pie-drop.1.m4a?v=9c3abf5e490c"}, "versions": {"clown": "9c3abf5e490c"}}, {"id": "night-pie-drop.2", "text": "che si sente volare una torta.", "en": "you can hear a pie drop.", "flavor": "silly", "slot": "night", "tags": "[whispers]", "joke": "night-pie-drop", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-pie-drop.2.m4a?v=7f1c7043fdf7"}, "versions": {"clown": "7f1c7043fdf7"}}, {"id": "night-luna-storta.1", "text": "Stasera ho la luna storta.", "en": "Stasera ho la luna storta.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-luna-storta", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-luna-storta.1.m4a?v=7b42212f0453"}, "versions": {"clown": "7b42212f0453"}}, {"id": "night-luna-storta.2", "text": "L'ho truccata io, è venuta male.", "en": "L'ho truccata io, è venuta male.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-luna-storta", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-luna-storta.2.m4a?v=55a8161e648c"}, "versions": {"clown": "55a8161e648c"}}, {"id": "night-calzino.1", "text": "Di notte spengo il naso.", "en": "Di notte spengo il naso.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-calzino", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-calzino.1.m4a?v=d3900c66bd21"}, "versions": {"clown": "d3900c66bd21"}}, {"id": "night-calzino.2", "text": "Scherzo, non si spegne. Ci metto sopra un calzino.", "en": "Scherzo, non si spegne. Ci metto sopra un calzino.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-calzino", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-calzino.2.m4a?v=361f53e30442"}, "versions": {"clown": "361f53e30442"}}, {"id": "night-notaio.1", "text": "Di notte sogno di fare il notaio.", "en": "Di notte sogno di fare il notaio.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-notaio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-notaio.1.m4a?v=76f2f31a3293"}, "versions": {"clown": "76f2f31a3293"}}, {"id": "night-notaio.2", "text": "Mi tirano le torte lo stesso.", "en": "Mi tirano le torte lo stesso.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-notaio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-notaio.2.m4a?v=c472b8124f18"}, "versions": {"clown": "c472b8124f18"}}, {"id": "night-non-piglia-pesci.1", "text": "Chi dorme non piglia pesci.", "en": "Chi dorme non piglia pesci.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-non-piglia-pesci", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-non-piglia-pesci.1.m4a?v=afc2ef0df834"}, "versions": {"clown": "afc2ef0df834"}}, {"id": "night-non-piglia-pesci.2", "text": "Io non dormo e piglio solo torte.", "en": "Io non dormo e piglio solo torte.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-non-piglia-pesci", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-non-piglia-pesci.2.m4a?v=d705b4f72076"}, "versions": {"clown": "d705b4f72076"}}, {"id": "night-pubblico-difficile.1", "text": "È tardi. Le stelle sono tutte accese", "en": "È tardi. Le stelle sono tutte accese", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-pubblico-difficile", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-pubblico-difficile.1.m4a?v=109d267bb885"}, "versions": {"clown": "109d267bb885"}}, {"id": "night-pubblico-difficile.2", "text": "e nessuna ride. Pubblico difficile.", "en": "e nessuna ride. Pubblico difficile.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-pubblico-difficile", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-pubblico-difficile.2.m4a?v=8c0645446e2e"}, "versions": {"clown": "8c0645446e2e"}}, {"id": "monday-happy-face", "text": "Lunedì. La mia faccia allegra è ancora in lavatrice.", "en": "Monday. My happy face is still in the wash.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/monday-happy-face.m4a?v=c29790ef1e04"}, "versions": {"clown": "c29790ef1e04"}}, {"id": "monday-first-pie", "text": "Lunedì. La prima torta la tira la settimana.", "en": "Monday. The week throws the first pie.", "flavor": "absurd", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/monday-first-pie.m4a?v=f6f14ed2bb39"}, "versions": {"clown": "f6f14ed2bb39"}}, {"id": "monday-warm-up", "text": "Il lunedì il naso lo metto piano piano. Prima lo faccio scaldare.", "en": "On Mondays I put the nose on slowly. Let it warm up.", "flavor": "dry", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/monday-warm-up.m4a?v=bdff988f973f"}, "versions": {"clown": "bdff988f973f"}}, {"id": "monday-agree", "text": "A nessuno piace il lunedì. Finalmente tutti d'accordo con me.", "en": "Nobody likes Mondays. Finally, something everyone agrees with me on.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/monday-agree.m4a?v=57209e257f02"}, "versions": {"clown": "57209e257f02"}}, {"id": "monday-grigio.1", "text": "Lunedì. Naso rosso, umore grigio.", "en": "Lunedì. Naso rosso, umore grigio.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "monday-grigio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/monday-grigio.1.m4a?v=a87a1fe7a093"}, "versions": {"clown": "a87a1fe7a093"}}, {"id": "monday-grigio.2", "text": "Almeno i colori stanno bene insieme.", "en": "Almeno i colori stanno bene insieme.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "monday-grigio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/monday-grigio.2.m4a?v=7ce904b8d96c"}, "versions": {"clown": "7ce904b8d96c"}}, {"id": "monday-riapre.1", "text": "Lunedì. Il circo riapre.", "en": "Lunedì. Il circo riapre.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "monday-riapre", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/monday-riapre.1.m4a?v=3c98fd842a89"}, "versions": {"clown": "3c98fd842a89"}}, {"id": "monday-riapre.2", "text": "Io no, ma vado lo stesso.", "en": "Io no, ma vado lo stesso.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "monday-riapre", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/monday-riapre.2.m4a?v=39e580bfbce5"}, "versions": {"clown": "39e580bfbce5"}}, {"id": "friday-pie-treat", "text": "Venerdì! Naso lucidato, trombetta accordata. Ha una nota sola, si fa presto.", "en": "Friday. I'm treating myself to a pie. Eaten, not thrown.", "flavor": "silly", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/friday-pie-treat.m4a?v=ba3d695b1007"}, "versions": {"clown": "ba3d695b1007"}}, {"id": "friday-cartwheel", "text": "Venerdì. Farei la ruota, ma non faccio straordinari.", "en": "Friday. I'd do a cartwheel, but I don't do overtime.", "flavor": "dry", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/friday-cartwheel.m4a?v=6fe89f97df30"}, "versions": {"clown": "6fe89f97df30"}}, {"id": "friday-big-weekend.1", "text": "Programmi per il weekend: togliere il naso. Rimetterlo.", "en": "My weekend plans: take the nose off. Put it back on.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-big-weekend", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-big-weekend.1.m4a?v=730371728470"}, "versions": {"clown": "730371728470"}}, {"id": "friday-big-weekend.2", "text": "Weekend impegnativo.", "en": "Big weekend.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-big-weekend", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-big-weekend.2.m4a?v=63e7559bdbe9"}, "versions": {"clown": "63e7559bdbe9"}}, {"id": "friday-sweep.1", "text": "Venerdì. Il circo chiude presto.", "en": "Friday. The circus closes early.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-sweep", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-sweep.1.m4a?v=0af23475f510"}, "versions": {"clown": "0af23475f510"}}, {"id": "friday-sweep.2", "text": "Il pagliaccio resta a spazzare le risate avanzate.", "en": "The clown stays behind to sweep up the laughs.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-sweep", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-sweep.2.m4a?v=3a1fa2b5f7de"}, "versions": {"clown": "3a1fa2b5f7de"}}, {"id": "friday-venerdi.1", "text": "Chi ride il venerdì piange la domenica.", "en": "Chi ride il venerdì piange la domenica.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-venerdi", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-venerdi.1.m4a?v=06e3ce4955a1"}, "versions": {"clown": "06e3ce4955a1"}}, {"id": "friday-venerdi.2", "text": "Io porto avanti il lavoro: piango già adesso.", "en": "Io porto avanti il lavoro: piango già adesso.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-venerdi", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-venerdi.2.m4a?v=e212015c09a6"}, "versions": {"clown": "e212015c09a6"}}, {"id": "friday-meta.1", "text": "Venerdì! Stasera mi strucco solo a metà.", "en": "Venerdì! Stasera mi strucco solo a metà.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-meta", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-meta.1.m4a?v=cecded6644f8"}, "versions": {"clown": "cecded6644f8"}}, {"id": "friday-meta.2", "text": "Il sorriso lo tengo per il weekend.", "en": "Il sorriso lo tengo per il weekend.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-meta", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-meta.2.m4a?v=800c881cf277"}, "versions": {"clown": "800c881cf277"}}, {"id": "weekend-serious", "text": "Il fine settimana: finalmente un pagliaccio può essere serio in pace.", "en": "The weekend: a clown can finally be serious in peace.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/weekend-serious.m4a?v=796f31ad118e"}, "versions": {"clown": "796f31ad118e"}}, {"id": "weekend-civilian.1", "text": "Nel weekend vado al circo da spettatore.", "en": "Weekend. I go out without makeup.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-civilian", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-civilian.1.m4a?v=5863cff868f6"}, "versions": {"clown": "5863cff868f6"}}, {"id": "weekend-civilian.2", "text": "Il pagliaccio è peggio di me. Che bel weekend.", "en": "Nobody recognizes me. Same as with makeup.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-civilian", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-civilian.2.m4a?v=293f9882e9ee"}, "versions": {"clown": "293f9882e9ee"}}, {"id": "weekend-shoes-on", "text": "Nel weekend dormo con le scarpe. Così il lunedì risparmio tempo.", "en": "On weekends I sleep in my shoes. It saves time on Monday.", "flavor": "absurd", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/weekend-shoes-on.m4a?v=cf9958ffc03d"}, "versions": {"clown": "cf9958ffc03d"}}, {"id": "weekend-mime-hobby.1", "text": "Nel weekend, per hobby, faccio il mimo.", "en": "My weekend hobby is mime.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "weekend-mime-hobby", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-mime-hobby.1.m4a?v=06f8ae09570c"}, "versions": {"clown": "06f8ae09570c"}}, {"id": "weekend-mime-hobby.2", "text": "Dicono che sono migliorato.", "en": "People say it's an improvement.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "weekend-mime-hobby", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-mime-hobby.2.m4a?v=384ff7b5bc4f"}, "versions": {"clown": "384ff7b5bc4f"}}, {"id": "weekend-barbecue.1", "text": "Grigliata del weekend. Io ho portato le torte.", "en": "Weekend barbecue. I brought pies.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-barbecue", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-barbecue.1.m4a?v=7f8f65f838bd"}, "versions": {"clown": "7f8f65f838bd"}}, {"id": "weekend-barbecue.2", "text": "Vecchie abitudini. Nessuno stava fermo.", "en": "Old habits. Nobody would stand still.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-barbecue", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-barbecue.2.m4a?v=7800578180ab"}, "versions": {"clown": "7800578180ab"}}, {"id": "weekend-tendone-vuoto.1", "text": "Domenica, niente spettacolo.", "en": "Domenica, niente spettacolo.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-tendone-vuoto", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-tendone-vuoto.1.m4a?v=2163fe3393d7"}, "versions": {"clown": "2163fe3393d7"}}, {"id": "weekend-tendone-vuoto.2", "text": "Mi siedo in prima fila davanti al tendone vuoto. Applaudo lo stesso.", "en": "Mi siedo in prima fila davanti al tendone vuoto. Applaudo lo stesso.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-tendone-vuoto", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-tendone-vuoto.2.m4a?v=ca0d9a3b7a2d"}, "versions": {"clown": "ca0d9a3b7a2d"}}, {"id": "weekend-dalle-scarpe.1", "text": "La domenica non mi trucco.", "en": "La domenica non mi trucco.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-dalle-scarpe", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-dalle-scarpe.1.m4a?v=4007c0a75a1c"}, "versions": {"clown": "4007c0a75a1c"}}, {"id": "weekend-dalle-scarpe.2", "text": "Mi riconoscono lo stesso. Dalle scarpe.", "en": "Mi riconoscono lo stesso. Dalle scarpe.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-dalle-scarpe", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-dalle-scarpe.2.m4a?v=a7b41b374109"}, "versions": {"clown": "a7b41b374109"}}, {"id": "poke-agent", "text": "Una battuta su richiesta. Il mio agente sarebbe fiero di me.", "en": "A joke on demand. My agent would be so proud.", "flavor": "dry", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-agent.m4a?v=1f7b7a97230e"}, "versions": {"clown": "1f7b7a97230e"}}, {"id": "poke-always-in.1", "text": "Avanti! Oggi abbiamo battute freschissime.", "en": "Ring ring! The clown is in.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-always-in", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-always-in.1.m4a?v=da271445ff93"}, "versions": {"clown": "da271445ff93"}}, {"id": "poke-always-in.2", "text": "Insomma, fresche. Dell'anno scorso.", "en": "The clown is always in.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-always-in", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-always-in.2.m4a?v=07540158bbd9"}, "versions": {"clown": "07540158bbd9"}}, {"id": "poke-nobody-asks", "text": "Una richiesta! Non me ne fanno una da quando è partito il circo.", "en": "A request! Nobody's asked since the circus left.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-nobody-asks.m4a?v=f5d36eb65688"}, "versions": {"clown": "f5d36eb65688"}}, {"id": "poke-boop", "text": "Bip! Hai trovato il naso. Si comincia sempre da lì.", "en": "Boop. You found the nose. It's always the nose.", "flavor": "silly", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-boop.m4a?v=12264bb56c23"}, "versions": {"clown": "12264bb56c23"}}, {"id": "poke-front-row", "text": "Posto in prima fila! Il migliore della sala. Anche l'unico.", "en": "Front row! Best seat in the house. Only seat, too.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-front-row.m4a?v=f0308beec15e"}, "versions": {"clown": "f0308beec15e"}}, {"id": "poke-chiamato.1", "text": "Mi hai chiamato? Nessuno mi chiama mai.", "en": "Mi hai chiamato? Nessuno mi chiama mai.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-chiamato", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-chiamato.1.m4a?v=cd385017c707"}, "versions": {"clown": "cd385017c707"}}, {"id": "poke-chiamato.2", "text": "Aspetta, mi metto il naso buono.", "en": "Aspetta, mi metto il naso buono.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-chiamato", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-chiamato.2.m4a?v=8eb45dc64227"}, "versions": {"clown": "8eb45dc64227"}}, {"id": "poke-toc-toc.1", "text": "Toc toc? Avanti, è aperto.", "en": "Toc toc? Avanti, è aperto.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-toc-toc", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-toc-toc.1.m4a?v=826c36bc6cdf"}, "versions": {"clown": "826c36bc6cdf"}}, {"id": "poke-toc-toc.2", "text": "Il circo è sempre aperto.", "en": "Il circo è sempre aperto.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-toc-toc", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-toc-toc.2.m4a?v=8caf6ea93ae2"}, "versions": {"clown": "8caf6ea93ae2"}}, {"id": "poke-signature-it", "text": "…ma chi fa ridere Mister Pagliacci?", "en": "…ma chi fa ridere Mister Pagliacci?", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-signature-it.m4a?v=32dd6da2719e"}, "versions": {"clown": "32dd6da2719e"}}, {"id": "back-saved-joke", "text": "Eccoti! Ti ho tenuto da parte una battuta. Quasi nuova.", "en": "There you are. I saved you a joke. Slightly used.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/back-saved-joke.m4a?v=b4a6ce0b419c"}, "versions": {"clown": "b4a6ce0b419c"}}, {"id": "back-find-nose", "text": "Oh! Pubblico! Un attimo, dove ho messo il naso?", "en": "Oh! An audience. Hold on, where's my nose?", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/back-find-nose.m4a?v=28698227426b"}, "versions": {"clown": "28698227426b"}}, {"id": "back-rehearsed.1", "text": "Rieccoti. Mentre eri via ho provato il numero.", "en": "Welcome back. I rehearsed while you were gone.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-rehearsed", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-rehearsed.1.m4a?v=69a54c000177"}, "versions": {"clown": "69a54c000177"}}, {"id": "back-rehearsed.2", "text": "Non è servito.", "en": "It didn't help.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-rehearsed", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-rehearsed.2.m4a?v=4700c18725cb"}, "versions": {"clown": "4700c18725cb"}}, {"id": "back-mime-show.1", "text": "Mentre eri via ho fatto uno spettacolo di mimo.", "en": "I did a mime show while you were away.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-mime-show", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-mime-show.1.m4a?v=d8c65e0485d6"}, "versions": {"clown": "d8c65e0485d6"}}, {"id": "back-mime-show.2", "text": "Non se n'è accorto nessuno. Ero bravissimo.", "en": "Nobody noticed. That's how good it was.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-mime-show", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-mime-show.2.m4a?v=2b4f86568f64"}, "versions": {"clown": "2b4f86568f64"}}, {"id": "back-moment.1", "text": "E ora, il momento che stavi aspettando.", "en": "And now, the moment you've been waiting for.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-moment", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-moment.1.m4a?v=c0eb409fb0f6"}, "versions": {"clown": "c0eb409fb0f6"}}, {"id": "back-moment.2", "text": "Io. Di nuovo. Scusa.", "en": "Me. Again. Sorry.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-moment", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-moment.2.m4a?v=55a2a8a36a20"}, "versions": {"clown": "55a2a8a36a20"}}, {"id": "back-sgonfia.1", "text": "Rieccoti! Ti ho tenuto da parte una barzelletta.", "en": "Rieccoti! Ti ho tenuto da parte una barzelletta.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "back-sgonfia", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-sgonfia.1.m4a?v=bc3a3055ac56"}, "versions": {"clown": "bc3a3055ac56"}}, {"id": "back-sgonfia.2", "text": "Si è un po' sgonfiata.", "en": "Si è un po' sgonfiata.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "back-sgonfia", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-sgonfia.2.m4a?v=e94066e5fd7e"}, "versions": {"clown": "e94066e5fd7e"}}, {"id": "back-permesso.1", "text": "Io non mi sono mosso.", "en": "Io non mi sono mosso.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-permesso", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-permesso.1.m4a?v=aa5c63a853a5"}, "versions": {"clown": "aa5c63a853a5"}}, {"id": "back-permesso.2", "text": "Con queste scarpe ci vuole il permesso del comune.", "en": "Con queste scarpe ci vuole il permesso del comune.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-permesso", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-permesso.2.m4a?v=d6bf0f7ad59c"}, "versions": {"clown": "d6bf0f7ad59c"}}, {"id": "call-mime", "text": "Tutto quel silenzio. Ne ho approfittato per ripassare il mimo.", "en": "All that quiet. I used it to practice my mime.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/call-mime.m4a?v=b4d4b0a9e4d6"}, "versions": {"clown": "b4d4b0a9e4d6"}}, {"id": "call-horn.1", "text": "Ho tenuto in mano la trombetta tutto il tempo.", "en": "I held my horn the whole time.", "flavor": "dry", "slot": "afterCall", "tags": "", "joke": "call-horn", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-horn.1.m4a?v=f52e8dda971c"}, "versions": {"clown": "f52e8dda971c"}}, {"id": "call-horn.2", "text": "Non l'ho suonata. Mai fatto niente di più difficile.", "en": "Hardest thing I've ever done.", "flavor": "dry", "slot": "afterCall", "tags": "", "joke": "call-horn", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-horn.2.m4a?v=f09805bbf762"}, "versions": {"clown": "f09805bbf762"}}, {"id": "call-tiptoe", "text": "Sono stato in punta di piedi tutto il tempo. Con queste scarpe.", "en": "I tiptoed the whole time. In these shoes.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/call-tiptoe.m4a?v=cf63b564f6ca"}, "versions": {"clown": "cf63b564f6ca"}}, {"id": "call-pigeon.1", "text": "Sono rimasto immobile tutto il tempo.", "en": "I stood perfectly still the whole time.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "call-pigeon", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-pigeon.1.m4a?v=1e4c0aab21cf"}, "versions": {"clown": "1e4c0aab21cf"}}, {"id": "call-pigeon.2", "text": "Mi si è posato sopra un piccione.", "en": "A pigeon landed on me.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "call-pigeon", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-pigeon.2.m4a?v=51939342f4c8"}, "versions": {"clown": "51939342f4c8"}}, {"id": "call-lost-joke.1", "text": "Nel frattempo mi era venuta una battuta geniale.", "en": "I thought of a great joke while you were busy.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-lost-joke", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-lost-joke.1.m4a?v=c25b7dcb3c99"}, "versions": {"clown": "c25b7dcb3c99"}}, {"id": "call-lost-joke.2", "text": "Se n'è andata. Le battute geniali non fanno anticamera.", "en": "It's gone. That's showbiz.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-lost-joke", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-lost-joke.2.m4a?v=2b42b6a08a99"}, "versions": {"clown": "2b42b6a08a99"}}, {"id": "call-mimo-timido.1", "text": "Zitto come un mimo.", "en": "Zitto come un mimo.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "call-mimo-timido", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-mimo-timido.1.m4a?v=81c63f14d91a"}, "versions": {"clown": "81c63f14d91a"}}, {"id": "call-mimo-timido.2", "text": "Un mimo timido. In uno sgabuzzino.", "en": "Un mimo timido. In uno sgabuzzino.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "call-mimo-timido", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-mimo-timido.2.m4a?v=082811e93ffa"}, "versions": {"clown": "082811e93ffa"}}, {"id": "call-applauso-muto.1", "text": "Finito? Applauso muto.", "en": "Finito? Applauso muto.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-applauso-muto", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-applauso-muto.1.m4a?v=c1efc0e2e67f"}, "versions": {"clown": "c1efc0e2e67f"}}, {"id": "call-applauso-muto.2", "text": "È l'unico che so fare bene.", "en": "È l'unico che so fare bene.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-applauso-muto", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-applauso-muto.2.m4a?v=d9577048db27"}, "versions": {"clown": "d9577048db27"}}, {"id": "shush-reviews", "text": "Posso riparlare? Il mio silenzio ha avuto ottime recensioni.", "en": "I may speak again? My silence got great reviews.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/shush-reviews.m4a?v=89eae315acc4"}, "versions": {"clown": "89eae315acc4"}}, {"id": "shush-mime-wept.1", "text": "Quel silenzio è piaciuto tantissimo.", "en": "That silence was my best work.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-mime-wept", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-mime-wept.1.m4a?v=3bae8f2b5acd"}, "versions": {"clown": "3bae8f2b5acd"}}, {"id": "shush-mime-wept.2", "text": "Una statua mi ha chiesto l'autografo.", "en": "A mime came by and wept.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-mime-wept", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-mime-wept.2.m4a?v=6a231b34ab8e"}, "versions": {"clown": "6a231b34ab8e"}}, {"id": "shush-honk.1", "text": "Posso parlare di nuovo?", "en": "I'm allowed to talk again?", "flavor": "silly", "slot": "shushEnd", "tags": "", "joke": "shush-honk", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-honk.1.m4a?v=670bfc381ec6"}, "versions": {"clown": "670bfc381ec6"}}, {"id": "shush-honk.2", "text": "Fammi ricordare come si fa. Ah, sì. Pè-pè.", "en": "Let me remember how. Ah, yes. Honk.", "flavor": "silly", "slot": "shushEnd", "tags": "", "joke": "shush-honk", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-honk.2.m4a?v=22559bd2df1b"}, "versions": {"clown": "22559bd2df1b"}}, {"id": "shush-natural", "text": "Ho provato a stare zitto. Pare che io abbia talento.", "en": "I practiced silence. Turns out I'm a natural.", "flavor": "bittersweet", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/shush-natural.m4a?v=a868b152769e"}, "versions": {"clown": "a868b152769e"}}, {"id": "shush-tutte-questa.1", "text": "Zitto zitto, ho preparato tre barzellette.", "en": "Zitto zitto, ho preparato tre barzellette.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "shush-tutte-questa", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-tutte-questa.1.m4a?v=4ae6b3c9730a"}, "versions": {"clown": "4ae6b3c9730a"}}, {"id": "shush-tutte-questa.2", "text": "Sono tutte questa.", "en": "Sono tutte questa.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "shush-tutte-questa", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-tutte-questa.2.m4a?v=5f3e9326b31d"}, "versions": {"clown": "5f3e9326b31d"}}, {"id": "shush-prestito.1", "text": "Che bel silenzio.", "en": "Che bel silenzio.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-prestito", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-prestito.1.m4a?v=ff237f301b0c"}, "versions": {"clown": "ff237f301b0c"}}, {"id": "shush-prestito.2", "text": "Un mimo me l'ha chiesto in prestito.", "en": "Un mimo me l'ha chiesto in prestito.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-prestito", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-prestito.2.m4a?v=a09c37922eab"}, "versions": {"clown": "a09c37922eab"}}, {"id": "battery-emotional", "text": "Batteria quasi a terra. Anch'io, ma per motivi sentimentali.", "en": "Battery's low. Mine too, but mine is emotional.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/battery-emotional.m4a?v=79657ea649fb"}, "versions": {"clown": "79657ea649fb"}}, {"id": "battery-balloon", "text": "Batteria scarica. Mi sento un palloncino tre giorni dopo la festa.", "en": "Battery's low. I know the feeling. I'm a balloon on day three.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/battery-balloon.m4a?v=d49399dbc2f5"}, "versions": {"clown": "d49399dbc2f5"}}, {"id": "battery-shortest.1", "text": "Batteria scarica. Ecco la mia barzelletta più corta:", "en": "Low battery. Time for my shortest joke:", "flavor": "dry", "slot": "batteryLow", "tags": "", "joke": "battery-shortest", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-shortest.1.m4a?v=c1e4e705cbd1"}, "versions": {"clown": "c1e4e705cbd1"}}, {"id": "battery-shortest.2", "text": "lo stipendio di un pagliaccio.", "en": "a clown's paycheck.", "flavor": "dry", "slot": "batteryLow", "tags": "", "joke": "battery-shortest", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-shortest.2.m4a?v=d2f98e335ab8"}, "versions": {"clown": "d2f98e335ab8"}}, {"id": "battery-red", "text": "Batteria in rosso. Come me: col naso e col conto in banca.", "en": "The battery's in the red. Finally, something matches my nose.", "flavor": "silly", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/battery-red.m4a?v=52d6065b626f"}, "versions": {"clown": "52d6065b626f"}}, {"id": "battery-push.1", "text": "Batteria scarica. Come la mia macchinina.", "en": "Low battery. Like my tiny car.", "flavor": "absurd", "slot": "batteryLow", "tags": "", "joke": "battery-push", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-push.1.m4a?v=b84f7aeff8c1"}, "versions": {"clown": "b84f7aeff8c1"}}, {"id": "battery-push.2", "text": "Scendono dodici pagliacci a spingere.", "en": "Twelve clowns get out and push.", "flavor": "absurd", "slot": "batteryLow", "tags": "", "joke": "battery-push", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-push.2.m4a?v=f418e5169f49"}, "versions": {"clown": "f418e5169f49"}}, {"id": "battery-1998.1", "text": "Batteria quasi scarica.", "en": "Batteria quasi scarica.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "battery-1998", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-1998.1.m4a?v=43b4393f645f"}, "versions": {"clown": "43b4393f645f"}}, {"id": "battery-1998.2", "text": "Io lo sono dal 1998.", "en": "Io lo sono dal 1998.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "battery-1998", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-1998.2.m4a?v=596fd6753a62"}, "versions": {"clown": "596fd6753a62"}}, {"id": "battery-lumicino.1", "text": "Batteria al lumicino.", "en": "Batteria al lumicino.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "battery-lumicino", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-lumicino.1.m4a?v=3e430723188c"}, "versions": {"clown": "3e430723188c"}}, {"id": "battery-lumicino.2", "text": "Io ci vivo da anni, al lumicino. Ci si abitua.", "en": "Io ci vivo da anni, al lumicino. Ci si abitua.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "battery-lumicino", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-lumicino.2.m4a?v=559b8c4a7f76"}, "versions": {"clown": "559b8c4a7f76"}}, {"id": "charging-smile", "text": "In carica. Magari bastasse una presa anche per il sorriso.", "en": "Charging. If only a smile plugged in like that.", "flavor": "bittersweet", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/charging-smile.m4a?v=d5c4babd6b35"}, "versions": {"clown": "d5c4babd6b35"}}, {"id": "charging-nose-glow.1", "text": "In carica. Mi si è acceso il naso!", "en": "Plugged in. My nose is glowing.", "flavor": "silly", "slot": "charging", "tags": "", "joke": "charging-nose-glow", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-nose-glow.1.m4a?v=1168cba43366"}, "versions": {"clown": "1168cba43366"}}, {"id": "charging-nose-glow.2", "text": "Ah, no. È sempre così.", "en": "No, wait. That's just my nose.", "flavor": "silly", "slot": "charging", "tags": "", "joke": "charging-nose-glow", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-nose-glow.2.m4a?v=f409c04d7ada"}, "versions": {"clown": "f409c04d7ada"}}, {"id": "charging-applause", "text": "In carica. Finalmente qualcuno che mi dà la carica.", "en": "Ah, power. The closest thing I get to applause.", "flavor": "bittersweet", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/charging-applause.m4a?v=428803ad1b32"}, "versions": {"clown": "428803ad1b32"}}, {"id": "charging-hug.1", "text": "In carica. Anche il computer ha chi lo abbraccia.", "en": "Plugged in. Even the computer gets hugs.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "charging-hug", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-hug.1.m4a?v=1e4c584a7f17"}, "versions": {"clown": "1e4c584a7f17"}}, {"id": "charging-hug.2", "text": "Un abbraccio lungo e sottile. Si accontenta.", "en": "Long thin ones.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "charging-hug", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-hug.2.m4a?v=a41eb5aeb02a"}, "versions": {"clown": "a41eb5aeb02a"}}, {"id": "charging-tail", "text": "In carica. Il computer ha messo la coda. Manca solo il domatore.", "en": "Charging. The computer has a tail now. Very circus.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/charging-tail.m4a?v=f17fbc8689bf"}, "versions": {"clown": "f17fbc8689bf"}}, {"id": "charging-controcorrente.1", "text": "Attaccato alla corrente.", "en": "Attaccato alla corrente.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "charging-controcorrente", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-controcorrente.1.m4a?v=169b0f61b7b3"}, "versions": {"clown": "169b0f61b7b3"}}, {"id": "charging-controcorrente.2", "text": "Io invece vado controcorrente, e si vede.", "en": "Io invece vado controcorrente, e si vede.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "charging-controcorrente", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-controcorrente.2.m4a?v=ea728cd28f51"}, "versions": {"clown": "ea728cd28f51"}}, {"id": "charging-torte.1", "text": "In carica. Io mi ricarico con le torte.", "en": "In carica. Io mi ricarico con le torte.", "flavor": "silly", "slot": "charging", "tags": "", "joke": "charging-torte", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-torte.1.m4a?v=a151578e2fe7"}, "versions": {"clown": "a151578e2fe7"}}, {"id": "charging-torte.2", "text": "In faccia, purtroppo.", "en": "In faccia, purtroppo.", "flavor": "silly", "slot": "charging", "tags": "", "joke": "charging-torte", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-torte.2.m4a?v=b68c571f2f62"}, "versions": {"clown": "b68c571f2f62"}}, {"id": "unplugged-circus", "text": "Staccato dalla presa. Come un pagliaccio scappato dal circo.", "en": "Unplugged. Like a clown who wandered off from the circus.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/unplugged-circus.m4a?v=64e4bc646126"}, "versions": {"clown": "64e4bc646126"}}, {"id": "unplugged-balloon.1", "text": "Staccata la spina. Liberi!", "en": "Unplugged. Free as a balloon.", "flavor": "bittersweet", "slot": "unplugged", "tags": "", "joke": "unplugged-balloon", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-balloon.1.m4a?v=26418bf0311c"}, "versions": {"clown": "26418bf0311c"}}, {"id": "unplugged-balloon.2", "text": "Liberi come un pagliaccio a fine stagione. Cioè senza lavoro.", "en": "Let's not float off.", "flavor": "bittersweet", "slot": "unplugged", "tags": "", "joke": "unplugged-balloon", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-balloon.2.m4a?v=a3771c9dab85"}, "versions": {"clown": "a3771c9dab85"}}, {"id": "unplugged-tour", "text": "Via il cavo! Si parte in tournée.", "en": "No cable! We're on tour now.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/unplugged-tour.m4a?v=d7c8053678d4"}, "versions": {"clown": "d7c8053678d4"}}, {"id": "unplugged-no-net.1", "text": "Senza cavo. Come un funambolo senza rete.", "en": "Unplugged. Tightrope, no net.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "unplugged-no-net", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-no-net.1.m4a?v=e9b69761aa62"}, "versions": {"clown": "e9b69761aa62"}}, {"id": "unplugged-no-net.2", "text": "Che coraggio, noi due.", "en": "Very brave of us.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "unplugged-no-net", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-no-net.2.m4a?v=6393e06df37d"}, "versions": {"clown": "6393e06df37d"}}, {"id": "unplugged-a-braccio", "text": "Staccato. Si va a braccio, come ai vecchi tempi.", "en": "Staccato. Si va a braccio, come ai vecchi tempi.", "flavor": "dry", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/unplugged-a-braccio.m4a?v=fbdb106e78b0"}, "versions": {"clown": "fbdb106e78b0"}}, {"id": "unplugged-aquilone.1", "text": "Niente filo, come un aquilone.", "en": "Niente filo, come un aquilone.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "unplugged-aquilone", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-aquilone.1.m4a?v=4810eee8228a"}, "versions": {"clown": "4810eee8228a"}}, {"id": "unplugged-aquilone.2", "text": "Speriamo che nessuno tiri.", "en": "Speriamo che nessuno tiri.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "unplugged-aquilone", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-aquilone.2.m4a?v=646648d1d515"}, "versions": {"clown": "646648d1d515"}}, {"id": "dark-mysterious", "text": "Luci basse. Tocca a me fare il misterioso.", "en": "Lights down. My cue to be mysterious.", "flavor": "absurd", "slot": "wentDark", "ta
