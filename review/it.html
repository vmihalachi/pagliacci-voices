<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Voice review</title>
<style>
  /* The default colors; an app sets its own in companion.json (`voice.reviewColors`), injected after this block. */
  :root {
    --paper: #FFF8E7; --card: #FFFDF7; --ink: #3D2B1F; --ink-soft: #7A6555; --line: #E8DCC4;
    --accent: #F2C94C; --accent-soft: #FCEFC4; --on-accent: #3D2B1F;
    --done: #6B8F4E; --done-soft: #E3EDD5; --flag: #C4623A; --flag-soft: #F6DED3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1F1B17; --card: #2A241D; --ink: #EFE6D8; --ink-soft: #B3A592; --line: #3E352B;
      --accent: #E2B93F; --accent-soft: #4A3D1C; --on-accent: #3D2B1F;
      --done: #9BC07A; --done-soft: #2E3A24; --flag: #E3825C; --flag-soft: #4A2C20;
    }
  }
  :root{--paper:#F6F1E9;--card:#FFF3E6;--ink:#1C1519;--ink-soft:#5E5257;--line:#DDD3C6;--accent:#B23A1F;--accent-soft:#F3D5CB;--on-accent:#FFFFFF;--done:#2D2A8A;--done-soft:#DCDAF3;--flag:#C98A12;--flag-soft:#F7E3B5;--link:#9C2F17;}@media (prefers-color-scheme: dark){:root{--paper:#1E1A20;--card:#241E27;--ink:#EFE8DD;--ink-soft:#A89EA4;--line:#3A333D;--accent:#F2B23A;--accent-soft:#3D2F17;--on-accent:#2E1608;--done:#A9A3FF;--done-soft:#2A2752;--flag:#E0644A;--flag-soft:#44201A;--link:#F2B23A;}}
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; max-width: 980px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  .progress { flex: 1 1 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 120px; }
  .progress > i { display: block; height: 100%; background: var(--done); width: 0; transition: width .2s; }
  .count { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  button, select { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  button:hover { border-color: var(--ink-soft); }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; color: var(--on-accent); }
  button.on { background: var(--done-soft); border-color: var(--done); }
  .keys { max-width: 980px; margin: 6px auto 0; color: var(--ink-soft); font-size: 12px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--card); }
  main { max-width: 980px; margin: 0 auto; padding: 12px 16px 270px; }
  .row { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; }
  .row.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row.flagged { border-color: var(--flag); }
  .row.done .num::after { content: " ✓"; color: var(--done); }
  .num { color: var(--ink-soft); font-variant-numeric: tabular-nums; padding-top: 3px; font-size: 13px; }
  .it { font-size: 18px; font-weight: 600; }
  .en { color: var(--ink-soft); font-size: 13px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--ink-soft); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .chip.flavor-0 { background: var(--accent-soft); } .chip.flavor-1 { background: var(--flag-soft); }
  .chip.new { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .chip.waiting { border-style: dashed; }
  .chip.flavor-2 { background: var(--done-soft); } .chip.flavor-3 { background: var(--line); }
  /* A joke's later parts sit under its first, indented, joined to it. */
  .row.part { margin: -6px 0 10px 34px; border-top-style: dashed; }
  .actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .pair { display: flex; gap: 6px; } .pair button:first-child { flex: 1; }
  .actions button { font-size: 13px; padding: 3px 10px; white-space: nowrap; }
  .actions button.flag.on { background: var(--flag-soft); border-color: var(--flag); }
  .actions .playing { background: var(--accent-soft); border-color: var(--accent); }
  .note { grid-column: 2 / 4; display: none; }
  .row.flagged .note { display: block; }
  .note input { width: 100%; font: inherit; font-size: 13px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1.5px solid var(--line); padding: 10px 16px; }
  footer .inner { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
  footer textarea { width: 100%; height: 96px; resize: vertical; font: 12px/1.4 ui-monospace, monospace; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; }
  footer .side { display: grid; gap: 6px; }
  .hint { font-size: 12px; color: var(--ink-soft); }
  /* The pager sits on top of the notes footer; on wide screens it is fixed under the list instead. */
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; max-width: 980px; margin: 0 auto 10px; }
  .pager button { font-size: 13px; padding: 3px 10px; min-width: 34px; font-variant-numeric: tabular-nums; }
  .pager button[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pager button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  .pager[hidden] { display: none; }
  .pager .gap { color: var(--ink-soft); padding: 0 2px; }
  .pager .range { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .it, .en { overflow-wrap: anywhere; }
  .notice { font-size: 11px; color: var(--ink-soft); }
  /* Wide screens: the notes become a full-height column on the right, room for many flags. */
  @media (min-width: 1100px) {
    :root { --notes: clamp(320px, 28vw, 440px); }
    /* The page reserves the column, so the header bar and the list stay centered in what's left. */
    body { padding-right: var(--notes); }
    .bar, .keys, main { max-width: 1120px; }
    main { padding: 16px 24px 80px; }
    .pager { position: fixed; left: 0; right: var(--notes); bottom: 0; max-width: none; margin: 0; padding: 10px 24px; background: var(--card); border-top: 1.5px solid var(--line); }
    header { padding: 12px 24px; }
    footer { left: auto; top: 0; width: var(--notes); border-top: 0; border-left: 1.5px solid var(--line); padding: 16px; }
    footer .inner { height: 100%; display: flex; flex-direction: column; }
    footer textarea { flex: 1; height: auto; resize: none; font-size: 13px; }
    footer .side { flex: none; }
  }
  @media (max-width: 640px) {
    .row { grid-template-columns: minmax(0, 1fr); } .num { display: none; }
    .actions { flex-direction: row; flex-wrap: wrap; }
    .note { grid-column: 1; } footer .inner { grid-template-columns: 1fr; } footer textarea { height: 56px; }
    main { padding-bottom: 250px; } .keys { display: none; } .pager .range { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title"></h1>
    <select id="lang" title="Language" aria-label="Language"></select>
    <button id="listen" class="primary" title="Space">▶ Listen through</button>
    <select id="voice" title="Which voice the listen-through plays"></select>
    <select id="speed" title="Playback speed while reviewing (the app plays at your Rate setting)">
      <option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
    <select id="filter">
      <option value="all">All lines</option><option value="todo">New or not heard yet</option><option value="flagged">Flagged</option><option value="waiting">Waiting for a voice</option>
    </select>
    <div class="progress"><i id="bar"></i></div>
    <span class="count" id="count"></span>
  </div>
  <div class="keys"><kbd>Space</kbd> listen through / pause · <kbd>↓</kbd><kbd>↑</kbd> next / previous · <kbd>←</kbd><kbd>→</kbd> page · <kbd>1</kbd><kbd>2</kbd>… play the first, second… voice ·
    <kbd>R</kbd> retake the voice you just heard · <kbd>T</kbd> the text should change · <kbd>N</kbd> write a note · Flags are kept in this browser.</div>
</header>
<main id="list"></main>
<footer>
  <nav class="pager" id="pager" aria-label="Pages"></nav>
  <div class="inner">
    <textarea id="summary" readonly placeholder="Flag what sounds off; your notes for Claude appear here."></textarea>
    <div class="side">
      <button id="copy" class="primary">Copy notes for Claude</button>
      <button id="clear">Clear flags</button>
      <span class="hint" id="copied"></span>
      <span class="notice" id="notice" hidden></span>
    </div>
  </div>
</footer>
<script>
const DATA = {"lang": "it", "languageName": "Italian", "voices": [{"kind": "clown", "name": "Stefano"}], "rows": [{"id": "general-red-nose", "text": "Ho il naso rosso. E pure il conto in banca.", "en": "My nose is red. So is my bank account.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-red-nose.m4a?v=478b9b76153c"}, "versions": {"clown": "478b9b76153c"}}, {"id": "general-juggling.1", "text": "Ho provato a fare il giocoliere con i miei problemi.", "en": "I tried juggling my problems.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-juggling", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-juggling.2", "text": "Ora sono tutti per terra. E anch'io.", "en": "Now they're all on the floor. So am I.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-juggling", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-pie-flavor.1", "text": "Trent'anni di torte in faccia.", "en": "Thirty years of pies in the face.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pie-flavor", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-pie-flavor.2", "text": "Ancora non so che gusto avessero.", "en": "I still don't know what flavor they were.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pie-flavor", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-pie-diet", "text": "Sono a dieta: solo palloncini. Gonfiano, ma non ingrassano.", "en": "I'm on a strict diet. Only the pies that hit me.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-pie-diet.m4a?v=21c69a0ef8c7"}, "versions": {"clown": "21c69a0ef8c7"}}, {"id": "general-pie-hug", "text": "Una torta in faccia è solo un abbraccio con la crema.", "en": "A pie in the face is just a hug with filling.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-pratfall.1", "text": "Cado per mestiere.", "en": "I fall down for a living.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pratfall", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pratfall.1.m4a?v=4f598a03cb87"}, "versions": {"clown": "4f598a03cb87"}}, {"id": "general-pratfall.2", "text": "Rialzarmi è volontariato.", "en": "Getting up is unpaid.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pratfall", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pratfall.2.m4a?v=17659143db16"}, "versions": {"clown": "17659143db16"}}, {"id": "general-squirting-flower", "text": "Il mio fiore spruzzino è l'unica pianta che mi è sopravvissuta.", "en": "My squirting flower is the only plant I've kept alive.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-squirting-flower.m4a?v=2245e2fa6019"}, "versions": {"clown": "2245e2fa6019"}}, {"id": "general-tear.1", "text": "Mi chiedono se la lacrima sulla guancia è dipinta.", "en": "People ask if the tear on my cheek is painted.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-tear", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-tear.2", "text": "Quasi sempre. Certi giorni risparmio sul colore.", "en": "Mostly. Some days I save on paint.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-tear", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-balloon-dog.1", "text": "Ho fatto un cane coi palloncini.", "en": "I made a balloon dog.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-balloon-dog", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-balloon-dog.2", "text": "È scappato con una giraffa di palloncini. Sembrano felici.", "en": "It ran off with a balloon giraffe. They seem happy.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-balloon-dog", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-long-shoes.1", "text": "Ho le scarpe così lunghe", "en": "My shoes are so long", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-long-shoes", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-long-shoes.2", "text": "che arrivano nei posti un secondo prima di me.", "en": "I get to places a second before I do.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-long-shoes", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-unicycle", "text": "Ho preso il monociclo per risparmiare. Metà delle ruote.", "en": "I bought a unicycle to save money. Half the wheels.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-mime-argument", "text": "Ho litigato con un mimo. Non ha replicato. Ha vinto lui.", "en": "I argued with a mime. He had no comeback. Still won.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-poster.1", "text": "Il direttore mi aveva promesso il nome in cartellone.", "en": "The ringmaster promised me top billing.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-poster", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-poster.2", "text": "Ci sono. In basso a destra. Sotto l'elefante.", "en": "I'm on the poster. Bottom right. Under the elephant.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-poster", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-lion-chair.1", "text": "Il domatore ha una frusta e una sedia. Io ho una sedia.", "en": "The lion tamer has a whip and a chair. I have a chair.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-lion-chair", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-lion-chair.2", "text": "Più che altro mi ci siedo.", "en": "Mostly I sit on it.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-lion-chair", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-strongman.1", "text": "Il forzuto solleva un pianoforte. Io sollevo il morale.", "en": "The strongman lifts a piano. I lift spirits.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-strongman", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-strongman.1.m4a?v=9d319f00bf9c"}, "versions": {"clown": "9d319f00bf9c"}}, {"id": "general-strongman.2", "text": "Il morale pesa di più.", "en": "Spirits are heavier.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-strongman", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-strongman.2.m4a?v=32c52b4db5ce"}, "versions": {"clown": "32c52b4db5ce"}}, {"id": "general-standing-ovation", "text": "Mi sono applaudito in piedi. Beh, in piedi ero già.", "en": "I gave myself a standing ovation. Well. I was standing.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-makeup-hour.1", "text": "Ho passato un'ora a truccarmi.", "en": "I spent an hour on my makeup.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-makeup-hour", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-makeup-hour.2", "text": "Sono triste uguale. Ma a colori.", "en": "Now I look exactly as sad, but in color.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-makeup-hour", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-retire", "text": "I pagliacci non vanno in pensione. A un certo punto il trucco non serve più.", "en": "Clowns never retire. We just stop needing the makeup.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-small-apartment.1", "text": "Adesso abito quassù.", "en": "I live up here now.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-small-apartment", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-small-apartment.2", "text": "Monolocale. Bella vista sull'orologio.", "en": "Small apartment. Great view of the clock.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-small-apartment", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-clock-neighbor", "text": "Il mio vicino è l'orologio. Non ride mai, ma che tempi comici.", "en": "My neighbor is the clock. Never laughs, but what timing.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-mother.1", "text": "Da piccolo facevo ridere tutta la classe.", "en": "My mother wanted me to have a serious job.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-mother", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-mother.2", "text": "Adesso hanno tutti casa e figli. Io ho ancora il naso rosso.", "en": "I'm very serious about it. That's the problem.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-mother", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-sad-trombone.1", "text": "Risparmio per comprarmi un trombone. Per i finali tristi.", "en": "I'm saving up for my own sad trombone.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-sad-trombone", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-sad-trombone.2", "text": "A noleggio, con tutti quelli che faccio, mi rovino.", "en": "Renting one every time adds up.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-sad-trombone", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-tent.1", "text": "Il circo è partito senza di me.", "en": "The circus left town without me.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-tent", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-tent.2", "text": "Ero nel tendone. Si sono portati via il tendone.", "en": "I was in the tent. They took the tent.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-tent", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-good-news.1", "text": "Bella notizia: finalmente ho fatto ridere qualcuno.", "en": "Good news: I finally made someone laugh.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-good-news", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-good-news.2", "text": "Brutta notizia: ero scivolato sulla mia scarpa.", "en": "Bad news: I'd slipped on my own shoe.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-good-news", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-cheer-up.1", "text": "Un pagliaccio non deve mai prendersi sul serio.", "en": "Everyone tells the clown to cheer up.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-cheer-up", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-cheer-up.2", "text": "Nessun pericolo. Non mi prende sul serio nessuno.", "en": "I'm at work. This is the cheered-up version.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-cheer-up", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-safety-net.1", "text": "La vita è un filo sospeso. Io sto nella rete.", "en": "Life is a tightrope. I'm in the safety net.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-safety-net", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-safety-net.2", "text": "Ci sto da anni. Si sta comodi.", "en": "Been here for years. It's comfy.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-safety-net", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-banana", "text": "Ogni buccia di banana che vedo, penso: sarà un'offerta di lavoro?", "en": "Every banana peel I see, I think: is this a job offer?", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-elephant.1", "text": "L'elefante ha una memoria di ferro.", "en": "The elephant never forgets.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-elephant", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-elephant.2", "text": "Per questo ancora non mi rivolge la parola.", "en": "Which is why he still won't talk to me.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-elephant", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-acrobats.1", "text": "Gli acrobati volano. I pagliacci cadono.", "en": "Acrobats fly. Clowns fall.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-acrobats", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-acrobats.2", "text": "Stesso volo. Critiche diverse.", "en": "Same trip. Different reviews.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-acrobats", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-fortune-teller.1", "text": "La cartomante mi ha letto la mano.", "en": "The fortune teller read my palm.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fortune-teller", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-fortune-teller.2", "text": "Si è messa a ridere. Prima volta che mi riesce.", "en": "She laughed. First time that's worked.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fortune-teller", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-waterproof", "text": "Il mio agente dice che ho un grande futuro. Lo dice da trent'anni.", "en": "My smile is painted on. Low maintenance. Very waterproof.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-confetti.1", "text": "Tengo i coriandoli in tasca per le belle notizie.", "en": "I keep confetti in my pocket for good news.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-confetti", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-confetti.2", "text": "Sono coriandoli molto vecchi.", "en": "It's very old confetti.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-confetti", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-double-knot", "text": "Pure i palloncini cercano di andarsene. Faccio il doppio nodo.", "en": "Even my balloons try to leave. I tie double knots.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "general-one-man-show.1", "text": "Hanno recensito il mio spettacolo.", "en": "My one-man show got a review.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-one-man-show", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-one-man-show.2", "text": "Una riga sola. Il mio nome, scritto male.", "en": "“One man.” That was the review.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-one-man-show", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-encore.1", "text": "Faccio sempre il bis.", "en": "I always do an encore.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-encore", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-encore.2", "text": "Non me lo chiede nessuno. È questo il coraggio.", "en": "Nobody asks. That's what makes it brave.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-encore", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-rubber-chicken.1", "text": "Io e il mio pollo di gomma non ci parliamo più.", "en": "My rubber chicken and I don't talk anymore.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-rubber-chicken", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-rubber-chicken.2", "text": "Divergenze artistiche. Voleva fare l'anatra.", "en": "Creative differences. He wanted to be a duck.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-rubber-chicken", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-time-flies.1", "text": "Il tempo vola quando ci si diverte.", "en": "Time flies when you're having fun.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-time-flies", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-time-flies.2", "text": "Infatti per me è stato un decennio lentissimo.", "en": "So it's been a slow decade for me.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-time-flies", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-straight-face.1", "text": "Riesco a restare serio per ore.", "en": "I can keep a straight face for hours.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-straight-face", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-straight-face.2", "text": "Dote professionale. Professione sbagliata.", "en": "Professional skill. Wrong profession.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-straight-face", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-distraction.1", "text": "Sinceramente? Non sono così divertente.", "en": "Honestly? I'm not that funny.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-distraction", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-distraction.2", "text": "A questo servono le scarpe grandi. A distrarre.", "en": "That's what the big shoes are for. Distraction.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-distraction", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-pockets.1", "text": "Ho quaranta tasche. Trentanove fazzoletti.", "en": "I have forty pockets. Thirty-nine handkerchiefs.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pockets", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-pockets.2", "text": "E una caramella, per farmi coraggio.", "en": "One sandwich, for courage.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pockets", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-handkerchiefs.1", "text": "Ho tirato fuori fazzoletti dalla manica per un'ora.", "en": "I pulled handkerchiefs out of my sleeve for an hour.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-handkerchiefs", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-handkerchiefs.2", "text": "Poi uno l'ho usato.", "en": "Then I just used one.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-handkerchiefs", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-tough-room", "text": "Oggi la sala è fredda. E in sala ci sono solo io.", "en": "Tough room today. And I'm alone in it.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-tough-room.m4a?v=608320c2e842"}, "versions": {"clown": "608320c2e842"}}, {"id": "general-doctor.1", "text": "Un tizio dice al medico che nessuno lo fa ridere.", "en": "A man tells his doctor nobody makes him laugh.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-doctor", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-doctor.1.m4a?v=44479d469b54"}, "versions": {"clown": "44479d469b54"}}, {"id": "general-doctor.2", "text": "Il medico lo manda dal pagliaccio. Eccomi. Non passo con la mutua.", "en": "The doctor says, go see the clown. Well. Here I am.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-doctor", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-doctor.2.m4a?v=c1dfa3362de0"}, "versions": {"clown": "c1dfa3362de0"}}, {"id": "general-colmo-ridire.1", "text": "Qual è il colmo per un pagliaccio?", "en": "Qual è il colmo per un pagliaccio?", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-ridire", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-colmo-ridire.2", "text": "Avere sempre qualcosa da ridire.", "en": "Avere sempre qualcosa da ridire.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-ridire", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-colmo-salti.1", "text": "Il colmo per un acrobata?", "en": "Il colmo per un acrobata?", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-salti", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-colmo-salti.2", "text": "Fare i salti mortali per arrivare a fine mese.", "en": "Fare i salti mortali per arrivare a fine mese.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-salti", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-ride-bene.1", "text": "Ride bene chi ride ultimo.", "en": "Ride bene chi ride ultimo.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-ride-bene", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-ride-bene.2", "text": "Io sono ancora in fila.", "en": "Io sono ancora in fila.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-ride-bene", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-ridere-piangere.1", "text": "Rido per non piangere.", "en": "Rido per non piangere.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-ridere-piangere", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-ridere-piangere.2", "text": "E piango per non perdere l'allenamento.", "en": "E piango per non perdere l'allenamento.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-ridere-piangere", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-riso-abbonda.1", "text": "Il riso abbonda sulla bocca degli stolti.", "en": "Il riso abbonda sulla bocca degli stolti.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-riso-abbonda", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-riso-abbonda.2", "text": "Per questo a pranzo mangio pasta.", "en": "Per questo a pranzo mangio pasta.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-riso-abbonda", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-in-giro.1", "text": "Mi prendono tutti in giro.", "en": "Mi prendono tutti in giro.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-in-giro", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-in-giro.2", "text": "Per forza, lavoro in una pista rotonda.", "en": "Per forza, lavoro in una pista rotonda.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-in-giro", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-naso-affari.1", "text": "Non metto mai il naso negli affari degli altri.", "en": "Non metto mai il naso negli affari degli altri.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-naso-affari", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-naso-affari.2", "text": "Non ci entra.", "en": "Non ci entra.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-naso-affari", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-buon-viso.1", "text": "Fare buon viso a cattivo gioco?", "en": "Fare buon viso a cattivo gioco?", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-buon-viso", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-buon-viso.2", "text": "Quaranta minuti e due chili di cerone.", "en": "Quaranta minuti e due chili di cerone.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-buon-viso", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-trucco.1", "text": "Il trucco c'è ma non si vede.", "en": "Il trucco c'è ma non si vede.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-trucco", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "general-trucco.2", "text": "Il mio si vede da tre chilometri.", "en "joke": "afternoon-naso-in-tasca", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "afternoon-naso-in-tasca.2", "text": "Persino io tengo il naso in tasca.", "en": "Persino io tengo il naso in tasca.", "flavor": "dry", "slot": "afternoon", "tags": "", "joke": "afternoon-naso-in-tasca", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "afternoon-equilibrio.1", "text": "Pomeriggio: il sole è alto, il morale è basso.", "en": "Pomeriggio: il sole è alto, il morale è basso.", "flavor": "bittersweet", "slot": "afternoon", "tags": "", "joke": "afternoon-equilibrio", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "afternoon-equilibrio.2", "text": "Le scarpe, sempre lunghe. Equilibrio.", "en": "Le scarpe, sempre lunghe. Equilibrio.", "flavor": "bittersweet", "slot": "afternoon", "tags": "", "joke": "afternoon-equilibrio", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "afternoon-merenda.1", "text": "Ora di merenda. Ho un panino nella manica.", "en": "Snack time. There's a sandwich up my sleeve.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-merenda", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "afternoon-merenda.2", "text": "Era per un numero di magia. È andato male.", "en": "It was for a magic trick. That went badly.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-merenda", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-sincere", "text": "Sera: l'ora in cui il trucco comincia a sembrare sincero.", "en": "Evening: the hour my makeup starts to feel sincere.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "evening-sun-bow", "text": "Tramonto. Il sole fa l'inchino. Nemmeno un fiore dal pubblico.", "en": "The sun's taking its bow. Not one flower thrown.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "evening-waiter.1", "text": "Cena da solo. Il cameriere mi porta una torta.", "en": "Dinner for one. The waiter brought a pie.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-waiter", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-waiter.2", "text": "Mi conosce.", "en": "He knows me.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-waiter", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-shoes-off.1", "text": "La sera comincio a togliermi le scarpe.", "en": "I start taking my shoes off in the evening.", "flavor": "silly", "slot": "evening", "tags": "", "joke": "evening-shoes-off", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-shoes-off.2", "text": "Finisco verso mezzanotte.", "en": "I finish around midnight.", "flavor": "silly", "slot": "evening", "tags": "", "joke": "evening-shoes-off", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-quiet-applause.1", "text": "La sera metto su il disco degli applausi.", "en": "If the stars are applause, I'm doing great tonight.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-quiet-applause", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-quiet-applause.2", "text": "A volume basso. Non voglio montarmi la testa.", "en": "Very quiet applause.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-quiet-applause", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-sotto-il-trucco.1", "text": "La sera mi strucco.", "en": "Every evening I take my makeup off.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-sotto-il-trucco", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-sotto-il-trucco.2", "text": "Sotto c'è un altro pagliaccio. Più piccolo.", "en": "Underneath there's another clown. Smaller.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-sotto-il-trucco", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-conto-risate.1", "text": "La sera conto le risate della giornata.", "en": "In the evening I count the day's laughs.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-conto-risate", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-conto-risate.2", "text": "Faccio presto.", "en": "It doesn't take long.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-conto-risate", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-in-pigiama.1", "text": "Una volta a quest'ora andavo in scena.", "en": "Una volta a quest'ora andavo in scena.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-in-pigiama", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-in-pigiama.2", "text": "Adesso vado in pigiama. Stesso entusiasmo.", "en": "Adesso vado in pigiama. Stesso entusiasmo.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-in-pigiama", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-ultimo-a-dormire.1", "text": "Si fa sera. Il sorriso dipinto", "en": "Si fa sera. Il sorriso dipinto", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-ultimo-a-dormire", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "evening-ultimo-a-dormire.2", "text": "è sempre l'ultimo ad andare a dormire.", "en": "è sempre l'ultimo ad andare a dormire.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-ultimo-a-dormire", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-moon", "text": "È tardi. Anche la luna si è struccata.", "en": "It's late. Even the moon took its makeup off.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "night-sheep.1", "text": "La notte conto le pecore.", "en": "I count sheep at night.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-sheep", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-sheep.2", "text": "Fanno un numero tutto loro. Meglio del mio.", "en": "They do a little routine. Better than mine.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-sheep", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-nightcap.1", "text": "Dormo col berretto da notte con il campanellino.", "en": "I sleep in a nightcap with a bell.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-nightcap", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-nightcap.2", "text": "Ogni volta che mi giro: un piccolo bis.", "en": "Every time I turn over: a tiny encore.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-nightcap", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-owl", "text": "Io e i gufi, svegli a quest'ora. Tutti e due con gli occhi molto truccati.", "en": "Night owls and clowns. We both wear a lot around the eyes.", "flavor": "silly", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "night-clock", "text": "È tardi. A dare i numeri siamo rimasti io e l'orologio.", "en": "It's late. The clock and I are the only ones still doing bits.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "night-nightlight.1", "text": "Di notte faccio la guardia al circo.", "en": "I keep my nose on at night.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-nightlight", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-nightlight.2", "text": "Nessuno ruba mai niente. Neanche le mie battute.", "en": "It's a nightlight. A sad one, but it works.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-nightlight", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-pie-d night", "tags": "", "joke": "night-notaio", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-non-piglia-pesci.1", "text": "Chi dorme non piglia pesci.", "en": "Chi dorme non piglia pesci.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-non-piglia-pesci", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-non-piglia-pesci.2", "text": "Io non dormo e piglio solo torte.", "en": "Io non dormo e piglio solo torte.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-non-piglia-pesci", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-pubblico-difficile.1", "text": "È tardi. Le stelle sono tutte accese", "en": "È tardi. Le stelle sono tutte accese", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-pubblico-difficile", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "night-pubblico-difficile.2", "text": "e nessuna ride. Pubblico difficile.", "en": "e nessuna ride. Pubblico difficile.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-pubblico-difficile", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "monday-happy-face", "text": "Lunedì. La mia faccia allegra è ancora in lavatrice.", "en": "Monday. My happy face is still in the wash.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "monday-first-pie", "text": "Lunedì. La prima torta la tira la settimana.", "en": "Monday. The week throws the first pie.", "flavor": "absurd", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "monday-warm-up", "text": "Il lunedì il naso lo metto piano piano. Prima lo faccio scaldare.", "en": "On Mondays I put the nose on slowly. Let it warm up.", "flavor": "dry", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "monday-agree", "text": "A nessuno piace il lunedì. Finalmente tutti d'accordo con me.", "en": "Nobody likes Mondays. Finally, something everyone agrees with me on.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "monday-grigio.1", "text": "Lunedì. Naso rosso, umore grigio.", "en": "Lunedì. Naso rosso, umore grigio.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "monday-grigio", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "monday-grigio.2", "text": "Almeno i colori stanno bene insieme.", "en": "Almeno i colori stanno bene insieme.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "monday-grigio", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "monday-riapre.1", "text": "Lunedì. Il circo riapre.", "en": "Lunedì. Il circo riapre.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "monday-riapre", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "monday-riapre.2", "text": "Io no, ma vado lo stesso.", "en": "Io no, ma vado lo stesso.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "monday-riapre", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "friday-pie-treat", "text": "Venerdì! Naso lucidato, trombetta accordata. Ha una nota sola, si fa presto.", "en": "Friday. I'm treating myself to a pie. Eaten, not thrown.", "flavor": "silly", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "friday-cartwheel", "text": "Venerdì. Farei la ruota, ma non faccio straordinari.", "en": "Friday. I'd do a cartwheel, but I don't do overtime.", "flavor": "dry", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "friday-big-weekend.1", "text": "Programmi per il weekend: togliere il naso. Rimetterlo.", "en": "My weekend plans: take the nose off. Put it back on.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-big-weekend", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "friday-big-weekend.2", "text": "Weekend impegnativo.", "en": "Big weekend.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-big-weekend", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "friday-sweep.1", "text": "Venerdì. Il circo chiude presto.", "en": "Friday. The circus closes early.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-sweep", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "friday-sweep.2", "text": "Il pagliaccio resta a spazzare le risate avanzate.", "en": "The clown stays behind to sweep up the laughs.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-sweep", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "friday-venerdi.1", "text": "Chi ride il venerdì piange la domenica.", "en": "Chi ride il venerdì piange la domenica.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-venerdi", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "friday-venerdi.2", "text": "Io porto avanti il lavoro: piango già adesso.", "en": "Io porto avanti il lavoro: piango già adesso.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-venerdi", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "friday-meta.1", "text": "Venerdì! Stasera mi strucco solo a metà.", "en": "Venerdì! Stasera mi strucco solo a metà.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-meta", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "friday-meta.2", "text": "Il sorriso lo tengo per il weekend.", "en": "Il sorriso lo tengo per il weekend.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-meta", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-serious", "text": "Il fine settimana: finalmente un pagliaccio può essere serio in pace.", "en": "The weekend: a clown can finally be serious in peace.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "weekend-civilian.1", "text": "Nel weekend vado al circo da spettatore.", "en": "Weekend. I go out without makeup.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-civilian", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-civilian.2", "text": "Il pagliaccio è peggio di me. Che bel weekend.", "en": "Nobody recognizes me. Same as with makeup.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-civilian", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-shoes-on", "text": "Nel weekend dormo con le scarpe. Così il lunedì risparmio tempo.", "en": "On weekends I sleep in my shoes. It saves time on Monday.", "flavor": "absurd", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "weekend-mime-hobby.1", "text": "Nel weekend, per hobby, faccio il mimo.", "en": "My weekend hobby is mime.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "weekend-mime-hobby", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-mime-hobby.2", "text": "Dicono che sono migliorato.", "en": "People say it's an improvement.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "weekend-mime-hobby", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-barbecue.1", "text": "Grigliata del weekend. Io ho portato le torte.", "en": "Weekend barbecue. I brought pies.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-barbecue", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-barbecue.2", "text": "Vecchie abitudini. Nessuno stava fermo.", "en": "Old habits. Nobody would stand still.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-barbecue", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-tendone-vuoto.1", "text": "Domenica, niente spettacolo.", "en": "Domenica, niente spettacolo.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-tendone-vuoto", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-tendone-vuoto.2", "text": "Mi siedo in prima fila davanti al tendone vuoto. Applaudo lo stesso.", "en": "Mi siedo in prima fila davanti al tendone vuoto. Applaudo lo stesso.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-tendone-vuoto", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-dalle-scarpe.1", "text": "La domenica non mi trucco.", "en": "La domenica non mi trucco.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-dalle-scarpe", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "weekend-dalle-scarpe.2", "text": "Mi riconoscono lo stesso. Dalle scarpe.", "en": "Mi riconoscono lo stesso. Dalle scarpe.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-dalle-scarpe", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "poke-agent", "text": "Una battuta su richiesta. Il mio agente sarebbe fiero di me.", "en": "A joke on demand. My agent would be so proud.", "flavor": "dry", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "poke-always-in.1", "text": "Avanti! Oggi abbiamo battute freschissime.", "en": "Ring ring! The clown is in.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-always-in", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "poke-always-in.2", "text": "Insomma, fresche. Dell'anno scorso.", "en": "The clown is always in.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-always-in", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "poke-nobody-asks", "text": "Una richiesta! Non me ne fanno una da quando è partito il circo.", "en": "A request! Nobody's asked since the circus left.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "poke-boop", "text": "Bip! Hai trovato il naso. Si comincia sempre da lì.", "en": "Boop. You found the nose. It's always the nose.", "flavor": "silly", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "poke-front-row", "text": "Posto in prima fila! Il migliore della sala. Anche l'unico.", "en": "Front row! Best seat in the house. Only seat, too.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "poke-chiamato.1", "text": "Mi hai chiamato? Nessuno mi chiama mai.", "en": "Mi hai chiamato? Nessuno mi chiama mai.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-chiamato", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "poke-chiamato.2", "text": "Aspetta, mi metto il naso buono.", "en": "Aspetta, mi metto il naso buono.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-chiamato", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "poke-toc-toc.1", "text": "Toc toc? Avanti, è aperto.", "en": "Toc toc? Avanti, è aperto.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-toc-toc", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "poke-toc-toc.2", "text": "Il circo è sempre aperto.", "en": "Il circo è sempre aperto.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-toc-toc", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "poke-signature-it", "text": "…ma chi fa ridere Mister Pagliacci?", "en": "…ma chi fa ridere Mister Pagliacci?", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-signature-it.m4a?v=706b1ca7da53"}, "versions": {"clown": "706b1ca7da53"}}, {"id": "back-saved-joke", "text": "Eccoti! Ti ho tenuto da parte una battuta. Quasi nuova.", "en": "There you are. I saved you a joke. Slightly used.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "back-find-nose", "text": "Oh! Pubblico! Un attimo, dove ho messo il naso?", "en": "Oh! An audience. Hold on, where's my nose?", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "back-rehearsed.1", "text": "Rieccoti. Mentre eri via ho provato il numero.", "en": "Welcome back. I rehearsed while you were gone.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-rehearsed", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "back-rehearsed.2", "text": "Non è servito.", "en": "It didn't help.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-rehearsed", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "back-mime-show.1", "text": "Mentre eri via ho fatto uno spettacolo di mimo.", "en": "I did a mime show while you were away.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-mime-show", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "back-mime-show.2", "text": "Non se n'è accorto nessuno. Ero bravissimo.", "en": "Nobody noticed. That's how good it was.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-mime-show", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "back-moment.1", "text": "E ora, il momento che stavi aspettando.", "en": "And now, the moment you've been waiting for.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-moment", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-moment.1.m4a?v=5d34df803fd3"}, "versions": {"clown": "5d34df803fd3"}}, {"id": "back-moment.2", "text": "Io. Di nuovo. Scusa.", "en": "Me. Again. Sorry.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-moment", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-moment.2.m4a?v=c295d6af5e7b"}, "versions": {"clown": "c295d6af5e7b"}}, {"id": "back-sgonfia.1", "text": "Rieccoti! Ti ho tenuto da parte una barzelletta.", "en": "Rieccoti! Ti ho tenuto da parte una barzelletta.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "back-sgonfia", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "back-sgonfia.2", "text": "Si è un po' sgonfiata.", "en": "Si è un po' sgonfiata.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "back-sgonfia", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "back-permesso.1", "text": "Io non mi sono mosso.", "en": "Io non mi sono mosso.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-permesso", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "back-permesso.2", "text": "Con queste scarpe ci vuole il permesso del comune.", "en": "Con queste scarpe ci vuole il permesso del comune.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-permesso", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-mime", "text": "Tutto quel silenzio. Ne ho approfittato per ripassare il mimo.", "en": "All that quiet. I used it to practice my mime.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "call-horn.1", "text": "Ho tenuto in mano la trombetta tutto il tempo.", "en": "I held my horn the whole time.", "flavor": "dry", "slot": "afterCall", "tags": "", "joke": "call-horn", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-horn.2", "text": "Non l'ho suonata. Mai fatto niente di più difficile.", "en": "Hardest thing I've ever done.", "flavor": "dry", "slot": "afterCall", "tags": "", "joke": "call-horn", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-tiptoe", "text": "Sono stato in punta di piedi tutto il tempo. Con queste scarpe.", "en": "I tiptoed the whole time. In these shoes.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "call-pigeon.1", "text": "Sono rimasto immobile tutto il tempo.", "en": "I stood perfectly still the whole time.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "call-pigeon", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-pigeon.2", "text": "Mi si è posato sopra un piccione.", "en": "A pigeon landed on me.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "call-pigeon", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-lost-joke.1", "text": "Nel frattempo mi era venuta una battuta geniale.", "en": "I thought of a great joke while you were busy.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-lost-joke", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-lost-joke.2", "text": "Se n'è andata. Le battute geniali non fanno anticamera.", "en": "It's gone. That's showbiz.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-lost-joke", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-mimo-timido.1", "text": "Zitto come un mimo.", "en": "Zitto come un mimo.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "call-mimo-timido", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-mimo-timido.2", "text": "Un mimo timido. In uno sgabuzzino.", "en": "Un mimo timido. In uno sgabuzzino.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "call-mimo-timido", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-applauso-muto.1", "text": "Finito? Applauso muto.", "en": "Finito? Applauso muto.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-applauso-muto", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "call-applauso-muto.2", "text": "È l'unico che so fare bene.", "en": "È l'unico che so fare bene.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-applauso-muto", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "shush-reviews", "text": "Posso riparlare? Il mio silenzio ha avuto ottime recensioni.", "en": "I may speak again? My silence got great reviews.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "shush-mime-wept.1", "text": "Quel silenzio è piaciuto tantissimo.", "en": "That silence was my best work.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-mime-wept", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "shush-mime-wept.2", "text": "Una statua mi ha chiesto l'autografo.", "en": "A mime came by and wept.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-mime-wept", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "shush-honk.1", "text": "Posso parlare di nuovo?", "en": "I'm allowed to talk again?", "flavor": "silly", "slot": "shushEnd", "tags": "", "joke": "shush-honk", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-honk.1.m4a?v=81bcb40e0f6d"}, "versions": {"clown": "81bcb40e0f6d"}}, {"id": "shush-honk.2", "text": "Fammi ricordare come si fa. Ah, sì. Pè-pè.", "en": "Let me remember how. Ah, yes. Honk.", "flavor": "silly", "slot": "shushEnd", "tags": "", "joke": "shush-honk", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-honk.2.m4a?v=d9d7649d65ef"}, "versions": {"clown": "d9d7649d65ef"}}, {"id": "shush-natural", "text": "Ho provato a stare zitto. Pare che io abbia talento.", "en": "I practiced silence. Turns out I'm a natural.", "flavor": "bittersweet", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "shush-tutte-questa.1", "text": "Zitto zitto, ho preparato tre barzellette.", "en": "Zitto zitto, ho preparato tre barzellette.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "shush-tutte-questa", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "shush-tutte-questa.2", "text": "Sono tutte questa.", "en": "Sono tutte questa.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "shush-tutte-questa", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "shush-prestito.1", "text": "Che bel silenzio.", "en": "Che bel silenzio.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-prestito", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "shush-prestito.2", "text": "Un mimo me l'ha chiesto in prestito.", "en": "Un mimo me l'ha chiesto in prestito.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-prestito", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "battery-emotional", "text": "Batteria quasi a terra. Anch'io, ma per motivi sentimentali.", "en": "Battery's low. Mine too, but mine is emotional.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "battery-balloon", "text": "Batteria scarica. Mi sento un palloncino tre giorni dopo la festa.", "en": "Battery's low. I know the feeling. I'm a balloon on day three.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {}, "versions": {}}, {"id": "battery-shortest.1", "text": "Batteria scarica. Ecco la mia barzelletta più corta:", "en": "Low battery. Time for my shortest joke:", "flavor": "dry", "slot": "batteryLow", "tags": "", "joke": "battery-shortest", "part": 1, "parts": 2, "clips": {}, "versions": {}}, {"id": "battery-shortest.2", "text": "lo stipendio di un pagliaccio.", "en": "a clown's paycheck.", "flavor": "dry", "slot": "batteryLow", "tags": "", "joke": "battery-shortest", "part": 2, "parts": 2, "clips": {}, "versions": {}}, {"id": "battery-red", "text": "Batteria in rosso. Come me: col naso e col conto in banca.", "en": "The battery's in the red. Finally, something ma     }
    const text = document.createElement("button");
    text.className = `flag${e.text ? " on" : ""}`; text.textContent = "Text"; text.title = `The ${DATA.languageName} should change (T)`;
    text.onclick = ev => { ev.stopPropagation(); toggleText(i); };
    actions.append(text);
    const input = el.querySelector(".note input");
    input.value = e.note || "";
    input.oninput = () => { entry(r.id).note = input.value; save(); summarize(); };
    input.onclick = ev => ev.stopPropagation();
    el.onclick = () => { select(i); };
    list.append(el);
  }
  pager(order.length, pages); progress(); summarize();
}

// Page buttons: the first, the last, and two either side of the current one, with gaps between.
function pager(count, pages) {
  const nav = $("#pager"); nav.innerHTML = ""; nav.hidden = pages < 2;
  const button = (label, to, title) => {
    const b = document.createElement("button"); b.textContent = label; b.title = title || `Page ${to + 1}`;
    if (to === page && !title) b.setAttribute("aria-current", "page");
    b.disabled = to < 0 || to >= pages || (to === page && !!title);
    b.onclick = () => goPage(to); nav.append(b);
  };
  button("‹ Previous", page - 1, "Previous page (←)");
  let last = -1;
  for (let p = 0; p < pages; p++) {
    if (p !== 0 && p !== pages - 1 && Math.abs(p - page) > 2) continue;
    if (p - last > 1) { const gap = document.createElement("span"); gap.className = "gap"; gap.textContent = "…"; nav.append(gap); }
    button(String(p + 1), p); last = p;
  }
  button("Next ›", page + 1, "Next page (→)");
  const range = document.createElement("span"); range.className = "range";
  range.textContent = `${page * PAGE + 1}–${Math.min(count, (page + 1) * PAGE)} of ${count}`;
  nav.append(range);
}

function goPage(p) {
  const order = visible(), pages = Math.ceil(order.length / PAGE);
  if (p < 0 || p >= pages || p === page) return;
  stopListening(); page = p; render(); select(order[p * PAGE], false); window.scrollTo({ top: 0 });
}

function progress() {
  let done = 0, total = 0;
  for (const r of DATA.rows) for (const v of DATA.voices) if (r.clips[v.kind]) { total++; if (heard(r, v.kind)) done++; }
  const waiting = DATA.rows.filter(r => !Object.keys(r.clips).length).length;
  $("#bar").style.width = `${total ? (100 * done / total) : 0}%`;
  $("#count").textContent = `${done} / ${total} heard` + (waiting ? ` · ${waiting} waiting for a voice` : "");
}

function summarize() {
  const retakes = {}, texts = [];
  for (const r of DATA.rows) {
    const e = state[r.id]; if (!e) continue;
    for (const v of DATA.voices) if (retake(r, v.kind)) (retakes[v.kind] ||= []).push(r.id + (e.note ? ` (${e.note})` : ""));
    if (e.text) texts.push(`${r.id}: "${r.text}"${e.note ? ` — ${e.note}` : ""}`);
  }
  const lines = [];
  for (const v of DATA.voices) if (retakes[v.kind]) lines.push(`Retake ${DATA.lang}/${v.kind} (${v.name}): ${retakes[v.kind].join(", ")}`);
  if (texts.length) lines.push(`Change the ${DATA.languageName} text:`, ...texts.map(t => `- ${t}`));
  $("#summary").value = lines.join("\n");
}

function select(i, scroll = true) {
  current = i;
  const pos = visible().indexOf(i);
  if (pos >= 0 && Math.floor(pos / PAGE) !== page) { page = Math.floor(pos / PAGE); render(); }
  document.querySelectorAll(".row").forEach(el => el.classList.toggle("current", +el.dataset.index === i));
  const el = document.querySelector(`.row[data-index="${i}"]`);
  if (el && scroll) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function markPlaying(i, kind) {
  document.querySelectorAll(".actions .playing").forEach(b => b.classList.remove("playing"));
  const b = document.querySelector(`.row[data-index="${i}"] [data-play="${kind}"]`);
  if (b) b.classList.add("playing");
}

function playOne(i, kind, then) {
  const r = DATA.rows[i]; if (!r.clips[kind]) { then && then(); return; }
  lastVoice = kind;
  audio.src = r.clips[kind]; audio.playbackRate = +$("#speed").value;
  markPlaying(i, kind);
  audio.onended = () => {
    entry(r.id).heard[kind] = r.versions[kind] || true; save(); progress();
    document.querySelectorAll(".actions .playing").forEach(b => b.classList.remove("playing"));
    const row = document.querySelector(`.row[data-index="${i}"]`);
    if (row && DATA.voices.every(v => !r.clips[v.kind] || heard(r, v.kind))) row.classList.add("done");
    then && then();
  };
  audio.play().catch(() => {});
}

function listenFrom(i) {
  const order = visible(); let pos = order.indexOf(i); if (pos < 0) pos = 0;
  const kinds = $("#voice").value === "both" ? DATA.voices.map(v => v.kind) : [$("#voice").value];
  const step = (p, k) => {
    if (!listening || p >= order.length) { stopListening(); return; }
    const idx = order[p]; if (k === 0) select(idx);
    const next = () => setTimeout(() => k + 1 < kinds.length ? step(p, k + 1) : step(p + 1, 0), 450);
    playOne(idx, kinds[k], next);
  };
  listening = true; $("#listen").textContent = "❚❚ Pause"; step(pos, 0);
}
function stopListening() { listening = false; audio.onended = null; audio.pause(); $("#listen").textContent = "▶ Listen through"; }

function toggleRetake(i, kind) {
  const r = DATA.rows[i]; if (!r.clips[kind]) return;
  entry(r.id).retake[kind] = retake(r, kind) ? false : (r.versions[kind] || true); save(); render(); select(i, false);
}
function toggleText(i) { const e = entry(DATA.rows[i].id); e.text = !e.text; save(); render(); select(i, false); }

$("#listen").onclick = () => listening ? stopListening() : listenFrom(current);
$("#filter").onchange = () => { stopListening(); page = 0; render(); };
$("#speed").onchange = () => { audio.playbackRate = +$("#speed").value; };
$("#copy").onclick = async () => {
  const text = $("#summary").value || "No flags: everything sounds right.";
  try { await navigator.clipboard.writeText(text); $("#copied").textContent = SEND; }
  catch { $("#summary").select(); document.execCommand("copy"); $("#copied").textContent = "Copied."; }
};
$("#clear").onclick = () => { if (confirm("Clear every flag and note?")) { for (const id in state) { state[id].retake = {}; state[id].text = false; state[id].note = ""; } save(); render(); } };

document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA" || ev.target.tagName === "SELECT") {
    if (ev.key === "Escape") ev.target.blur(); return;
  }
  const order = visible(), pos = order.indexOf(current);
  if (ev.key === " ") { ev.preventDefault(); listening ? stopListening() : listenFrom(current); }
  else if (ev.key === "ArrowDown" || ev.key === "j") { ev.preventDefault(); stopListening(); select(order[Math.min(order.length - 1, pos + 1)] ?? current); }
  else if (ev.key === "ArrowUp" || ev.key === "k") { ev.preventDefault(); stopListening(); select(order[Math.max(0, pos - 1)] ?? current); }
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { ev.preventDefault(); goPage(page + (ev.key === "ArrowLeft" ? -1 : 1)); }
  else if (ev.key === "1" || ev.key === "2") { const v = DATA.voices[+ev.key - 1]; if (v) { stopListening(); playOne(current, v.kind); } }
  else if (ev.key === "r") toggleRetake(current, lastVoice);
  else if (ev.key === "t") toggleText(current);
  else if (ev.key === "n") { const input = document.querySelector(`.row[data-index="${current}"] .note input`); const e = entry(DATA.rows[current].id); if (!input || getComputedStyle(input.parentElement).display === "none") { e.text = e.text || !DATA.voices.some(v => retake(DATA.rows[current], v.kind)); save(); render(); select(current, false); } setTimeout(() => document.querySelector(`.row[data-index="${current}"] .note input`)?.focus(), 0); ev.preventDefault(); }
});
render(); select(0, false);
</script>
</body>
</html>
