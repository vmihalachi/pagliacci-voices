: 2, "clips": {"clown": "../Voice/it/clown/evening-waiter.2.m4a?v=a97ef0cb0ac3"}, "versions": {"clown": "a97ef0cb0ac3"}}, {"id": "evening-shoes-off.1", "text": "La sera comincio a togliermi le scarpe.", "en": "I start taking my shoes off in the evening.", "flavor": "silly", "slot": "evening", "tags": "", "joke": "evening-shoes-off", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-shoes-off.1.m4a?v=9f7aa01b1d82"}, "versions": {"clown": "9f7aa01b1d82"}}, {"id": "evening-shoes-off.2", "text": "Finisco verso mezzanotte.", "en": "I finish around midnight.", "flavor": "silly", "slot": "evening", "tags": "", "joke": "evening-shoes-off", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-shoes-off.2.m4a?v=fd615c243946"}, "versions": {"clown": "fd615c243946"}}, {"id": "evening-quiet-applause.1", "text": "La sera metto su il disco degli applausi.", "en": "If the stars are applause, I'm doing great tonight.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-quiet-applause", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-quiet-applause.1.m4a?v=625a36de2fdf"}, "versions": {"clown": "625a36de2fdf"}}, {"id": "evening-quiet-applause.2", "text": "A volume basso. Non voglio montarmi la testa.", "en": "Very quiet applause.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-quiet-applause", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-quiet-applause.2.m4a?v=2884a34e2aca"}, "versions": {"clown": "2884a34e2aca"}}, {"id": "evening-sotto-il-trucco.1", "text": "La sera mi strucco.", "en": "Every evening I take my makeup off.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-sotto-il-trucco", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-sotto-il-trucco.1.m4a?v=3846ee3cdabc"}, "versions": {"clown": "3846ee3cdabc"}}, {"id": "evening-sotto-il-trucco.2", "text": "Sotto c'è un altro pagliaccio. Più piccolo.", "en": "Underneath there's another clown. Smaller.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-sotto-il-trucco", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-sotto-il-trucco.2.m4a?v=e3c6de566046"}, "versions": {"clown": "e3c6de566046"}}, {"id": "evening-conto-risate.1", "text": "La sera conto le stelle.", "en": "In the evening I count my lucky stars.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-conto-risate", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-conto-risate.1.m4a?v=12b182beff5f"}, "versions": {"clown": "12b182beff5f"}}, {"id": "evening-conto-risate.2", "text": "Faccio presto: sono quelle cucite sul cappello.", "en": "Then the regular ones. Takes all night.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-conto-risate", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-conto-risate.2.m4a?v=21b7d34d238d"}, "versions": {"clown": "21b7d34d238d"}}, {"id": "evening-in-pigiama.1", "text": "Una volta a quest'ora andavo in scena.", "en": "Una volta a quest'ora andavo in scena.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-in-pigiama", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-in-pigiama.1.m4a?v=21aa47d450f2"}, "versions": {"clown": "21aa47d450f2"}}, {"id": "evening-in-pigiama.2", "text": "Adesso vado in pigiama. Stesso entusiasmo.", "en": "Adesso vado in pigiama. Stesso entusiasmo.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-in-pigiama", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-in-pigiama.2.m4a?v=ec05e85a9cc3"}, "versions": {"clown": "ec05e85a9cc3"}}, {"id": "evening-ultimo-a-dormire.1", "text": "Si fa sera. Il sorriso dipinto", "en": "Si fa sera. Il sorriso dipinto", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-ultimo-a-dormire", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-ultimo-a-dormire.1.m4a?v=70c1ed656f24"}, "versions": {"clown": "70c1ed656f24"}}, {"id": "evening-ultimo-a-dormire.2", "text": "è sempre l'ultimo ad andare a dormire.", "en": "è sempre l'ultimo ad andare a dormire.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "evening-ultimo-a-dormire", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-ultimo-a-dormire.2.m4a?v=d50d780ebd80"}, "versions": {"clown": "d50d780ebd80"}}, {"id": "night-moon", "text": "È tardi. Anche la luna si è struccata.", "en": "It's late. Even the moon took its makeup off.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/night-moon.m4a?v=1829645ed70f"}, "versions": {"clown": "1829645ed70f"}}, {"id": "night-sheep.1", "text": "La notte conto le pecore.", "en": "I count sheep at night.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-sheep", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-sheep.1.m4a?v=0613324fe8fc"}, "versions": {"clown": "0613324fe8fc"}}, {"id": "night-sheep.2", "text": "Fanno un numero tutto loro. Meglio del mio.", "en": "They do a little routine. Better than mine.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-sheep", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-sheep.2.m4a?v=66f549f6c5c8"}, "versions": {"clown": "66f549f6c5c8"}}, {"id": "night-nightcap.1", "text": "Dormo col berretto da notte con il campanellino.", "en": "I sleep in a nightcap with a bell.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-nightcap", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-nightcap.1.m4a?v=d4404a3c4988"}, "versions": {"clown": "d4404a3c4988"}}, {"id": "night-nightcap.2", "text": "Ogni volta che mi giro: un piccolo bis.", "en": "Every time I turn over: a tiny encore.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-nightcap", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-nightcap.2.m4a?v=78a89ba5fe11"}, "versions": {"clown": "78a89ba5fe11"}}, {"id": "night-owl", "text": "Io e i gufi, svegli a quest'ora. Tutti e due con gli occhi molto truccati.", "en": "An owl and I compared notes. We both overdo it around the eyes.", "flavor": "silly", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/night-owl.m4a?v=70f34647f01b"}, "versions": {"clown": "70f34647f01b"}}, {"id": "night-clock", "text": "È tardi. A dare i numeri siamo rimasti io e l'orologio.", "en": "It's late. The clock and I are the only ones still doing bits.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/night-clock.m4a?v=dba49354eaca"}, "versions": {"clown": "dba49354eaca"}}, {"id": "night-nightlight.1", "text": "Di notte faccio la guardia al circo.", "en": "I keep my nose on at night.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-nightlight", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-nightlight.1.m4a?v=ea0c1b4538da"}, "versions": {"clown": "ea0c1b4538da"}}, {"id": "night-nightlight.2", "text": "Nessuno ruba mai niente. Neanche le mie battute.", "en": "It's a nightlight. A sad one, but it works.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-nightlight", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-nightlight.2.m4a?v=77d1375e5da9"}, "versions": {"clown": "77d1375e5da9"}}, {"id": "night-pie-drop.1", "text": "Di notte il circo è così silenzioso", "en": "At night the circus is so quiet", "flavor": "silly", "slot": "night", "tags": "[whispers]", "joke": "night-pie-drop", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-pie-drop.1.m4a?v=9c3abf5e490c"}, "versions": {"clown": "9c3abf5e490c"}}, {"id": "night-pie-drop.2", "text": "che si sente volare una torta.", "en": "you can hear a pie drop.", "flavor": "silly", "slot": "night", "tags": "[whispers]", "joke": "night-pie-drop", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-pie-drop.2.m4a?v=7f1c7043fdf7"}, "versions": {"clown": "7f1c7043fdf7"}}, {"id": "night-luna-storta.1", "text": "Stasera ho la luna storta.", "en": "Stasera ho la luna storta.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-luna-storta", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-luna-storta.1.m4a?v=7b42212f0453"}, "versions": {"clown": "7b42212f0453"}}, {"id": "night-luna-storta.2", "text": "L'ho truccata io, è venuta male.", "en": "L'ho truccata io, è venuta male.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-luna-storta", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-luna-storta.2.m4a?v=55a8161e648c"}, "versions": {"clown": "55a8161e648c"}}, {"id": "night-calzino.1", "text": "Di notte spengo il naso.", "en": "Di notte spengo il naso.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-calzino", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-calzino.1.m4a?v=d3900c66bd21"}, "versions": {"clown": "d3900c66bd21"}}, {"id": "night-calzino.2", "text": "Scherzo, non si spegne. Ci metto sopra un calzino.", "en": "Scherzo, non si spegne. Ci metto sopra un calzino.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-calzino", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-calzino.2.m4a?v=361f53e30442"}, "versions": {"clown": "361f53e30442"}}, {"id": "night-notaio.1", "text": "Di notte sogno di fare il notaio.", "en": "Di notte sogno di fare il notaio.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-notaio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-notaio.1.m4a?v=76f2f31a3293"}, "versions": {"clown": "76f2f31a3293"}}, {"id": "night-notaio.2", "text": "Mi tirano le torte lo stesso.", "en": "Mi tirano le torte lo stesso.", "flavor": "absurd", "slot": "night", "tags": "", "joke": "night-notaio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-notaio.2.m4a?v=c472b8124f18"}, "versions": {"clown": "c472b8124f18"}}, {"id": "night-non-piglia-pesci.1", "text": "Chi dorme non piglia pesci.", "en": "Chi dorme non piglia pesci.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-non-piglia-pesci", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-non-piglia-pesci.1.m4a?v=afc2ef0df834"}, "versions": {"clown": "afc2ef0df834"}}, {"id": "night-non-piglia-pesci.2", "text": "Io non dormo e piglio solo torte.", "en": "Io non dormo e piglio solo torte.", "flavor": "silly", "slot": "night", "tags": "", "joke": "night-non-piglia-pesci", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-non-piglia-pesci.2.m4a?v=d705b4f72076"}, "versions": {"clown": "d705b4f72076"}}, {"id": "night-pubblico-difficile.1", "text": "È tardi. Le stelle sono tutte accese", "en": "È tardi. Le stelle sono tutte accese", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-pubblico-difficile", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-pubblico-difficile.1.m4a?v=109d267bb885"}, "versions": {"clown": "109d267bb885"}}, {"id": "night-pubblico-difficile.2", "text": "e nessuna ride. Pubblico difficile.", "en": "e nessuna ride. Pubblico difficile.", "flavor": "bittersweet", "slot": "night", "tags": "", "joke": "night-pubblico-difficile", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/night-pubblico-difficile.2.m4a?v=8c0645446e2e"}, "versions": {"clown": "8c0645446e2e"}}, {"id": "monday-happy-face", "text": "Lunedì. La mia faccia allegra è ancora in lavatrice.", "en": "Monday. My happy face is still in the wash.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/monday-happy-face.m4a?v=c29790ef1e04"}, "versions": {"clown": "c29790ef1e04"}}, {"id": "monday-first-pie", "text": "Lunedì. La prima torta la tira la settimana.", "en": "Monday. The week throws the first pie.", "flavor": "absurd", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/monday-first-pie.m4a?v=f6f14ed2bb39"}, "versions": {"clown": "f6f14ed2bb39"}}, {"id": "monday-warm-up", "text": "Il lunedì il naso lo metto piano piano. Prima lo faccio scaldare.", "en": "On Mondays I put the nose on slowly. Let it warm up.", "flavor": "dry", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/monday-warm-up.m4a?v=bdff988f973f"}, "versions": {"clown": "bdff988f973f"}}, {"id": "monday-agree", "text": "A nessuno piace il lunedì. Finalmente tutti d'accordo con me.", "en": "Nobody likes Mondays. Finally, something everyone agrees with me on.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/monday-agree.m4a?v=57209e257f02"}, "versions": {"clown": "57209e257f02"}}, {"id": "monday-grigio.1", "text": "Lunedì. Naso rosso, umore grigio.", "en": "Lunedì. Naso rosso, umore grigio.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "monday-grigio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/monday-grigio.1.m4a?v=a87a1fe7a093"}, "versions": {"clown": "a87a1fe7a093"}}, {"id": "monday-grigio.2", "text": "Almeno i colori stanno bene insieme.", "en": "Almeno i colori stanno bene insieme.", "flavor": "silly", "slot": "monday", "tags": "", "joke": "monday-grigio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/monday-grigio.2.m4a?v=7ce904b8d96c"}, "versions": {"clown": "7ce904b8d96c"}}, {"id": "monday-riapre.1", "text": "Lunedì. Il circo riapre.", "en": "Lunedì. Il circo riapre.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "monday-riapre", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/monday-riapre.1.m4a?v=3c98fd842a89"}, "versions": {"clown": "3c98fd842a89"}}, {"id": "monday-riapre.2", "text": "Io no, ma vado lo stesso.", "en": "Io no, ma vado lo stesso.", "flavor": "bittersweet", "slot": "monday", "tags": "", "joke": "monday-riapre", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/monday-riapre.2.m4a?v=39e580bfbce5"}, "versions": {"clown": "39e580bfbce5"}}, {"id": "friday-pie-treat", "text": "Venerdì! Naso lucidato, trombetta accordata. Ha una nota sola, si fa presto.", "en": "Friday. I'm treating myself to a pie. Eaten, not thrown.", "flavor": "silly", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/friday-pie-treat.m4a?v=ba3d695b1007"}, "versions": {"clown": "ba3d695b1007"}}, {"id": "friday-cartwheel", "text": "Venerdì. Farei la ruota, ma non faccio straordinari.", "en": "Friday. I'd do a cartwheel, but I don't do overtime.", "flavor": "dry", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/friday-cartwheel.m4a?v=6fe89f97df30"}, "versions": {"clown": "6fe89f97df30"}}, {"id": "friday-big-weekend.1", "text": "Programmi per il weekend: togliere il naso. Rimetterlo.", "en": "My weekend plans: take the nose off. Put it back on.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-big-weekend", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-big-weekend.1.m4a?v=730371728470"}, "versions": {"clown": "730371728470"}}, {"id": "friday-big-weekend.2", "text": "Weekend impegnativo.", "en": "Big weekend.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-big-weekend", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-big-weekend.2.m4a?v=63e7559bdbe9"}, "versions": {"clown": "63e7559bdbe9"}}, {"id": "friday-sweep.1", "text": "Venerdì. Il circo chiude presto.", "en": "Friday. The circus closes early.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-sweep", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-sweep.1.m4a?v=0af23475f510"}, "versions": {"clown": "0af23475f510"}}, {"id": "friday-sweep.2", "text": "Il pagliaccio resta a spazzare le risate avanzate.", "en": "The clown stays behind to sweep up the laughs.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-sweep", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-sweep.2.m4a?v=3a1fa2b5f7de"}, "versions": {"clown": "3a1fa2b5f7de"}}, {"id": "friday-venerdi.1", "text": "Chi ride il venerdì piange la domenica.", "en": "Chi ride il venerdì piange la domenica.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-venerdi", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-venerdi.1.m4a?v=06e3ce4955a1"}, "versions": {"clown": "06e3ce4955a1"}}, {"id": "friday-venerdi.2", "text": "Io porto avanti il lavoro: piango già adesso.", "en": "Io porto avanti il lavoro: piango già adesso.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-venerdi", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-venerdi.2.m4a?v=e212015c09a6"}, "versions": {"clown": "e212015c09a6"}}, {"id": "friday-meta.1", "text": "Venerdì! Stasera mi strucco solo a metà.", "en": "Venerdì! Stasera mi strucco solo a metà.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-meta", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-meta.1.m4a?v=cecded6644f8"}, "versions": {"clown": "cecded6644f8"}}, {"id": "friday-meta.2", "text": "Il sorriso lo tengo per il weekend.", "en": "Il sorriso lo tengo per il weekend.", "flavor": "bittersweet", "slot": "friday", "tags": "", "joke": "friday-meta", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/friday-meta.2.m4a?v=800c881cf277"}, "versions": {"clown": "800c881cf277"}}, {"id": "weekend-serious", "text": "Il fine settimana: finalmente un pagliaccio può essere serio in pace.", "en": "The weekend: a clown can finally be serious in peace.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/weekend-serious.m4a?v=796f31ad118e"}, "versions": {"clown": "796f31ad118e"}}, {"id": "weekend-civilian.1", "text": "Nel weekend vado al circo da spettatore.", "en": "Weekend. I go out without makeup.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-civilian", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-civilian.1.m4a?v=5863cff868f6"}, "versions": {"clown": "5863cff868f6"}}, {"id": "weekend-civilian.2", "text": "Il pagliaccio è peggio di me. Che bel weekend.", "en": "Nobody recognizes me. Same as with makeup.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-civilian", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-civilian.2.m4a?v=293f9882e9ee"}, "versions": {"clown": "293f9882e9ee"}}, {"id": "weekend-shoes-on", "text": "Nel weekend dormo con le scarpe. Così il lunedì risparmio tempo.", "en": "On weekends I sleep in my shoes. It saves time on Monday.", "flavor": "absurd", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/weekend-shoes-on.m4a?v=cf9958ffc03d"}, "versions": {"clown": "cf9958ffc03d"}}, {"id": "weekend-mime-hobby.1", "text": "Nel weekend, per hobby, faccio il mimo.", "en": "My weekend hobby is mime.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "weekend-mime-hobby", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-mime-hobby.1.m4a?v=06f8ae09570c"}, "versions": {"clown": "06f8ae09570c"}}, {"id": "weekend-mime-hobby.2", "text": "Dicono che sono migliorato.", "en": "People say it's an improvement.", "flavor": "dry", "slot": "weekend", "tags": "", "joke": "weekend-mime-hobby", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-mime-hobby.2.m4a?v=384ff7b5bc4f"}, "versions": {"clown": "384ff7b5bc4f"}}, {"id": "weekend-barbecue.1", "text": "Grigliata del weekend. Io ho portato le torte.", "en": "Weekend barbecue. I brought pies.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-barbecue", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-barbecue.1.m4a?v=7f8f65f838bd"}, "versions": {"clown": "7f8f65f838bd"}}, {"id": "weekend-barbecue.2", "text": "Vecchie abitudini. Nessuno stava fermo.", "en": "Old habits. Nobody would stand still.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-barbecue", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-barbecue.2.m4a?v=7800578180ab"}, "versions": {"clown": "7800578180ab"}}, {"id": "weekend-tendone-vuoto.1", "text": "Domenica, niente spettacolo.", "en": "Domenica, niente spettacolo.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-tendone-vuoto", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-tendone-vuoto.1.m4a?v=2163fe3393d7"}, "versions": {"clown": "2163fe3393d7"}}, {"id": "weekend-tendone-vuoto.2", "text": "Mi siedo in prima fila davanti al tendone vuoto. Applaudo lo stesso.", "en": "Mi siedo in prima fila davanti al tendone vuoto. Applaudo lo stesso.", "flavor": "bittersweet", "slot": "weekend", "tags": "", "joke": "weekend-tendone-vuoto", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-tendone-vuoto.2.m4a?v=ca0d9a3b7a2d"}, "versions": {"clown": "ca0d9a3b7a2d"}}, {"id": "weekend-dalle-scarpe.1", "text": "La domenica non mi trucco.", "en": "La domenica non mi trucco.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-dalle-scarpe", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-dalle-scarpe.1.m4a?v=4007c0a75a1c"}, "versions": {"clown": "4007c0a75a1c"}}, {"id": "weekend-dalle-scarpe.2", "text": "Mi riconoscono lo stesso. Dalle scarpe.", "en": "Mi riconoscono lo stesso. Dalle scarpe.", "flavor": "silly", "slot": "weekend", "tags": "", "joke": "weekend-dalle-scarpe", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/weekend-dalle-scarpe.2.m4a?v=a7b41b374109"}, "versions": {"clown": "a7b41b374109"}}, {"id": "poke-agent", "text": "Una battuta su richiesta. Il mio agente sarebbe fiero di me.", "en": "A joke on demand. My agent would be so proud.", "flavor": "dry", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-agent.m4a?v=1f7b7a97230e"}, "versions": {"clown": "1f7b7a97230e"}}, {"id": "poke-always-in.1", "text": "Avanti! Oggi abbiamo battute freschissime.", "en": "Fresh jokes! Get your fresh jokes!", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-always-in", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-always-in.1.m4a?v=da271445ff93"}, "versions": {"clown": "da271445ff93"}}, {"id": "poke-always-in.2", "text": "Insomma, fresche. Dell'anno scorso.", "en": "Well. Fresh-ish. Last season's.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-always-in", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-always-in.2.m4a?v=07540158bbd9"}, "versions": {"clown": "07540158bbd9"}}, {"id": "poke-nobody-asks", "text": "Una richiesta! Non me ne fanno una da quando è partito il circo.", "en": "A request! Nobody's asked since the circus left.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-nobody-asks.m4a?v=f5d36eb65688"}, "versions": {"clown": "f5d36eb65688"}}, {"id": "poke-boop", "text": "Aspetta, mi sono messo il naso al contrario. Ecco, adesso fa ridere.", "en": "Hang on, my nose is on backwards. There. Much funnier.", "flavor": "silly", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-boop.m4a?v=46aa1c7ef8bb"}, "versions": {"clown": "46aa1c7ef8bb"}}, {"id": "poke-front-row", "text": "Le battute buone stanno nella scarpa sinistra. Questa è della destra.", "en": "I keep the good jokes in my left shoe. This one's from the right.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-front-row.m4a?v=e08c7be399f1"}, "versions": {"clown": "e08c7be399f1"}}, {"id": "poke-chiamato.1", "text": "Mi hai chiamato? Nessuno mi chiama mai.", "en": "Mi hai chiamato? Nessuno mi chiama mai.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-chiamato", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-chiamato.1.m4a?v=cd385017c707"}, "versions": {"clown": "cd385017c707"}}, {"id": "poke-chiamato.2", "text": "Aspetta, mi metto il naso buono.", "en": "Aspetta, mi metto il naso buono.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-chiamato", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-chiamato.2.m4a?v=8eb45dc64227"}, "versions": {"clown": "8eb45dc64227"}}, {"id": "poke-toc-toc.1", "text": "Toc toc? Avanti, è aperto.", "en": "Toc toc? Avanti, è aperto.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-toc-toc", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-toc-toc.1.m4a?v=826c36bc6cdf"}, "versions": {"clown": "826c36bc6cdf"}}, {"id": "poke-toc-toc.2", "text": "Il circo è aperto. Il pagliaccio, più o meno.", "en": "Il circo è aperto. Il pagliaccio, più o meno.", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "poke-toc-toc", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/poke-toc-toc.2.m4a?v=49d32eb4c3a8"}, "versions": {"clown": "49d32eb4c3a8"}}, {"id": "poke-signature-it", "text": "…ma chi fa ridere Mister Pagliacci?", "en": "…ma chi fa ridere Mister Pagliacci?", "flavor": "bittersweet", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/poke-signature-it.m4a?v=32dd6da2719e"}, "versions": {"clown": "32dd6da2719e"}}, {"id": "back-saved-joke", "text": "Oh! Stavo giusto provando la faccia sorpresa. Venuta benissimo.", "en": "Hello! I was just practicing my surprised face. Nailed it.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/back-saved-joke.m4a?v=74f81d581039"}, "versions": {"clown": "74f81d581039"}}, {"id": "back-find-nose", "text": "Oh! Pubblico! Un attimo, dove ho messo il naso?", "en": "Oh! An audience. Hold on, where's my nose?", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/back-find-nose.m4a?v=28698227426b"}, "versions": {"clown": "28698227426b"}}, {"id": "back-rehearsed.1", "text": "Rieccoti. Mentre eri via ho provato il numero.", "en": "Welcome back. I rehearsed while you were gone.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-rehearsed", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-rehearsed.1.m4a?v=69a54c000177"}, "versions": {"clown": "69a54c000177"}}, {"id": "back-rehearsed.2", "text": "Non è servito.", "en": "It didn't help.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-rehearsed", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-rehearsed.2.m4a?v=4700c18725cb"}, "versions": {"clown": "4700c18725cb"}}, {"id": "back-mime-show.1", "text": "Mentre eri via ho fatto uno spettacolo di mimo.", "en": "I did a mime show while you were away.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-mime-show", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-mime-show.1.m4a?v=d8c65e0485d6"}, "versions": {"clown": "d8c65e0485d6"}}, {"id": "back-mime-show.2", "text": "Non se n'è accorto nessuno. Ero bravissimo.", "en": "Nobody noticed. That's how good it was.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-mime-show", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-mime-show.2.m4a?v=2b4f86568f64"}, "versions": {"clown": "2b4f86568f64"}}, {"id": "back-moment.1", "text": "E ora, il momento che stavi aspettando.", "en": "And now, the moment you've been waiting for.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-moment", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-moment.1.m4a?v=c0eb409fb0f6"}, "versions": {"clown": "c0eb409fb0f6"}}, {"id": "back-moment.2", "text": "Io. Di nuovo. Scusa.", "en": "Me. Again. Sorry.", "flavor": "bittersweet", "slot": "welcomeBack", "tags": "", "joke": "back-moment", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-moment.2.m4a?v=55a2a8a36a20"}, "versions": {"clown": "55a2a8a36a20"}}, {"id": "back-sgonfia.1", "text": "Ah, pubblico! Avevo appena gonfiato una barzelletta.", "en": "Ah, pubblico! Avevo appena gonfiato una barzelletta.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "back-sgonfia", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-sgonfia.1.m4a?v=9aa7b2aeb348"}, "versions": {"clown": "9aa7b2aeb348"}}, {"id": "back-sgonfia.2", "text": "Si è già sgonfiata.", "en": "Si è già sgonfiata.", "flavor": "silly", "slot": "welcomeBack", "tags": "", "joke": "back-sgonfia", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-sgonfia.2.m4a?v=e53c327e6824"}, "versions": {"clown": "e53c327e6824"}}, {"id": "back-permesso.1", "text": "Io non mi sono mosso.", "en": "Io non mi sono mosso.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-permesso", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-permesso.1.m4a?v=aa5c63a853a5"}, "versions": {"clown": "aa5c63a853a5"}}, {"id": "back-permesso.2", "text": "Con queste scarpe ci vuole il permesso del comune.", "en": "Con queste scarpe ci vuole il permesso del comune.", "flavor": "absurd", "slot": "welcomeBack", "tags": "", "joke": "back-permesso", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/back-permesso.2.m4a?v=d6bf0f7ad59c"}, "versions": {"clown": "d6bf0f7ad59c"}}, {"id": "call-mime", "text": "Tutto quel silenzio. Ne ho approfittato per ripassare il mimo.", "en": "All that quiet. I used it to practice my mime.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/call-mime.m4a?v=b4d4b0a9e4d6"}, "versions": {"clown": "b4d4b0a9e4d6"}}, {"id": "call-horn.1", "text": "Ho tenuto in mano la trombetta tutto il tempo.", "en": "I held my horn the whole time.", "flavor": "dry", "slot": "afterCall", "tags": "", "joke": "call-horn", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-horn.1.m4a?v=f52e8dda971c"}, "versions": {"clown": "f52e8dda971c"}}, {"id": "call-horn.2", "text": "Non l'ho suonata. Mai fatto niente di più difficile.", "en": "Hardest thing I've ever done.", "flavor": "dry", "slot": "afterCall", "tags": "", "joke": "call-horn", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-horn.2.m4a?v=f09805bbf762"}, "versions": {"clown": "f09805bbf762"}}, {"id": "call-tiptoe", "text": "Sono stato in punta di piedi tutto il tempo. Con queste scarpe.", "en": "I tiptoed the whole time. In these shoes.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/call-tiptoe.m4a?v=cf63b564f6ca"}, "versions": {"clown": "cf63b564f6ca"}}, {"id": "call-pigeon.1", "text": "Sono rimasto immobile tutto il tempo.", "en": "I stood perfectly still the whole time.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "call-pigeon", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-pigeon.1.m4a?v=1e4c0aab21cf"}, "versions": {"clown": "1e4c0aab21cf"}}, {"id": "call-pigeon.2", "text": "Mi si è posato sopra un piccione.", "en": "A pigeon landed on me.", "flavor": "absurd", "slot": "afterCall", "tags": "", "joke": "call-pigeon", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-pigeon.2.m4a?v=51939342f4c8"}, "versions": {"clown": "51939342f4c8"}}, {"id": "call-lost-joke.1", "text": "Nel frattempo mi era venuta una battuta geniale.", "en": "I thought of a great joke while you were busy.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-lost-joke", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-lost-joke.1.m4a?v=c25b7dcb3c99"}, "versions": {"clown": "c25b7dcb3c99"}}, {"id": "call-lost-joke.2", "text": "Se n'è andata. Le battute geniali non fanno anticamera.", "en": "It's gone. That's showbiz.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-lost-joke", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-lost-joke.2.m4a?v=2b42b6a08a99"}, "versions": {"clown": "2b42b6a08a99"}}, {"id": "call-mimo-timido.1", "text": "Zitto come un mimo.", "en": "Zitto come un mimo.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "call-mimo-timido", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-mimo-timido.1.m4a?v=81c63f14d91a"}, "versions": {"clown": "81c63f14d91a"}}, {"id": "call-mimo-timido.2", "text": "Un mimo timido. In uno sgabuzzino.", "en": "Un mimo timido. In uno sgabuzzino.", "flavor": "silly", "slot": "afterCall", "tags": "", "joke": "call-mimo-timido", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-mimo-timido.2.m4a?v=082811e93ffa"}, "versions": {"clown": "082811e93ffa"}}, {"id": "call-applauso-muto.1", "text": "Finito? Applauso muto.", "en": "Finito? Applauso muto.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-applauso-muto", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-applauso-muto.1.m4a?v=c1efc0e2e67f"}, "versions": {"clown": "c1efc0e2e67f"}}, {"id": "call-applauso-muto.2", "text": "È l'unico che so fare bene.", "en": "È l'unico che so fare bene.", "flavor": "bittersweet", "slot": "afterCall", "tags": "", "joke": "call-applauso-muto", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/call-applauso-muto.2.m4a?v=d9577048db27"}, "versions": {"clown": "d9577048db27"}}, {"id": "shush-reviews", "text": "Posso riparlare? Il mio silenzio ha avuto ottime recensioni.", "en": "I may speak again? My silence got great reviews.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/shush-reviews.m4a?v=89eae315acc4"}, "versions": {"clown": "89eae315acc4"}}, {"id": "shush-mime-wept.1", "text": "Quel silenzio è piaciuto tantissimo.", "en": "That silence was my best work.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-mime-wept", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-mime-wept.1.m4a?v=3bae8f2b5acd"}, "versions": {"clown": "3bae8f2b5acd"}}, {"id": "shush-mime-wept.2", "text": "Una statua mi ha chiesto l'autografo.", "en": "A mime came by and wept.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-mime-wept", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-mime-wept.2.m4a?v=6a231b34ab8e"}, "versions": {"clown": "6a231b34ab8e"}}, {"id": "shush-honk.1", "text": "Posso parlare di nuovo?", "en": "I'm allowed to talk again?", "flavor": "silly", "slot": "shushEnd", "tags": "", "joke": "shush-honk", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-honk.1.m4a?v=670bfc381ec6"}, "versions": {"clown": "670bfc381ec6"}}, {"id": "shush-honk.2", "text": "Fammi ricordare come si fa. Ah, sì. Pè-pè.", "en": "Let me remember how. Ah, yes. Honk.", "flavor": "silly", "slot": "shushEnd", "tags": "", "joke": "shush-honk", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-honk.2.m4a?v=22559bd2df1b"}, "versions": {"clown": "22559bd2df1b"}}, {"id": "shush-natural", "text": "Ho provato a stare zitto. Pare che io abbia talento.", "en": "I practiced silence. Turns out I'm a natural.", "flavor": "bittersweet", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/shush-natural.m4a?v=a868b152769e"}, "versions": {"clown": "a868b152769e"}}, {"id": "shush-tutte-questa.1", "text": "Zitto zitto, ho preparato tre barzellette.", "en": "Zitto zitto, ho preparato tre barzellette.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "shush-tutte-questa", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-tutte-questa.1.m4a?v=4ae6b3c9730a"}, "versions": {"clown": "4ae6b3c9730a"}}, {"id": "shush-tutte-questa.2", "text": "Sono tutte questa.", "en": "Sono tutte questa.", "flavor": "dry", "slot": "shushEnd", "tags": "", "joke": "shush-tutte-questa", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-tutte-questa.2.m4a?v=5f3e9326b31d"}, "versions": {"clown": "5f3e9326b31d"}}, {"id": "shush-prestito.1", "text": "Che bel silenzio.", "en": "Che bel silenzio.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-prestito", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-prestito.1.m4a?v=ff237f301b0c"}, "versions": {"clown": "ff237f301b0c"}}, {"id": "shush-prestito.2", "text": "Un mimo me l'ha chiesto in prestito.", "en": "Un mimo me l'ha chiesto in prestito.", "flavor": "absurd", "slot": "shushEnd", "tags": "", "joke": "shush-prestito", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/shush-prestito.2.m4a?v=a09c37922eab"}, "versions": {"clown": "a09c37922eab"}}, {"id": "battery-emotional", "text": "Batteria quasi a terra. Anch'io, ma per motivi sentimentali.", "en": "Battery's low. Mine too, but mine is emotional.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/battery-emotional.m4a?v=79657ea649fb"}, "versions": {"clown": "79657ea649fb"}}, {"id": "battery-balloon", "text": "Batteria scarica. Mi sento un palloncino tre giorni dopo la festa.", "en": "Battery's low. I know the feeling. I'm a balloon on day three.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/battery-balloon.m4a?v=d49399dbc2f5"}, "versions": {"clown": "d49399dbc2f5"}}, {"id": "battery-shortest.1", "text": "Batteria scarica. Ecco la mia barzelletta più corta:", "en": "Low battery. Time for my shortest joke:", "flavor": "dry", "slot": "batteryLow", "tags": "", "joke": "battery-shortest", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-shortest.1.m4a?v=c1e4e705cbd1"}, "versions": {"clown": "c1e4e705cbd1"}}, {"id": "battery-shortest.2", "text": "lo stipendio di un pagliaccio.", "en": "a clown's paycheck.", "flavor": "dry", "slot": "batteryLow", "tags": "", "joke": "battery-shortest", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-shortest.2.m4a?v=d2f98e335ab8"}, "versions": {"clown": "d2f98e335ab8"}}, {"id": "battery-red", "text": "Batteria in rosso. Come me: col naso e col conto in banca.", "en": "The battery's in the red. Finally, something matches my nose.", "flavor": "silly", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/battery-red.m4a?v=52d6065b626f"}, "versions": {"clown": "52d6065b626f"}}, {"id": "battery-push.1", "text": "Batteria scarica. Come la mia macchinina.", "en": "Low battery. Like my tiny car.", "flavor": "absurd", "slot": "batteryLow", "tags": "", "joke": "battery-push", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-push.1.m4a?v=b84f7aeff8c1"}, "versions": {"clown": "b84f7aeff8c1"}}, {"id": "battery-push.2", "text": "Scendono dodici pagliacci a spingere.", "en": "Twelve clowns get out and push.", "flavor": "absurd", "slot": "batteryLow", "tags": "", "joke": "battery-push", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-push.2.m4a?v=f418e5169f49"}, "versions": {"clown": "f418e5169f49"}}, {"id": "battery-1998.1", "text": "Batteria quasi scarica.", "en": "Batteria quasi scarica.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "battery-1998", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-1998.1.m4a?v=43b4393f645f"}, "versions": {"clown": "43b4393f645f"}}, {"id": "battery-1998.2", "text": "Io lo sono dal 1998.", "en": "Io lo sono dal 1998.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "battery-1998", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-1998.2.m4a?v=596fd6753a62"}, "versions": {"clown": "596fd6753a62"}}, {"id": "battery-lumicino.1", "text": "Batteria al lumicino.", "en": "Batteria al lumicino.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "battery-lumicino", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-lumicino.1.m4a?v=3e430723188c"}, "versions": {"clown": "3e430723188c"}}, {"id": "battery-lumicino.2", "text": "Io ci vivo da anni, al lumicino. Ci si abitua.", "en": "Io ci vivo da anni, al lumicino. Ci si abitua.", "flavor": "bittersweet", "slot": "batteryLow", "tags": "", "joke": "battery-lumicino", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/battery-lumicino.2.m4a?v=559b8c4a7f76"}, "versions": {"clown": "559b8c4a7f76"}}, {"id": "charging-smile", "text": "In carica. Magari bastasse una presa anche per il sorriso.", "en": "Charging. If only a smile plugged in like that.", "flavor": "bittersweet", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/charging-smile.m4a?v=d5c4babd6b35"}, "versions": {"clown": "d5c4babd6b35"}}, {"id": "charging-nose-glow.1", "text": "In carica. Mi si è acceso il naso!", "en": "Plugged in. My nose is glowing.", "flavor": "silly", "slot": "charging", "tags": "", "joke": "charging-nose-glow", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-nose-glow.1.m4a?v=1168cba43366"}, "versions": {"clown": "1168cba43366"}}, {"id": "charging-nose-glow.2", "text": "Ah, no. È sempre così.", "en": "No, wait. That's just my nose.", "flavor": "silly", "slot": "charging", "tags": "", "joke": "charging-nose-glow", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-nose-glow.2.m4a?v=f409c04d7ada"}, "versions": {"clown": "f409c04d7ada"}}, {"id": "charging-applause", "text": "In carica. Finalmente qualcuno che mi dà la carica.", "en": "Ah, power. The closest thing I get to applause.", "flavor": "bittersweet", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/charging-applause.m4a?v=428803ad1b32"}, "versions": {"clown": "428803ad1b32"}}, {"id": "charging-hug.1", "text": "In carica. Il computer si fa abbracciare.", "en": "Plugged in. The computer's getting a hug.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "charging-hug", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-hug.1.m4a?v=d4264dfb9dfc"}, "versions": {"clown": "d4264dfb9dfc"}}, {"id": "charging-hug.2", "text": "Un abbraccio lungo e sottile. Dal muro.", "en": "A long thin one. From the wall.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "charging-hug", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-hug.2.m4a?v=e707987fabd9"}, "versions": {"clown": "e707987fabd9"}}, {"id": "charging-tail", "text": "In carica. Il computer ha messo la coda. Manca solo il domatore.", "en": "Charging. The computer has a tail now. Very circus.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/charging-tail.m4a?v=f17fbc8689bf"}, "versions": {"clown": "f17fbc8689bf"}}, {"id": "charging-controcorrente.1", "text": "Attaccato alla corrente.", "en": "Attaccato alla corrente.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "charging-controcorrente", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-controcorrente.1.m4a?v=169b0f61b7b3"}, "versions": {"clown": "169b0f61b7b3"}}, {"id": "charging-controcorrente.2", "text": "Io invece vado controcorrente, e si vede.", "en": "Io invece vado controcorrente, e si vede.", "flavor": "absurd", "slot": "charging", "tags": "", "joke": "charging-controcorrente", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-controcorrente.2.m4a?v=ea728cd28f51"}, "versions": {"clown": "ea728cd28f51"}}, {"id": "charging-torte.1", "text": "In carica. Io mi ricarico con le torte.", "en": "In carica. Io mi ricarico con le torte.", "flavor": "silly", "slot": "charging", "tags": "", "joke": "charging-torte", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-torte.1.m4a?v=a151578e2fe7"}, "versions": {"clown": "a151578e2fe7"}}, {"id": "charging-torte.2", "text": "In faccia, purtroppo.", "en": "In faccia, purtroppo.", "flavor": "silly", "slot": "charging", "tags": "", "joke": "charging-torte", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/charging-torte.2.m4a?v=b68c571f2f62"}, "versions": {"clown": "b68c571f2f62"}}, {"id": "unplugged-circus", "text": "Staccato dalla presa. Come un pagliaccio scappato dal circo.", "en": "Unplugged. Like a clown who wandered off from the circus.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/unplugged-circus.m4a?v=64e4bc646126"}, "versions": {"clown": "64e4bc646126"}}, {"id": "unplugged-balloon.1", "text": "Staccata la spina. Liberi!", "en": "Unplugged. Free as a balloon.", "flavor": "bittersweet", "slot": "unplugged", "tags": "", "joke": "unplugged-balloon", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-balloon.1.m4a?v=26418bf0311c"}, "versions": {"clown": "26418bf0311c"}}, {"id": "unplugged-balloon.2", "text": "Liberi come un pagliaccio a fine stagione. Cioè senza lavoro.", "en": "I'm holding on to the clock, just in case.", "flavor": "bittersweet", "slot": "unplugged", "tags": "", "joke": "unplugged-balloon", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-balloon.2.m4a?v=a3771c9dab85"}, "versions": {"clown": "a3771c9dab85"}}, {"id": "unplugged-tour", "text": "Via il cavo! Si parte in tournée.", "en": "No cable! The computer's on tour. I'm the opening act.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/unplugged-tour.m4a?v=d7c8053678d4"}, "versions": {"clown": "d7c8053678d4"}}, {"id": "unplugged-no-net.1", "text": "Senza cavo. Come un funambolo senza rete.", "en": "Unplugged. Tightrope, no net.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "unplugged-no-net", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-no-net.1.m4a?v=e9b69761aa62"}, "versions": {"clown": "e9b69761aa62"}}, {"id": "unplugged-no-net.2", "text": "Il computer è coraggioso. Io tengo l'ombrellino.", "en": "The computer's very brave. I'm just holding the umbrella.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "unplugged-no-net", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-no-net.2.m4a?v=548f97133479"}, "versions": {"clown": "548f97133479"}}, {"id": "unplugged-a-braccio", "text": "Staccato. Si va a braccio, come ai vecchi tempi.", "en": "Staccato. Si va a braccio, come ai vecchi tempi.", "flavor": "dry", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/unplugged-a-braccio.m4a?v=fbdb106e78b0"}, "versions": {"clown": "fbdb106e78b0"}}, {"id": "unplugged-aquilone.1", "text": "Niente filo, come un aquilone.", "en": "Niente filo, come un aquilone.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "unplugged-aquilone", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-aquilone.1.m4a?v=4810eee8228a"}, "versions": {"clown": "4810eee8228a"}}, {"id": "unplugged-aquilone.2", "text": "Speriamo che nessuno tiri.", "en": "Speriamo che nessuno tiri.", "flavor": "absurd", "slot": "unplugged", "tags": "", "joke": "unplugged-aquilone", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/unplugged-aquilone.2.m4a?v=646648d1d515"}, "versions": {"clown": "646648d1d515"}}, {"id": "dark-mysterious", "text": "Luci basse. Farei il misterioso, ma le scarpe cigolano.", "en": "Lights down. I'd be mysterious, but my shoes squeak.", "flavor": "silly", "slot": "wentDark", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/dark-mysterious.m4a?v=d715fcb1a1e5"}, "versions": {"clown": "d715fcb1a1e5"}}, {"id": "dark-my-number.1", "text": "Si abbassano le luci. Tocca a me?", "en": "Lights down. Is this my number?", "flavor": "bittersweet", "slot": "wentDark", "tags": "", "joke": "dark-my-number", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/dark-my-number.1.m4a?v=427baf48ced7"}, "versions": {"clown": "427baf48ced7"}}, {"id": "dark-my-number.2", "text": "Non tocca mai a me.", "en": "It's never my number.", "flavor": "bittersweet", "slot": "wentDark", "tags": "", "joke": "dark-my-number", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/dark-my-number.2.m4a?v=9df09102b091"}, "versions": {"clown": "9df09102b091"}}, {"id": "dark-glow.1", "text": "È buio. Oddio, ho perso una scarpa.", "en": "It's dark. Good news: my nose glows.", "flavor": "silly", "slot": "wentDark", "tags": "", "joke": "dark-glow", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/dark-glow.1.m4a?v=f87aa230f10c"}, "versions": {"clown": "f87aa230f10c"}}, {"id": "dark-glow.2", "text": "Ah, no. Ci sto inciampando sopra.", "en": "Bad news: nothing else does.", "flavor": "silly", "slot": "wentDark", "tags": "", "joke": "dark-glow", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/dark-glow.2.m4a?v=837708a6f1f1"}, "versions": {"clown": "837708a6f1f1"}}, {"id": "dark-tragic.1", "text": "Modalità scura. Adesso sono un pagliaccio tragico.", "en": "Dark mode. I'm a tragic clown now.", "flavor": "bittersweet", "slot": "wentDark", "tags": "", "joke": "dark-tragic", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/dark-tragic.1.m4a?v=10e82badeb39"}, "versions": {"clown": "10e82badeb39"}}, {"id": "dark-tragic.2", "text": "Uguale a prima. Però con l'atmosfera.", "en": "Same as before, but with mood lighting.", "flavor": "bittersweet", "slot": "wentDark", "tags": "", "joke": "dark-tragic", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/dark-tragic.2.m4a?v=98ed8c44de74"}, "versions": {"clown": "98ed8c44de74"}}, {"id": "dark-mime-switch", "text": "Luci spente. Da qualche parte un mimo finge di cercare l'interruttore.", "en": "Lights out. Somewhere a mime is pretending to find the switch.", "flavor": "absurd", "slot": "wentDark", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/dark-mime-switch.m4a?v=a2d5d98646a5"}, "versions": {"clown": "a2d5d98646a5"}}, {"id": "dark-catarifrangente", "text": "Buio. Per fortuna il naso è catarifrangente.", "en": "Buio. Per fortuna il naso è catarifrangente.", "flavor": "silly", "slot": "wentDark", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/dark-catarifrangente.m4a?v=54003b5df825"}, "versions": {"clown": "54003b5df825"}}, {"id": "dark-grigi.1", "text": "Al buio tutti i pagliacci sono grigi.", "en": "Al buio tutti i pagliacci sono grigi.", "flavor": "silly", "slot": "wentDark", "tags": "", "joke": "dark-grigi", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/dark-grigi.1.m4a?v=eb024486ed93"}, "versions": {"clown": "eb024486ed93"}}, {"id": "dark-grigi.2", "text": "Tranne il naso.", "en": "Tranne il naso.", "flavor": "silly", "slot": "wentDark", "tags": "", "joke": "dark-grigi", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/dark-grigi.2.m4a?v=8f7a0d45614c"}, "versions": {"clown": "8f7a0d45614c"}}, {"id": "light-act-natural", "text": "Luci accese! Faccio finta di niente, mi dico. Non mi ascolto mai.", "en": "Lights up! Act natural, I tell myself. I never listen.", "flavor": "dry", "slot": "wentLight", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/light-act-natural.m4a?v=f14a29f282e6"}, "versions": {"clown": "f14a29f282e6"}}, {"id": "light-spotlight.1", "text": "Un riflettore! Per me?", "en": "A spotlight! For me?", "flavor": "bittersweet", "slot": "wentLight", "tags": "", "joke": "light-spotlight", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/light-spotlight.1.m4a?v=484eae588922"}, "versions": {"clown": "484eae588922"}}, {"id": "light-spotlight.2", "text": "Ah, no. È la luce. È per tutti.", "en": "No. Never mind. It's for everyone.", "flavor": "bittersweet", "slot": "wentLight", "tags": "", "joke": "light-spotlight", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/light-spotlight.2.m4a?v=901e46a40d19"}, "versions": {"clown": "901e46a40d19"}}, {"id": "light-makeup-adjusts", "text": "Luce! Un attimo, che mi rimetto il sorriso.", "en": "Lights up. Give me a second, my makeup is adjusting.", "flavor": "silly", "slot": "wentLight", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/light-makeup-adjusts.m4a?v=9ba32c0946d5"}, "versions": {"clown": "9ba32c0946d5"}}, {"id": "light-almost-real", "text": "Con questa luce sembro quasi felice. Dev'essere una luce costosa.", "en": "In this light, my smile almost looks real.", "flavor": "bittersweet", "slot": "wentLight", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/light-almost-real.m4a?v=d733f6720945"}, "versions": {"clown": "d733f6720945"}}, {"id": "light-il-trucco-cera.1", "text": "Si accende la luce.", "en": "Si accende la luce.", "flavor": "silly", "slot": "wentLight", "tags": "", "joke": "light-il-trucco-cera", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/light-il-trucco-cera.1.m4a?v=d8abd45ad9ba"}, "versions": {"clown": "d8abd45ad9ba"}}, {"id": "light-il-trucco-cera.2", "text": "Ecco, adesso
