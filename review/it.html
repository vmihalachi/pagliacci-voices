<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Voice review</title>
<style>
  /* The default colors; an app sets its own in companion.json (`voice.reviewColors`), injected after this block. */
  :root {
    --paper: #FFF8E7; --card: #FFFDF7; --ink: #3D2B1F; --ink-soft: #7A6555; --line: #E8DCC4;
    --accent: #F2C94C; --accent-soft: #FCEFC4; --on-accent: #3D2B1F;
    --done: #6B8F4E; --done-soft: #E3EDD5; --flag: #C4623A; --flag-soft: #F6DED3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1F1B17; --card: #2A241D; --ink: #EFE6D8; --ink-soft: #B3A592; --line: #3E352B;
      --accent: #E2B93F; --accent-soft: #4A3D1C; --on-accent: #3D2B1F;
      --done: #9BC07A; --done-soft: #2E3A24; --flag: #E3825C; --flag-soft: #4A2C20;
    }
  }
  :root{--paper:#F6F1E9;--card:#FFF3E6;--ink:#1C1519;--ink-soft:#5E5257;--line:#DDD3C6;--accent:#B23A1F;--accent-soft:#F3D5CB;--on-accent:#FFFFFF;--done:#2D2A8A;--done-soft:#DCDAF3;--flag:#C98A12;--flag-soft:#F7E3B5;--link:#9C2F17;}@media (prefers-color-scheme: dark){:root{--paper:#1E1A20;--card:#241E27;--ink:#EFE8DD;--ink-soft:#A89EA4;--line:#3A333D;--accent:#F2B23A;--accent-soft:#3D2F17;--on-accent:#2E1608;--done:#A9A3FF;--done-soft:#2A2752;--flag:#E0644A;--flag-soft:#44201A;--link:#F2B23A;}}
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; max-width: 980px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  .progress { flex: 1 1 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 120px; }
  .progress > i { display: block; height: 100%; background: var(--done); width: 0; transition: width .2s; }
  .count { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  button, select { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  button:hover { border-color: var(--ink-soft); }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; color: var(--on-accent); }
  button.on { background: var(--done-soft); border-color: var(--done); }
  .keys { max-width: 980px; margin: 6px auto 0; color: var(--ink-soft); font-size: 12px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--card); }
  main { max-width: 980px; margin: 0 auto; padding: 12px 16px 270px; }
  .row { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; }
  .row.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row.flagged { border-color: var(--flag); }
  .row.done .num::after { content: " ✓"; color: var(--done); }
  .num { color: var(--ink-soft); font-variant-numeric: tabular-nums; padding-top: 3px; font-size: 13px; }
  .it { font-size: 18px; font-weight: 600; }
  .en { color: var(--ink-soft); font-size: 13px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--ink-soft); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .chip.flavor-0 { background: var(--accent-soft); } .chip.flavor-1 { background: var(--flag-soft); }
  .chip.new { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .chip.waiting { border-style: dashed; }
  .chip.flavor-2 { background: var(--done-soft); } .chip.flavor-3 { background: var(--line); }
  /* A joke's later parts sit under its first, indented, joined to it. */
  .row.part { margin: -6px 0 10px 34px; border-top-style: dashed; }
  .actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .pair { display: flex; gap: 6px; } .pair button:first-child { flex: 1; }
  .actions button { font-size: 13px; padding: 3px 10px; white-space: nowrap; }
  .actions button.flag.on { background: var(--flag-soft); border-color: var(--flag); }
  .actions .playing { background: var(--accent-soft); border-color: var(--accent); }
  .note { grid-column: 2 / 4; display: none; }
  .row.flagged .note { display: block; }
  .note input { width: 100%; font: inherit; font-size: 13px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1.5px solid var(--line); padding: 10px 16px; }
  footer .inner { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
  footer textarea { width: 100%; height: 96px; resize: vertical; font: 12px/1.4 ui-monospace, monospace; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; }
  footer .side { display: grid; gap: 6px; }
  .hint { font-size: 12px; color: var(--ink-soft); }
  /* The pager sits on top of the notes footer; on wide screens it is fixed under the list instead. */
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; max-width: 980px; margin: 0 auto 10px; }
  .pager button { font-size: 13px; padding: 3px 10px; min-width: 34px; font-variant-numeric: tabular-nums; }
  .pager button[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pager button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  .pager[hidden] { display: none; }
  .pager .gap { color: var(--ink-soft); padding: 0 2px; }
  .pager .range { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .it, .en { overflow-wrap: anywhere; }
  .notice { font-size: 11px; color: var(--ink-soft); }
  /* Wide screens: the notes become a full-height column on the right, room for many flags. */
  @media (min-width: 1100px) {
    :root { --notes: clamp(320px, 28vw, 440px); }
    /* The page reserves the column, so the header bar and the list stay centered in what's left. */
    body { padding-right: var(--notes); }
    .bar, .keys, main { max-width: 1120px; }
    main { padding: 16px 24px 80px; }
    .pager { position: fixed; left: 0; right: var(--notes); bottom: 0; max-width: none; margin: 0; padding: 10px 24px; background: var(--card); border-top: 1.5px solid var(--line); }
    header { padding: 12px 24px; }
    footer { left: auto; top: 0; width: var(--notes); border-top: 0; border-left: 1.5px solid var(--line); padding: 16px; }
    footer .inner { height: 100%; display: flex; flex-direction: column; }
    footer textarea { flex: 1; height: auto; resize: none; font-size: 13px; }
    footer .side { flex: none; }
  }
  @media (max-width: 640px) {
    .row { grid-template-columns: minmax(0, 1fr); } .num { display: none; }
    .actions { flex-direction: row; flex-wrap: wrap; }
    .note { grid-column: 1; } footer .inner { grid-template-columns: 1fr; } footer textarea { height: 56px; }
    main { padding-bottom: 250px; } .keys { display: none; } .pager .range { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title"></h1>
    <select id="lang" title="Language" aria-label="Language"></select>
    <button id="listen" class="primary" title="Space">▶ Listen through</button>
    <select id="voice" title="Which voice the listen-through plays"></select>
    <select id="speed" title="Playback speed while reviewing (the app plays at your Rate setting)">
      <option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
    <select id="filter">
      <option value="all">All lines</option><option value="voiced">Voiced</option><option value="todo">New or not heard yet</option><option value="flagged">Flagged</option><option value="waiting">Waiting for a voice</option>
    </select>
    <div class="progress"><i id="bar"></i></div>
    <span class="count" id="count"></span>
  </div>
  <div class="keys"><kbd>Space</kbd> listen through / pause · <kbd>↓</kbd><kbd>↑</kbd> next / previous · <kbd>←</kbd><kbd>→</kbd> page · <kbd>1</kbd><kbd>2</kbd>… play the first, second… voice ·
    <kbd>R</kbd> retake the voice you just heard · <kbd>T</kbd> the text should change · <kbd>N</kbd> write a note · Flags are kept in this browser.</div>
</header>
<main id="list"></main>
<footer>
  <nav class="pager" id="pager" aria-label="Pages"></nav>
  <div class="inner">
    <textarea id="summary" readonly placeholder="Flag what sounds off; your notes for Claude appear here."></textarea>
    <div class="side">
      <button id="copy" class="primary">Copy notes for Claude</button>
      <button id="clear">Clear flags</button>
      <span class="hint" id="copied"></span>
      <span class="notice" id="notice" hidden></span>
    </div>
  </div>
</footer>
<script>
const DATA = {"lang": "it", "languageName": "Italian", "voices": [{"kind": "clown", "name": "Livio"}], "rows": [{"id": "general-red-nose", "text": "Ho il naso rosso. E pure il conto in banca.", "en": "My nose is red. So is my bank account.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-red-nose.m4a?v=f18108261d83"}, "versions": {"clown": "f18108261d83"}}, {"id": "general-juggling.1", "text": "Ho provato a fare il giocoliere con i miei problemi.", "en": "I tried juggling my problems.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-juggling", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-juggling.1.m4a?v=2ca78c71d62b"}, "versions": {"clown": "2ca78c71d62b"}}, {"id": "general-juggling.2", "text": "Ora sono tutti per terra. E anch'io.", "en": "Now they're all on the floor. So am I.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-juggling", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-juggling.2.m4a?v=41dde1d1512f"}, "versions": {"clown": "41dde1d1512f"}}, {"id": "general-pie-flavor.1", "text": "Trent'anni di torte in faccia.", "en": "Thirty years of pies in the face.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pie-flavor", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pie-flavor.1.m4a?v=61931bbb1373"}, "versions": {"clown": "61931bbb1373"}}, {"id": "general-pie-flavor.2", "text": "Ancora non so che gusto avessero.", "en": "I still don't know what flavor they were.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pie-flavor", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pie-flavor.2.m4a?v=9324058d8142"}, "versions": {"clown": "9324058d8142"}}, {"id": "general-pie-diet", "text": "Sono a dieta: solo palloncini. Gonfiano, ma non ingrassano.", "en": "I'm on a strict diet. Only the pies that hit me.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-pie-diet.m4a?v=240333d229b3"}, "versions": {"clown": "240333d229b3"}}, {"id": "general-pie-hug", "text": "Una torta in faccia è solo un abbraccio con la crema.", "en": "A pie in the face is just a hug with filling.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-pie-hug.m4a?v=6a2887691ea4"}, "versions": {"clown": "6a2887691ea4"}}, {"id": "general-pratfall.1", "text": "Cado per mestiere.", "en": "I fall down for a living.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pratfall", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pratfall.1.m4a?v=a728c71d205a"}, "versions": {"clown": "a728c71d205a"}}, {"id": "general-pratfall.2", "text": "Rialzarmi è volontariato.", "en": "Getting up is unpaid.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pratfall", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pratfall.2.m4a?v=4c5ee1759746"}, "versions": {"clown": "4c5ee1759746"}}, {"id": "general-squirting-flower", "text": "Il mio fiore spruzzino è l'unica pianta che mi è sopravvissuta.", "en": "My squirting flower is the only plant I've kept alive.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-squirting-flower.m4a?v=63f61e9ebf81"}, "versions": {"clown": "63f61e9ebf81"}}, {"id": "general-tear.1", "text": "Mi chiedono se la lacrima sulla guancia è dipinta.", "en": "People ask if the tear on my cheek is painted.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-tear", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-tear.1.m4a?v=1c6b41684f3d"}, "versions": {"clown": "1c6b41684f3d"}}, {"id": "general-tear.2", "text": "Quasi sempre. Certi giorni risparmio sul colore.", "en": "Mostly. Some days I save on paint.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-tear", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-tear.2.m4a?v=260176b1290b"}, "versions": {"clown": "260176b1290b"}}, {"id": "general-balloon-dog.1", "text": "Ho fatto un cane coi palloncini.", "en": "I made a balloon dog.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-balloon-dog", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-balloon-dog.1.m4a?v=ef08fbcef241"}, "versions": {"clown": "ef08fbcef241"}}, {"id": "general-balloon-dog.2", "text": "È scappato con una giraffa di palloncini. Sembrano felici.", "en": "It ran off with a balloon giraffe. They seem happy.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-balloon-dog", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-balloon-dog.2.m4a?v=4a38a76d4e34"}, "versions": {"clown": "4a38a76d4e34"}}, {"id": "general-long-shoes.1", "text": "Ho le scarpe così lunghe", "en": "My shoes are so long", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-long-shoes", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-long-shoes.1.m4a?v=a1c73b41935c"}, "versions": {"clown": "a1c73b41935c"}}, {"id": "general-long-shoes.2", "text": "che arrivano nei posti un secondo prima di me.", "en": "I get to places a second before I do.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-long-shoes", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-long-shoes.2.m4a?v=ad066a4730e1"}, "versions": {"clown": "ad066a4730e1"}}, {"id": "general-unicycle", "text": "Ho preso il monociclo per risparmiare. Metà delle ruote.", "en": "I bought a unicycle to save money. Half the wheels.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-unicycle.m4a?v=ea3052a50e98"}, "versions": {"clown": "ea3052a50e98"}}, {"id": "general-mime-argument", "text": "Ho litigato con un mimo. Non ha replicato. Ha vinto lui.", "en": "I argued with a mime. He had no comeback. Still won.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-mime-argument.m4a?v=600abf33cc6f"}, "versions": {"clown": "600abf33cc6f"}}, {"id": "general-poster.1", "text": "Il direttore mi aveva promesso il nome in cartellone.", "en": "The ringmaster promised me top billing.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-poster", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-poster.1.m4a?v=fc15de9975fa"}, "versions": {"clown": "fc15de9975fa"}}, {"id": "general-poster.2", "text": "Ci sono. In basso a destra. Sotto l'elefante.", "en": "I'm on the poster. Bottom right. Under the elephant.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-poster", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-poster.2.m4a?v=4ce32ddc9b28"}, "versions": {"clown": "4ce32ddc9b28"}}, {"id": "general-lion-chair.1", "text": "Il domatore ha una frusta e una sedia. Io ho una sedia.", "en": "The lion tamer has a whip and a chair. I have a chair.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-lion-chair", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-lion-chair.1.m4a?v=f200444e85b7"}, "versions": {"clown": "f200444e85b7"}}, {"id": "general-lion-chair.2", "text": "Più che altro mi ci siedo.", "en": "Mostly I sit on it.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-lion-chair", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-lion-chair.2.m4a?v=8519da2dcc78"}, "versions": {"clown": "8519da2dcc78"}}, {"id": "general-strongman.1", "text": "Il forzuto solleva un pianoforte. Io sollevo il morale.", "en": "The strongman lifts a piano. I lift spirits.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-strongman", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-strongman.1.m4a?v=3fde8882a97f"}, "versions": {"clown": "3fde8882a97f"}}, {"id": "general-strongman.2", "text": "Il morale pesa di più.", "en": "Spirits are heavier.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-strongman", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-strongman.2.m4a?v=7c74abf8f281"}, "versions": {"clown": "7c74abf8f281"}}, {"id": "general-standing-ovation", "text": "Mi sono applaudito in piedi. Beh, in piedi ero già.", "en": "I gave myself a standing ovation. Well. I was standing.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-standing-ovation.m4a?v=1a880d1a04d6"}, "versions": {"clown": "1a880d1a04d6"}}, {"id": "general-makeup-hour.1", "text": "Ho passato un'ora a truccarmi.", "en": "I spent an hour on my makeup.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-makeup-hour", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-makeup-hour.1.m4a?v=ee38e958f42e"}, "versions": {"clown": "ee38e958f42e"}}, {"id": "general-makeup-hour.2", "text": "Sono triste uguale. Ma a colori.", "en": "Now I look exactly as sad, but in color.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-makeup-hour", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-makeup-hour.2.m4a?v=b63e55b82faf"}, "versions": {"clown": "b63e55b82faf"}}, {"id": "general-retire", "text": "I pagliacci non vanno in pensione. A un certo punto il trucco non serve più.", "en": "Clowns never retire. We just stop needing the makeup.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-retire.m4a?v=5a38fb6dee15"}, "versions": {"clown": "5a38fb6dee15"}}, {"id": "general-small-apartment.1", "text": "Adesso abito quassù.", "en": "I live up here now.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-small-apartment", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-small-apartment.1.m4a?v=2937a42b62e6"}, "versions": {"clown": "2937a42b62e6"}}, {"id": "general-small-apartment.2", "text": "Monolocale. Bella vista sull'orologio.", "en": "Small apartment. Great view of the clock.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-small-apartment", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-small-apartment.2.m4a?v=1f5c02240551"}, "versions": {"clown": "1f5c02240551"}}, {"id": "general-clock-neighbor", "text": "Il mio vicino è l'orologio. Non ride mai, ma che tempi comici.", "en": "My neighbor is the clock. Never laughs, but what timing.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-clock-neighbor.m4a?v=6788f15637f9"}, "versions": {"clown": "6788f15637f9"}}, {"id": "general-mother.1", "text": "Da piccolo facevo ridere tutta la classe.", "en": "My mother wanted me to have a serious job.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-mother", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-mother.1.m4a?v=3cf02288443a"}, "versions": {"clown": "3cf02288443a"}}, {"id": "general-mother.2", "text": "Adesso hanno tutti casa e figli. Io ho ancora il naso rosso.", "en": "I'm very serious about it. That's the problem.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-mother", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-mother.2.m4a?v=ddc00a528620"}, "versions": {"clown": "ddc00a528620"}}, {"id": "general-sad-trombone.1", "text": "Risparmio per comprarmi un trombone. Per i finali tristi.", "en": "I'm saving up for my own sad trombone.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-sad-trombone", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-sad-trombone.1.m4a?v=83208a07d220"}, "versions": {"clown": "83208a07d220"}}, {"id": "general-sad-trombone.2", "text": "A noleggio, con tutti quelli che faccio, mi rovino.", "en": "Renting one every time adds up.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-sad-trombone", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-sad-trombone.2.m4a?v=381186bde08a"}, "versions": {"clown": "381186bde08a"}}, {"id": "general-tent.1", "text": "Il circo è partito senza di me.", "en": "The circus left town without me.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-tent", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-tent.1.m4a?v=3d9c9dee5622"}, "versions": {"clown": "3d9c9dee5622"}}, {"id": "general-tent.2", "text": "Ero nel tendone. Si sono portati via il tendone.", "en": "I was in the tent. They took the tent.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-tent", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-tent.2.m4a?v=05c0fd256d35"}, "versions": {"clown": "05c0fd256d35"}}, {"id": "general-good-news.1", "text": "Bella notizia: finalmente ho fatto ridere qualcuno.", "en": "Good news: I finally made someone laugh.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-good-news", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-good-news.1.m4a?v=5ef58163e61d"}, "versions": {"clown": "5ef58163e61d"}}, {"id": "general-good-news.2", "text": "Brutta notizia: ero scivolato sulla mia scarpa.", "en": "Bad news: I'd slipped on my own shoe.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-good-news", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-good-news.2.m4a?v=3e26a8428289"}, "versions": {"clown": "3e26a8428289"}}, {"id": "general-cheer-up.1", "text": "Un pagliaccio non deve mai prendersi sul serio.", "en": "Everyone tells the clown to cheer up.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-cheer-up", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-cheer-up.1.m4a?v=c7a46b4f9f5b"}, "versions": {"clown": "c7a46b4f9f5b"}}, {"id": "general-cheer-up.2", "text": "Nessun pericolo. Non mi prende sul serio nessuno.", "en": "I'm at work. This is the cheered-up version.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-cheer-up", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-cheer-up.2.m4a?v=dfc802f15e94"}, "versions": {"clown": "dfc802f15e94"}}, {"id": "general-safety-net.1", "text": "La vita è un filo sospeso. Io sto nella rete.", "en": "Life is a tightrope. I'm in the safety net.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-safety-net", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-safety-net.1.m4a?v=4aa28fd19473"}, "versions": {"clown": "4aa28fd19473"}}, {"id": "general-safety-net.2", "text": "Ci sto da anni. Si sta comodi.", "en": "Been here for years. It's comfy.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-safety-net", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-safety-net.2.m4a?v=fd62984ca9b3"}, "versions": {"clown": "fd62984ca9b3"}}, {"id": "general-banana", "text": "Ogni buccia di banana che vedo, penso: sarà un'offerta di lavoro?", "en": "Every banana peel I see, I think: is this a job offer?", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-banana.m4a?v=33623fb37237"}, "versions": {"clown": "33623fb37237"}}, {"id": "general-elephant.1", "text": "L'elefante ha una memoria di ferro.", "en": "The elephant never forgets.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-elephant", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-elephant.1.m4a?v=0d618e4c7872"}, "versions": {"clown": "0d618e4c7872"}}, {"id": "general-elephant.2", "text": "Per questo ancora non mi rivolge la parola.", "en": "Which is why he still won't talk to me.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-elephant", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-elephant.2.m4a?v=f063aecda43c"}, "versions": {"clown": "f063aecda43c"}}, {"id": "general-acrobats.1", "text": "Gli acrobati volano. I pagliacci cadono.", "en": "Acrobats fly. Clowns fall.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-acrobats", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-acrobats.1.m4a?v=5a62bcf1645c"}, "versions": {"clown": "5a62bcf1645c"}}, {"id": "general-acrobats.2", "text": "Stesso volo. Critiche diverse.", "en": "Same trip. Different reviews.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-acrobats", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-acrobats.2.m4a?v=3a4085180887"}, "versions": {"clown": "3a4085180887"}}, {"id": "general-fortune-teller.1", "text": "La cartomante mi ha letto la mano.", "en": "The fortune teller read my palm.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fortune-teller", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fortune-teller.1.m4a?v=4313edcfdfe6"}, "versions": {"clown": "4313edcfdfe6"}}, {"id": "general-fortune-teller.2", "text": "Si è messa a ridere. Prima volta che mi riesce.", "en": "She laughed. First time that's worked.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fortune-teller", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fortune-teller.2.m4a?v=913e74ee2cff"}, "versions": {"clown": "913e74ee2cff"}}, {"id": "general-waterproof", "text": "Il mio agente dice che ho un grande futuro. Lo dice da trent'anni.", "en": "My smile is painted on. Low maintenance. Very waterproof.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-waterproof.m4a?v=02205466aa66"}, "versions": {"clown": "02205466aa66"}}, {"id": "general-confetti.1", "text": "Tengo i coriandoli in tasca per le belle notizie.", "en": "I keep confetti in my pocket for good news.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-confetti", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-confetti.1.m4a?v=ca438c42a209"}, "versions": {"clown": "ca438c42a209"}}, {"id": "general-confetti.2", "text": "Sono coriandoli molto vecchi.", "en": "It's very old confetti.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-confetti", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-confetti.2.m4a?v=1ae3f242cacd"}, "versions": {"clown": "1ae3f242cacd"}}, {"id": "general-double-knot", "text": "Pure i palloncini cercano di andarsene. Faccio il doppio nodo.", "en": "Even my balloons try to leave. I tie double knots.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-double-knot.m4a?v=5feef6b09f96"}, "versions": {"clown": "5feef6b09f96"}}, {"id": "general-one-man-show.1", "text": "Hanno recensito il mio spettacolo.", "en": "My one-man show got a review.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-one-man-show", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-one-man-show.1.m4a?v=a06bffdcf7ba"}, "versions": {"clown": "a06bffdcf7ba"}}, {"id": "general-one-man-show.2", "text": "Una riga sola. Il mio nome, scritto male.", "en": "“One man.” That was the review.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-one-man-show", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-one-man-show.2.m4a?v=79ec78c45606"}, "versions": {"clown": "79ec78c45606"}}, {"id": "general-encore.1", "text": "Faccio sempre il bis.", "en": "I always do an encore.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-encore", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-encore.1.m4a?v=fdf44da5ac9f"}, "versions": {"clown": "fdf44da5ac9f"}}, {"id": "general-encore.2", "text": "Non me lo chiede nessuno. È questo il coraggio.", "en": "Nobody asks. That's what makes it brave.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-encore", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-encore.2.m4a?v=996ee71dfddb"}, "versions": {"clown": "996ee71dfddb"}}, {"id": "general-rubber-chicken.1", "text": "Io e il mio pollo di gomma non ci parliamo più.", "en": "My rubber chicken and I don't talk anymore.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-rubber-chicken", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-rubber-chicken.1.m4a?v=a673e9caedfa"}, "versions": {"clown": "a673e9caedfa"}}, {"id": "general-rubber-chicken.2", "text": "Divergenze artistiche. Voleva fare l'anatra.", "en": "Creative differences. He wanted to be a duck.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-rubber-chicken", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-rubber-chicken.2.m4a?v=b62c11ecfc47"}, "versions": {"clown": "b62c11ecfc47"}}, {"id": "general-time-flies.1", "text": "Il tempo vola quando ci si diverte.", "en": "Time flies when you're having fun.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-time-flies", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-time-flies.1.m4a?v=9dde81d56cda"}, "versions": {"clown": "9dde81d56cda"}}, {"id": "general-time-flies.2", "text": "Infatti per me è stato un decennio lentissimo.", "en": "So it's been a slow decade for me.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-time-flies", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-time-flies.2.m4a?v=951440975f74"}, "versions": {"clown": "951440975f74"}}, {"id": "general-straight-face.1", "text": "Riesco a restare serio per ore.", "en": "I can keep a straight face for hours.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-straight-face", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-straight-face.1.m4a?v=1b0b44c5c41e"}, "versions": {"clown": "1b0b44c5c41e"}}, {"id": "general-straight-face.2", "text": "Dote professionale. Professione sbagliata.", "en": "Professional skill. Wrong profession.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-straight-face", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-straight-face.2.m4a?v=44749ad044af"}, "versions": {"clown": "44749ad044af"}}, {"id": "general-distraction.1", "text": "Sinceramente? Non sono così divertente.", "en": "Honestly? I'm not that funny.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-distraction", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-distraction.1.m4a?v=5aae435b3361"}, "versions": {"clown": "5aae435b3361"}}, {"id": "general-distraction.2", "text": "A questo servono le scarpe grandi. A distrarre.", "en": "That's what the big shoes are for. Distraction.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-distraction", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-distraction.2.m4a?v=d0e069ee5a34"}, "versions": {"clown": "d0e069ee5a34"}}, {"id": "general-pockets.1", "text": "Ho quaranta tasche. Trentanove fazzoletti.", "en": "I have forty pockets. Thirty-nine handkerchiefs.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pockets", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pockets.1.m4a?v=9c92e94656e8"}, "versions": {"clown": "9c92e94656e8"}}, {"id": "general-pockets.2", "text": "E una caramella, per farmi coraggio.", "en": "One sandwich, for courage.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pockets", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pockets.2.m4a?v=a153622248e3"}, "versions": {"clown": "a153622248e3"}}, {"id": "general-handkerchiefs.1", "text": "Ho tirato fuori fazzoletti dalla manica per un'ora.", "en": "I pulled handkerchiefs out of my sleeve for an hour.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-handkerchiefs", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-handkerchiefs.1.m4a?v=e5220c95b7a2"}, "versions": {"clown": "e5220c95b7a2"}}, {"id": "general-handkerchiefs.2", "text": "Poi uno l'ho usato.", "en": "Then I just used one.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-handkerchiefs", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-handkerchiefs.2.m4a?v=e21bb0dde441"}, "versions": {"clown": "e21bb0dde441"}}, {"id": "general-tough-room", "text": "Oggi la sala è fredda. E in sala ci sono solo io.", "en": "Tough room today. And I'm alone in it.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-tough-room.m4a?v=f1428bb4ddf0"}, "versions": {"clown": "f1428bb4ddf0"}}, {"id": "general-doctor.1", "text": "Un tizio dice al medico che nessuno lo fa ridere.", "en": "A man tells his doctor nobody makes him laugh.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-doctor", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-doctor.1.m4a?v=ca02af52836b"}, "versions": {"clown": "ca02af52836b"}}, {"id": "general-doctor.2", "text": "Il medico lo manda dal pagliaccio. Eccomi. Non passo con la mutua.", "en": "The doctor says, go see the clown. Well. Here I am.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-doctor", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-doctor.2.m4a?v=144eb63d2b8d"}, "versions": {"clown": "144eb63d2b8d"}}, {"id": "general-colmo-ridire.1", "text": "Qual è il colmo per un pagliaccio?", "en": "Qual è il colmo per un pagliaccio?", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-ridire", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-colmo-ridire.1.m4a?v=77b70d54e64d"}, "versions": {"clown": "77b70d54e64d"}}, {"id": "general-colmo-ridire.2", "text": "Avere sempre qualcosa da ridire.", "en": "Avere sempre qualcosa da ridire.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-ridire", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-colmo-ridire.2.m4a?v=8040e01e456f"}, "versions": {"clown": "8040e01e456f"}}, {"id": "general-colmo-salti.1", "text": "Il colmo per un acrobata?", "en": "Il colmo per un acrobata?", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-
