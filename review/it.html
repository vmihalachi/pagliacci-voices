<style>
  /* The default colors; an app sets its own in companion.json (`voice.reviewColors`), injected after this block. */
  :root {
    color-scheme: light dark;
    --paper: #FFF8E7; --card: #FFFDF7; --ink: #3D2B1F; --ink-soft: #7A6555; --line: #E8DCC4;
    --accent: #F2C94C; --accent-soft: #FCEFC4; --on-accent: #3D2B1F;
    --done: #6B8F4E; --done-soft: #E3EDD5; --flag: #C4623A; --flag-soft: #F6DED3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1F1B17; --card: #2A241D; --ink: #EFE6D8; --ink-soft: #B3A592; --line: #3E352B;
      --accent: #E2B93F; --accent-soft: #4A3D1C; --on-accent: #3D2B1F;
      --done: #9BC07A; --done-soft: #2E3A24; --flag: #E3825C; --flag-soft: #4A2C20;
    }
  }
  :root{--paper:#F6F1E9;--card:#FFF3E6;--ink:#1C1519;--ink-soft:#5E5257;--line:#DDD3C6;--accent:#B23A1F;--accent-soft:#F3D5CB;--on-accent:#FFFFFF;--done:#2D2A8A;--done-soft:#DCDAF3;--flag:#C98A12;--flag-soft:#F7E3B5;--link:#9C2F17;}@media (prefers-color-scheme: dark){:root{--paper:#1E1A20;--card:#241E27;--ink:#EFE8DD;--ink-soft:#A89EA4;--line:#3A333D;--accent:#F2B23A;--accent-soft:#3D2F17;--on-accent:#2E1608;--done:#A9A3FF;--done-soft:#2A2752;--flag:#E0644A;--flag-soft:#44201A;--link:#F2B23A;}}
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--line) var(--paper); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; accent-color: var(--accent); }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  svg { width: 1em; height: 1em; flex: none; }
  a { color: inherit; text-underline-offset: 3px; }
  [hidden] { display: none !important; }

  button, select { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
  select { padding-right: 8px; max-width: 100%; }
  button:hover, select:hover { border-color: var(--ink-soft); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; color: var(--on-accent); }
  button.primary:hover { border-color: var(--ink); }
  button.quiet { background: transparent; border-color: transparent; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; padding-inline: 4px; }
  button.quiet:hover { color: var(--ink); border-color: transparent; }
  button:disabled { opacity: .4; cursor: default; transform: none; border-color: var(--line); }

  /* The header: who and which language, then the player. Progress is the line along its bottom edge. */
  header { position: sticky; top: 0; z-index: 3; background: var(--paper); border-bottom: 1px solid var(--line); padding: 10px 16px 12px; padding-top: max(10px, env(safe-area-inset-top)); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 980px; margin: 0 auto; }
  .ident { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
  .ident img { width: 30px; height: 30px; border-radius: 7px; }
  h1 { font-size: 18px; line-height: 1.2; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  .player { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .count { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--done); border-radius: 0 3px 3px 0; transition: width .25s cubic-bezier(.2, .8, .2, 1); }

  main { max-width: 980px; margin: 0 auto; padding: 14px 16px calc(var(--footer-h, 120px) + 24px); }

  /* The first-visit guide, for friends. */
  .intro { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px 18px; margin: 0 0 16px; }
  .intro h2 { font-size: 16px; margin: 0 0 8px; }
  .intro ol { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 6px; max-width: 70ch; }
  .intro li::marker { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .intro b { font-weight: 600; }

  .row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; scroll-margin: 140px 0 calc(var(--footer-h, 120px) + 16px); transition: border-color .15s, box-shadow .15s; }
  .row.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row.flagged { border-color: var(--flag); }
  .row.flagged.current { box-shadow: 0 0 0 3px var(--flag-soft); }
  /* A joke's later parts sit under its first, indented, joined to it. */
  .row.part { margin: -6px 0 10px 34px; border-top-style: dashed; }
  .num { color: var(--ink-soft); font-variant-numeric: tabular-nums; padding-top: 3px; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; }
  .num:hover { color: var(--ink); text-decoration: underline; }
  .num svg { color: var(--done); }
  .line { font-size: 18px; font-weight: 600; margin: 0; line-height: 1.35; overflow-wrap: anywhere; text-wrap: pretty; }
  .gloss { color: var(--ink-soft); font-size: 13px; margin: 2px 0 0; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--ink-soft); align-items: center; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; line-height: 18px; }
  .chip.flavor-0 { background: var(--accent-soft); } .chip.flavor-1 { background: var(--flag-soft); }
  .chip.flavor-2 { background: var(--done-soft); } .chip.flavor-3 { background: var(--line); }
  .chip.new { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .chip.waiting { border-style: dashed; }
  .chip.failed { border-color: var(--flag); color: var(--flag); }
  .id { font: 11px ui-monospace, monospace; }

  .actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .actions button { font-size: 13px; padding: 3px 11px; min-height: 30px; white-space: nowrap; justify-content: center; }
  .pair { display: flex; gap: 6px; } .pair .play { flex: 1; justify-content: flex-start; }
  .actions .flag[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); }
  .actions .playing { background: var(--accent-soft); border-color: var(--accent); }
  .actions .noted { border-color: var(--ink-soft); }
  .react { display: flex; } .react button { flex: 1; }
  .react button:first-child { border-radius: 999px 0 0 999px; } .react button:last-child { border-radius: 0 999px 999px 0; margin-left: -1.5px; }
  .react button[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); position: relative; }
  .react button.down[aria-pressed="true"] { background: var(--line); border-color: var(--ink-soft); }
  /* While a clip plays, its button's icon becomes three moving bars. */
  .eq { display: none; gap: 2px; align-items: flex-end; height: 12px; width: 13px; }
  .eq i { width: 3px; background: currentColor; border-radius: 1px; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  .playing > .eq { display: inline-flex; } .playing > svg { display: none; }
  @keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }
  @media (prefers-reduced-motion: reduce) { .eq i { animation: none; height: 70%; } .progress > i, .row, .toggle svg { transition: none; } }
  .note { grid-column: 2 / 4; display: none; }
  .row.noting .note { display: block; }
  input[type="text"] { width: 100%; font: inherit; font-size: 14px; padding: 7px 11px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  input[type="text"]:focus { border-color: var(--ink-soft); outline: none; }
  input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: 1; }

  .empty, .end { text-align: center; color: var(--ink-soft); padding: 28px 16px; border: 1.5px dashed var(--line); border-radius: 14px; margin: 6px 0 10px; }
  .empty p, .end p { margin: 0 auto 10px; max-width: 46ch; }
  .end strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .end button, .empty button { margin: 0 auto; }

  /* The notes: a tray along the bottom that opens into a panel; on wide screens, a column on the right. */
  footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--card); border-top: 1.5px solid var(--line); padding: 8px 16px; padding-bottom: max(8px, env(safe-area-inset-bottom)); box-shadow: 0 -6px 18px -12px color-mix(in srgb, var(--ink) 45%, transparent); }
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; max-width: 980px; margin: 0 auto 8px; }
  .pager button { font-size: 13px; padding: 3px 10px; min-width: 34px; min-height: 30px; justify-content: center; font-variant-numeric: tabular-nums; }
  .pager button[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pager .gap { color: var(--ink-soft); padding: 0 2px; }
  .pager .range { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .tray { display: flex; gap: 10px; align-items: center; max-width: 980px; margin: 0 auto; }
  .tray .toggle { flex: 1; min-width: 0; justify-content: space-between; background: transparent; border-color: transparent; padding-inline: 4px; text-align: left; border-radius: 10px; }
  .tray .toggle:hover { border-color: transparent; }
  .tally { display: grid; line-height: 1.25; min-width: 0; }
  .tally b { font-weight: 600; } .tally span { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
  .toggle svg { transition: transform .2s; color: var(--ink-soft); }
  footer.open .toggle svg { transform: rotate(180deg); }
  .panel { display: none; max-width: 980px; margin: 10px auto 2px; gap: 10px; }
  footer.open .panel { display: grid; }
  .panel label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-soft); }
  .side { display: grid; gap: 8px; align-content: start; }
  textarea { width: 100%; height: 120px; resize: vertical; font: 12px/1.45 ui-monospace, monospace; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .status { font-size: 13px; color: var(--ink-soft); min-height: 1.4em; margin: 0; }
  .status button { font-size: 13px; min-height: 0; padding: 0 4px; }
  .notice { font-size: 11px; color: var(--ink-soft); margin: 0; }
  .keys { color: var(--ink-soft); font-size: 12px; line-height: 1.9; margin: 0; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--paper); color: var(--ink); }

  @media (min-width: 641px) and (max-width: 1099px) {
    .panel { grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); align-items: start; }
    .panel > .wide { grid-column: 1 / -1; }
  }
  /* Wide screens: the notes are a full-height column on the right, room for many flags. */
  @media (min-width: 1100px) {
    :root { --notes: clamp(320px, 28vw, 420px); }
    body { padding-right: var(--notes); }
    .bar, main { max-width: 1120px; }
    header { padding-inline: 24px; }
    main { padding: 18px 24px 80px; }
    .pager { position: fixed; left: 0; right: var(--notes); bottom: 0; max-width: none; margin: 0; padding: 10px 24px; background: var(--card); border-top: 1.5px solid var(--line); z-index: 3; }
    footer { left: auto; top: 0; width: var(--notes); border-top: 0; border-left: 1.5px solid var(--line); padding: 18px; box-shadow: none; overflow-y: auto; }
    .tray { display: none; }
    .panel, footer.open .panel { display: flex; flex-direction: column; min-height: 100%; margin: 0; }
    .panel h2 { font-size: 15px; margin: 0; }
    textarea { flex: 1; min-height: 160px; height: auto; resize: none; font-size: 12.5px; }
  }
  /* Below the notes column the tray carries the count, so the header doesn't repeat it. */
  @media (max-width: 1099px) { .panel h2, .count { display: none; } }
  @media (max-width: 640px) {
    header { padding-inline: 12px; }
    .player { flex: 1 1 100%; }
    .player select { flex: 1 1 0; min-width: 0; }
    .keys { display: none; }
    main { padding-inline: 12px; }
    .row { grid-template-columns: minmax(0, 1fr); padding: 12px; }
    .row.part { margin-left: 18px; }
    .num { display: none; }
    .actions { flex-direction: row; flex-wrap: wrap; }
    .voices { display: contents; }
    .note { grid-column: 1; }
    footer { padding-inline: 12px; }
    .pager { gap: 4px; } .pager .range, .pager .word { display: none; }
  }
</style>

<body>
<header>

  </div>
  <div class="panel" id="panel">
    <h2 class="wide" data-t>Your notes</h2>
    <label class="wide" id="name-field" hidden><span data-t>Your name, so we know who to thank</span><input type="text" id="name" autocomplete="name"></label>
    <textarea id="summary" readonly aria-label="Your notes"></textarea>
    <div class="side">
      <div class="buttons"><button id="share" class="primary" hidden></button><button id="copy"></button><button id="clear" class="quiet" data-t>Clear my notes</button></div>
      <p class="status" id="status" role="status"></p>
      <p class="keys" id="keys"></p>
    </div>
    <p class="notice wide" id="notice" hidden></p>
  </div>
</footer>
<script>
const DATA = {"lang": "it", "languageName": "Italian", "languageLabel": "Italiano", "voices": [{"kind": "clown", "name": "Livio", "label": "Pagliaccio"}], "rows": [{"id": "general-red-nose", "text": "Ho il naso rosso. E pure il conto in banca.", "en": "My nose is red. So is my bank account.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-red-nose.m4a?v=f18108261d83"}, "versions": {"clown": "f18108261d83"}}, {"id": "general-juggling.1", "text": "Ho provato a fare il giocoliere con i miei problemi.", "en": "I tried juggling my problems.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-juggling", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-juggling.1.m4a?v=2ca78c71d62b"}, "versions": {"clown": "2ca78c71d62b"}}, {"id": "general-juggling.2", "text": "Ora sono tutti per terra. E anch'io.", "en": "Now they're all on the floor. So am I.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-juggling", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-juggling.2.m4a?v=41dde1d1512f"}, "versions": {"clown": "41dde1d1512f"}}, {"id": "general-pie-flavor.1", "text": "Trent'anni di torte in faccia.", "en": "Thirty years of pies in the face.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pie-flavor", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pie-flavor.1.m4a?v=61931bbb1373"}, "versions": {"clown": "61931bbb1373"}}, {"id": "general-pie-flavor.2", "text": "Ancora non so che gusto avessero.", "en": "I still don't know what flavor they were.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pie-flavor", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pie-flavor.2.m4a?v=9324058d8142"}, "versions": {"clown": "9324058d8142"}}, {"id": "general-pie-diet", "text": "Sono a dieta: solo palloncini. Gonfiano, ma non ingrassano.", "en": "I'm on a strict diet. Only the pies that hit me.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-pie-diet.m4a?v=240333d229b3"}, "versions": {"clown": "240333d229b3"}}, {"id": "general-pie-hug", "text": "Una torta in faccia è solo un abbraccio con la crema.", "en": "A pie in the face is just a hug with filling.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-pie-hug.m4a?v=6a2887691ea4"}, "versions": {"clown": "6a2887691ea4"}}, {"id": "general-pratfall.1", "text": "Cado per mestiere.", "en": "I fall down for a living.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pratfall", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pratfall.1.m4a?v=a728c71d205a"}, "versions": {"clown": "a728c71d205a"}}, {"id": "general-pratfall.2", "text": "Rialzarmi è volontariato.", "en": "Getting up is unpaid.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pratfall", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pratfall.2.m4a?v=4c5ee1759746"}, "versions": {"clown": "4c5ee1759746"}}, {"id": "general-squirting-flower", "text": "Il mio fiore spruzzino è l'unica pianta che mi è sopravvissuta.", "en": "My squirting flower is the only plant I've kept alive.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-squirting-flower.m4a?v=63f61e9ebf81"}, "versions": {"clown": "63f61e9ebf81"}}, {"id": "general-tear.1", "text": "Mi chiedono se la lacrima sulla guancia è dipinta.", "en": "People ask if the tear on my cheek is painted.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-tear", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-tear.1.m4a?v=1c6b41684f3d"}, "versions": {"clown": "1c6b41684f3d"}}, {"id": "general-tear.2", "text": "Quasi sempre. Certi giorni risparmio sul colore.", "en": "Mostly. Some days I save on paint.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-tear", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-tear.2.m4a?v=260176b1290b"}, "versions": {"clown": "260176b1290b"}}, {"id": "general-balloon-dog.1", "text": "Ho fatto un cane coi palloncini.", "en": "I made a balloon dog.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-balloon-dog", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-balloon-dog.1.m4a?v=ef08fbcef241"}, "versions": {"clown": "ef08fbcef241"}}, {"id": "general-balloon-dog.2", "text": "È scappato con una giraffa di palloncini. Sembrano felici.", "en": "It ran off with a balloon giraffe. They seem happy.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-balloon-dog", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-balloon-dog.2.m4a?v=4a38a76d4e34"}, "versions": {"clown": "4a38a76d4e34"}}, {"id": "general-long-shoes.1", "text": "Ho le scarpe così lunghe", "en": "My shoes are so long", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-long-shoes", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-long-shoes.1.m4a?v=a1c73b41935c"}, "versions": {"clown": "a1c73b41935c"}}, {"id": "general-long-shoes.2", "text": "che arrivano nei posti un secondo prima di me.", "en": "I get to places a second before I do.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-long-shoes", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-long-shoes.2.m4a?v=ad066a4730e1"}, "versions": {"clown": "ad066a4730e1"}}, {"id": "general-unicycle", "text": "Ho preso il monociclo per risparmiare. Metà delle ruote.", "en": "I bought a unicycle to save money. Half the wheels.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-unicycle.m4a?v=ea3052a50e98"}, "versions": {"clown": "ea3052a50e98"}}, {"id": "general-mime-argument", "text": "Ho litigato con un mimo. Non ha replicato. Ha vinto lui.", "en": "I argued with a mime. He had no comeback. Still won.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-mime-argument.m4a?v=600abf33cc6f"}, "versions": {"clown": "600abf33cc6f"}}, {"id": "general-poster.1", "text": "Il direttore mi aveva promesso il nome in cartellone.", "en": "The ringmaster promised me top billing.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-poster", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-poster.1.m4a?v=fc15de9975fa"}, "versions": {"clown": "fc15de9975fa"}}, {"id": "general-poster.2", "text": "Ci sono. In basso a destra. Sotto l'elefante.", "en": "I'm on the poster. Bottom right. Under the elephant.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-poster", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-poster.2.m4a?v=4ce32ddc9b28"}, "versions": {"clown": "4ce32ddc9b28"}}, {"id": "general-lion-chair.1", "text": "Il domatore ha una frusta e una sedia. Io ho una sedia.", "en": "The lion tamer has a whip and a chair. I have a chair.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-lion-chair", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-lion-chair.1.m4a?v=f200444e85b7"}, "versions": {"clown": "f200444e85b7"}}, {"id": "general-lion-chair.2", "text": "Più che altro mi ci siedo.", "en": "Mostly I sit on it.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-lion-chair", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-lion-chair.2.m4a?v=8519da2dcc78"}, "versions": {"clown": "8519da2dcc78"}}, {"id": "general-strongman.1", "text": "Il forzuto solleva un pianoforte. Io sollevo il morale.", "en": "The strongman lifts a piano. I lift spirits.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-strongman", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-strongman.1.m4a?v=3fde8882a97f"}, "versions": {"clown": "3fde8882a97f"}}, {"id": "general-strongman.2", "text": "Il morale pesa di più.", "en": "Spirits are heavier.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-strongman", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-strongman.2.m4a?v=7c74abf8f281"}, "versions": {"clown": "7c74abf8f281"}}, {"id": "general-standing-ovation", "text": "Mi sono applaudito in piedi. Beh, in piedi ero già.", "en": "I gave myself a standing ovation. Well. I was standing.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-standing-ovation.m4a?v=1a880d1a04d6"}, "versions": {"clown": "1a880d1a04d6"}}, {"id": "general-makeup-hour.1", "text": "Ho passato un'ora a truccarmi.", "en": "I spent an hour on my makeup.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-makeup-hour", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-makeup-hour.1.m4a?v=ee38e958f42e"}, "versions": {"clown": "ee38e958f42e"}}, {"id": "general-makeup-hour.2", "text": "Sono triste uguale. Ma a colori.", "en": "Now I look exactly as sad, but in color.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-makeup-hour", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-makeup-hour.2.m4a?v=b63e55b82faf"}, "versions": {"clown": "b63e55b82faf"}}, {"id": "general-retire", "text": "I pagliacci non vanno in pensione. Cadono uguale, ma si rialzano più piano.", "en": "Clowns don't retire. We just take longer to get up.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-retire.m4a?v=dc048b705f86"}, "versions": {"clown": "dc048b705f86"}}, {"id": "general-small-apartment.1", "text": "Adesso abito in un angolino.", "en": "I live in the corner now.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-small-apartment", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-small-apartment.1.m4a?v=5281b0719d72"}, "versions": {"clown": "5281b0719d72"}}, {"id": "general-small-apartment.2", "text": "Monolocale. Bella vista sull'orologio.", "en": "Small apartment. Great view of the clock.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-small-apartment", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-small-apartment.2.m4a?v=1f5c02240551"}, "versions": {"clown": "1f5c02240551"}}, {"id": "general-clock-neighbor", "text": "Il mio vicino è l'orologio. Non ride mai, ma che tempi comici.", "en": "My neighbor is the clock. Never laughs, but what timing.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-clock-neighbor.m4a?v=6788f15637f9"}, "versions": {"clown": "6788f15637f9"}}, {"id": "general-mother.1", "text": "Da piccolo facevo ridere tutta la classe.", "en": "My mother wanted me to have a serious job.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-mother", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-mother.1.m4a?v=3cf02288443a"}, "versions": {"clown": "3cf02288443a"}}, {"id": "general-mother.2", "text": "Adesso hanno tutti casa e figli. Io ho ancora il naso rosso.", "en": "I'm very serious about it. That's the problem.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-mother", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-mother.2.m4a?v=ddc00a528620"}, "versions": {"clown": "ddc00a528620"}}, {"id": "general-sad-trombone.1", "text": "Risparmio per comprarmi un trombone. Per i finali tristi.", "en": "I'm saving up for my own sad trombone.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-sad-trombone", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-sad-trombone.1.m4a?v=83208a07d220"}, "versions": {"clown": "83208a07d220"}}, {"id": "general-sad-trombone.2", "text": "A noleggio, con tutti quelli che faccio, mi rovino.", "en": "Renting one every time adds up.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-sad-trombone", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-sad-trombone.2.m4a?v=381186bde08a"}, "versions": {"clown": "381186bde08a"}}, {"id": "general-tent.1", "text": "Il circo è partito senza di me.", "en": "The circus left town without me.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-tent", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-tent.1.m4a?v=3d9c9dee5622"}, "versions": {"clown": "3d9c9dee5622"}}, {"id": "general-tent.2", "text": "Ero nel tendone. Si sono portati via il tendone.", "en": "I was in the tent. They took the tent.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-tent", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-tent.2.m4a?v=05c0fd256d35"}, "versions": {"clown": "05c0fd256d35"}}, {"id": "general-good-news.1", "text": "Bella notizia: finalmente ho fatto ridere qualcuno.", "en": "Good news: I finally made someone laugh.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-good-news", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-good-news.1.m4a?v=5ef58163e61d"}, "versions": {"clown": "5ef58163e61d"}}, {"id": "general-good-news.2", "text": "Brutta notizia: ero scivolato sulla mia scarpa.", "en": "Bad news: I'd slipped on my own shoe.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-good-news", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-good-news.2.m4a?v=3e26a8428289"}, "versions": {"clown": "3e26a8428289"}}, {"id": "general-cheer-up.1", "text": "Un pagliaccio non deve mai prendersi sul serio.", "en": "Everyone tells the clown to cheer up.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-cheer-up", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-cheer-up.1.m4a?v=c7a46b4f9f5b"}, "versions": {"clown": "c7a46b4f9f5b"}}, {"id": "general-cheer-up.2", "text": "Nessun pericolo. Non mi prende sul serio nessuno.", "en": "I'm at work. This is the cheered-up version.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-cheer-up", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-cheer-up.2.m4a?v=dfc802f15e94"}, "versions": {"clown": "dfc802f15e94"}}, {"id": "general-safety-net.1", "text": "La vita è un filo sospeso. Io sto nella rete.", "en": "Life is a tightrope. I'm in the safety net.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-safety-net", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-safety-net.1.m4a?v=4aa28fd19473"}, "versions": {"clown": "4aa28fd19473"}}, {"id": "general-safety-net.2", "text": "Ci sto da anni. Si sta comodi.", "en": "Been here for years. It's comfy.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-safety-net", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-safety-net.2.m4a?v=fd62984ca9b3"}, "versions": {"clown": "fd62984ca9b3"}}, {"id": "general-banana", "text": "Ogni buccia di banana che vedo, penso: sarà un'offerta di lavoro?", "en": "Every banana peel I see, I think: is this a job offer?", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-banana.m4a?v=33623fb37237"}, "versions": {"clown": "33623fb37237"}}, {"id": "general-elephant.1", "text": "L'elefante ha una memoria di ferro.", "en": "The elephant never forgets.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-elephant", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-elephant.1.m4a?v=0d618e4c7872"}, "versions": {"clown": "0d618e4c7872"}}, {"id": "general-elephant.2", "text": "Per questo ancora non mi rivolge la parola.", "en": "Which is why he still won't talk to me.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-elephant", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-elephant.2.m4a?v=f063aecda43c"}, "versions": {"clown": "f063aecda43c"}}, {"id": "general-acrobats.1", "text": "Gli acrobati volano. I pagliacci cadono.", "en": "Acrobats fly. Clowns fall.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-acrobats", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-acrobats.1.m4a?v=5a62bcf1645c"}, "versions": {"clown": "5a62bcf1645c"}}, {"id": "general-acrobats.2", "text": "Stesso volo. Critiche diverse.", "en": "Same trip. Different reviews.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-acrobats", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-acrobats.2.m4a?v=3a4085180887"}, "versions": {"clown": "3a4085180887"}}, {"id": "general-fortune-teller.1", "text": "La cartomante mi ha letto la mano.", "en": "The fortune teller read my palm.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fortune-teller", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fortune-teller.1.m4a?v=4313edcfdfe6"}, "versions": {"clown": "4313edcfdfe6"}}, {"id": "general-fortune-teller.2", "text": "Si è messa a ridere. Prima volta che mi riesce.", "en": "She laughed. First time that's worked.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fortune-teller", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fortune-teller.2.m4a?v=913e74ee2cff"}, "versions": {"clown": "913e74ee2cff"}}, {"id": "general-waterproof", "text": "Il mio agente dice che ho un grande futuro. Lo dice da trent'anni.", "en": "My smile is painted on. Low maintenance. Very waterproof.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-waterproof.m4a?v=02205466aa66"}, "versions": {"clown": "02205466aa66"}}, {"id": "general-confetti.1", "text": "Tengo i coriandoli in tasca per le belle notizie.", "en": "I keep confetti in my pocket for good news.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-confetti", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-confetti.1.m4a?v=ca438c42a209"}, "versions": {"clown": "ca438c42a209"}}, {"id": "general-confetti.2", "text": "Sono coriandoli molto vecchi.", "en": "It's very old confetti.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-confetti", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-confetti.2.m4a?v=1ae3f242cacd"}, "versions": {"clown": "1ae3f242cacd"}}, {"id": "general-double-knot", "text": "Tutti i miei palloncini volano via. Lassù fanno festa senza di me.", "en": "My balloons all float away. Somewhere up there's a party without me.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-double-knot.m4a?v=685afed703cf"}, "versions": {"clown": "685afed703cf"}}, {"id": "general-one-man-show.1", "text": "Hanno recensito il mio spettacolo.", "en": "My one-man show got a review.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-one-man-show", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-one-man-show.1.m4a?v=a06bffdcf7ba"}, "versions": {"clown": "a06bffdcf7ba"}}, {"id": "general-one-man-show.2", "text": "Una riga sola. Il mio nome, scritto male.", "en": "“One man.” That was the review.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-one-man-show", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-one-man-show.2.m4a?v=79ec78c45606"}, "versions": {"clown": "79ec78c45606"}}, {"id": "general-encore.1", "text": "Faccio sempre il bis.", "en": "I always do an encore.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-encore", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-encore.1.m4a?v=fdf44da5ac9f"}, "versions": {"clown": "fdf44da5ac9f"}}, {"id": "general-encore.2", "text": "Non me lo chiede nessuno. È questo il coraggio.", "en": "Nobody asks. That's what makes it brave.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-encore", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-encore.2.m4a?v=996ee71dfddb"}, "versions": {"clown": "996ee71dfddb"}}, {"id": "general-rubber-chicken.1", "text": "Io e il mio pollo di gomma non ci parliamo più.", "en": "My rubber chicken and I don't talk anymore.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-rubber-chicken", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-rubber-chicken.1.m4a?v=a673e9caedfa"}, "versions": {"clown": "a673e9caedfa"}}, {"id": "general-rubber-chicken.2", "text": "Divergenze artistiche. Voleva fare l'anatra.", "en": "Creative differences. He wanted to be a duck.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-rubber-chicken", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-rubber-chicken.2.m4a?v=b62c11ecfc47"}, "versions": {"clown": "b62c11ecfc47"}}, {"id": "general-time-flies.1", "text": "Il tempo vola quando ci si diverte.", "en": "Time flies when you're having fun.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-time-flies", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-time-flies.1.m4a?v=9dde81d56cda"}, "versions": {"clown": "9dde81d56cda"}}, {"id": "general-time-flies.2", "text": "Infatti per me è stato un decennio lentissimo.", "en": "So it's been a slow decade for me.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-time-flies", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-time-flies.2.m4a?v=951440975f74"}, "versions": {"clown": "951440975f74"}}, {"id": "general-straight-face.1", "text": "Riesco a restare serio per ore.", "en": "I can keep a straight face for hours.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-straight-face", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-straight-face.1.m4a?v=1b0b44c5c41e"}, "versions": {"clown": "1b0b44c5c41e"}}, {"id": "general-straight-face.2", "text": "Dote professionale. Professione sbagliata.", "en": "Professional skill. Wrong profession.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-straight-face", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-straight-face.2.m4a?v=44749ad044af"}, "versions": {"clown": "44749ad044af"}}, {"id": "general-distraction.1", "text": "Sinceramente? Non sono così divertente.", "en": "Honestly? I'm not that funny.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-distraction", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-distraction.1.m4a?v=5aae435b3361"}, "versions": {"clown": "5aae435b3361"}}, {"id": "general-distraction.2", "text": "A questo servono le scarpe grandi. A distrarre.", "en": "That's what the big shoes are for. Distraction.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-distraction", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-distraction.2.m4a?v=d0e069ee5a34"}, "versions": {"clown": "d0e069ee5a34"}}, {"id": "general-pockets.1", "text": "Ho quaranta tasche. Trentanove fazzoletti.", "en": "I have forty pockets. Thirty-nine handkerchiefs.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pockets", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pockets.1.m4a?v=9c92e94656e8"}, "versions": {"clown": "9c92e94656e8"}}, {"id": "general-pockets.2", "text": "E una caramella, per farmi coraggio.", "en": "One sandwich, for courage.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-pockets", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pockets.2.m4a?v=a153622248e3"}, "versions": {"clown": "a153622248e3"}}, {"id": "general-handkerchiefs.1", "text": "Ho tirato fuori fazzoletti dalla manica per un'ora.", "en": "I pulled handkerchiefs out of my sleeve for an hour.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-handkerchiefs", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-handkerchiefs.1.m4a?v=e5220c95b7a2"}, "versions": {"clown": "e5220c95b7a2"}}, {"id": "general-handkerchiefs.2", "text": "Poi uno l'ho usato.", "en": "Then I just used one.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-handkerchiefs", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-handkerchiefs.2.m4a?v=e21bb0dde441"}, "versions": {"clown": "e21bb0dde441"}}, {"id": "general-tough-room", "text": "Oggi la sala è fredda. E in sala ci sono solo io.", "en": "Tough room today. And I'm alone in it.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-tough-room.m4a?v=f1428bb4ddf0"}, "versions": {"clown": "f1428bb4ddf0"}}, {"id": "general-doctor.1", "text": "Ho detto al medico che nessuno mi fa ridere.", "en": "I told my doctor nobody makes me laugh.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-doctor", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-doctor.1.m4a?v=c5d63f35cb27"}, "versions": {"clown": "c5d63f35cb27"}}, {"id": "general-doctor.2", "text": "Mi ha detto: vada dal pagliaccio. Ma se lo trucco io tutte le mattine!", "en": "He said, go see the clown. I said, I shave him every morning.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-doctor", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-doctor.2.m4a?v=b9d3c461c4d0"}, "versions": {"clown": "b9d3c461c4d0"}}, {"id": "general-colmo-ridire.1", "text": "Qual è il colmo per un pagliaccio?", "en": "Qual è il colmo per un pagliaccio?", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-ridire", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-colmo-ridire.1.m4a?v=77b70d54e64d"}, "versions": {"clown": "77b70d54e64d"}}, {"id": "general-colmo-ridire.2", "text": "Avere sempre qualcosa da ridire.", "en": "Avere sempre qualcosa da ridire.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-ridire", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-colmo-ridire.2.m4a?v=8040e01e456f"}, "versions": {"clown": "8040e01e456f"}}, {"id": "general-colmo-salti.1", "text": "Il colmo per un acrobata?", "en": "Il colmo per un acrobata?", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-salti", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-colmo-salti.1.m4a?v=b2de6b5aabf9"}, "versions": {"clown": "b2de6b5aabf9"}}, {"id": "general-colmo-salti.2", "text": "Fare i salti mortali per arrivare a fine mese.", "en": "Fare i salti mortali per arrivare a fine mese.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-colmo-salti", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-colmo-salti.2.m4a?v=92e764fc16dd"}, "versions": {"clown": "92e764fc16dd"}}, {"id": "general-ride-bene.1", "text": "Ride bene chi ride ultimo.", "en": "Ride bene chi ride ultimo.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-ride-bene", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-ride-bene.1.m4a?v=dc54d6fb2ecc"}, "versions": {"clown": "dc54d6fb2ecc"}}, {"id": "general-ride-bene.2", "text": "Io sono ancora in fila.", "en": "Io sono ancora in fila.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-ride-bene", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-ride-bene.2.m4a?v=6bf1127a2334"}, "versions": {"clown": "6bf1127a2334"}}, {"id": "general-ridere-piangere.1", "text": "Rido per non piangere.", "en": "Rido per non piangere.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-ridere-piangere", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-ridere-piangere.1.m4a?v=877dd5328321"}, "versions": {"clown": "877dd5328321"}}, {"id": "general-ridere-piangere.2", "text": "E piango per non perdere l'allenamento.", "en": "E piango per non perdere l'allenamento.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-ridere-piangere", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-ridere-piangere.2.m4a?v=ddd4f49cde08"}, "versions": {"clown": "ddd4f49cde08"}}, {"id": "general-riso-abbonda.1", "text": "Il riso abbonda sulla bocca degli stolti.", "en": "Il riso abbonda sulla bocca degli stolti.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-riso-abbonda", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-riso-abbonda.1.m4a?v=da5d06310a70"}, "versions": {"clown": "da5d06310a70"}}, {"id": "general-riso-abbonda.2", "text": "Per questo a pranzo mangio pasta.", "en": "Per questo a pranzo mangio pasta.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-riso-abbonda", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-riso-abbonda.2.m4a?v=6be4926f7f4f"}, "versions": {"clown": "6be4926f7f4f"}}, {"id": "general-in-giro.1", "text": "Mi prendono tutti in giro.", "en": "Mi prendono tutti in giro.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-in-giro", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-in-giro.1.m4a?v=a8cb167f1368"}, "versions": {"clown": "a8cb167f1368"}}, {"id": "general-in-giro.2", "text": "Per forza, lavoro in una pista rotonda.", "en": "Per forza, lavoro in una pista rotonda.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-in-giro", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-in-giro.2.m4a?v=654f78a30927"}, "versions": {"clown": "654f78a30927"}}, {"id": "general-naso-affari.1", "text": "Non metto mai il naso negli affari degli altri.", "en": "Non metto mai il naso negli affari degli altri.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-naso-affari", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-naso-affari.1.m4a?v=b08b38ea10a4"}, "versions": {"clown": "b08b38ea10a4"}}, {"id": "general-naso-affari.2", "text": "Non ci entra.", "en": "Non ci entra.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-naso-affari", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-naso-affari.2.m4a?v=29d5e2a93df8"}, "versions": {"clown": "29d5e2a93df8"}}, {"id": "general-buon-viso.1", "text": "Fare buon viso a cattivo gioco?", "en": "Fare buon viso a cattivo gioco?", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-buon-viso", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-buon-viso.1.m4a?v=d4275130aaec"}, "versions": {"clown": "d4275130aaec"}}, {"id": "general-buon-viso.2", "text": "Quaranta minuti e due chili di cerone.", "en": "Quaranta minuti e due chili di cerone.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-buon-viso", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-buon-viso.2.m4a?v=a4c395534ae0"}, "versions": {"clown": "a4c395534ae0"}}, {"id": "general-trucco.1", "text": "Il trucco c'è ma non si vede.", "en": "Il trucco c'è ma non si vede.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-trucco", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-trucco.1.m4a?v=c88d55070d3e"}, "versions": {"clown": "c88d55070d3e"}}, {"id": "general-trucco.2", "text": "Il mio si vede da tre chilometri.", "en": "Il mio si vede da tre chilometri.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-trucco", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-trucco.2.m4a?v=1f931de826d7"}, "versions": {"clown": "1f931de826d7"}}, {"id": "general-esaurito.1", "text": "Il mio sogno è un tutto esaurito.", "en": "Il mio sogno è un tutto esaurito.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-esaurito", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-esaurito.1.m4a?v=80899bb52b2e"}, "versions": {"clown": "80899bb52b2e"}}, {"id": "general-esaurito.2", "text": "Per ora l'unico esaurito sono io.", "en": "Per ora l'unico esaurito sono io.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-esaurito", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-esaurito.2.m4a?v=dc7d415f281e"}, "versions": {"clown": "dc7d415f281e"}}, {"id": "general-compleanni.1", "text": "Mi chiamano per le feste di compleanno.", "en": "Mi chiamano per le feste di compleanno.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-compleanni", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-compleanni.1.m4a?v=8692056acf0d"}, "versions": {"clown": "8692056acf0d"}}, {"id": "general-compleanni.2", "text": "Quelle degli altri.", "en": "Quelle degli altri.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-compleanni", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-compleanni.2.m4a?v=8ffd3a2960bd"}, "versions": {"clown": "8ffd3a2960bd"}}, {"id": "general-commercialista.1", "text": "Faccio ridere tutti.", "en": "Faccio ridere tutti.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-commercialista", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-commercialista.1.m4a?v=b121906b4f8f"}, "versions": {"clown": "b121906b4f8f"}}, {"id": "general-commercialista.2", "text": "Tutti tranne il commercialista.", "en": "Tutti tranne il commercialista.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-commercialista", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-commercialista.2.m4a?v=f61fa55e9376"}, "versions": {"clown": "f61fa55e9376"}}, {"id": "general-scarpe-speranza.1", "text": "Porto il cinquantotto di scarpe.", "en": "Porto il cinquantotto di scarpe.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-scarpe-speranza", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-scarpe-speranza.1.m4a?v=08cfb7ab91b3"}, "versions": {"clown": "08cfb7ab91b3"}}, {"id": "general-scarpe-speranza.2", "text": "Il piede è un quarantuno. Il resto è speranza.", "en": "Il piede è un quarantuno. Il resto è speranza.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-scarpe-speranza", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-scarpe-speranza.2.m4a?v=5a16db943cd4"}, "versions": {"clown": "5a16db943cd4"}}, {"id": "general-anche-a-casa.1", "text": "Faccio il pagliaccio da trent'anni.", "en": "Faccio il pagliaccio da trent'anni.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-anche-a-casa", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-anche-a-casa.1.m4a?v=8f4a9f87790d"}, "versions": {"clown": "8f4a9f87790d"}}, {"id": "general-anche-a-casa.2", "text": "Ormai mi viene naturale. Anche a casa, purtroppo.", "en": "Ormai mi viene naturale. Anche a casa, purtroppo.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-anche-a-casa", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-anche-a-casa.2.m4a?v=161d0aeaf097"}, "versions": {"clown": "161d0aeaf097"}}, {"id": "general-pesce-pagliaccio.1", "text": "Ho un acquario con un pesce pagliaccio.", "en": "Ho un acquario con un pesce pagliaccio.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pesce-pagliaccio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pesce-pagliaccio.1.m4a?v=16e288eec788"}, "versions": {"clown": "16e288eec788"}}, {"id": "general-pesce-pagliaccio.2", "text": "Ci guardiamo. Nessuno dei due ride.", "en": "Ci guardiamo. Nessuno dei due ride.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pesce-pagliaccio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pesce-pagliaccio.2.m4a?v=a7ab6312dfaf"}, "versions": {"clown": "a7ab6312dfaf"}}, {"id": "general-non-e-piu.1", "text": "Il circo non è più quello di una volta.", "en": "Il circo non è più quello di una volta.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-non-e-piu", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-non-e-piu.1.m4a?v=859f76d4b3b2"}, "versions": {"clown": "859f76d4b3b2"}}, {"id": "general-non-e-piu.2", "text": "Nemmeno io. Una volta ero triste solo il lunedì.", "en": "Nemmeno io. Una volta ero triste solo il lunedì.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-non-e-piu", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-non-e-piu.2.m4a?v=286b0df85fb8"}, "versions": {"clown": "286b0df85fb8"}}, {"id": "general-aumento.1", "text": "Ho chiesto un aumento al direttore del circo.", "en": "Ho chiesto un aumento al direttore del circo.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-aumento", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-aumento.1.m4a?v=fdf91a6736e9"}, "versions": {"clown": "fdf91a6736e9"}}, {"id": "general-aumento.2", "text": "Mi ha alzato il trapezio.", "en": "Mi ha alzato il trapezio.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-aumento", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-aumento.2.m4a?v=3c4806c8420b"}, "versions": {"clown": "3c4806c8420b"}}, {"id": "general-carnevale.1", "text": "A Carnevale ogni scherzo vale.", "en": "A Carnevale ogni scherzo vale.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-carnevale", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-carnevale.1.m4a?v=c622bb2be6ea"}, "versions": {"clown": "c622bb2be6ea"}}, {"id": "general-carnevale.2", "text": "Il resto dell'anno vale la metà.", "en": "Il resto dell'anno vale la metà.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-carnevale", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-carnevale.2.m4a?v=5dfb0116090d"}, "versions": {"clown": "5dfb0116090d"}}, {"id": "general-torta-medico.1", "text": "Una torta in faccia al giorno toglie il medico di torno.", "en": "Una torta in faccia al giorno toglie il medico di torno.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-torta-medico", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-torta-medico.1.m4a?v=1dd18b703a70"}, "versions": {"clown": "1dd18b703a70"}}, {"id": "general-torta-medico.2", "text": "E pure gli amici.", "en": "E pure gli amici.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-torta-medico", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-torta-medico.2.m4a?v=2ab84a804d77"}, "versions": {"clown": "2ab84a804d77"}}, {"id": "general-va-piano.1", "text": "Chi va piano va sano e va lontano.", "en": "Chi va piano va sano e va lontano.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-va-piano", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-va-piano.1.m4a?v=d47a1b664728"}, "versions": {"clown": "d47a1b664728"}}, {"id": "general-va-piano.2", "text": "Con queste scarpe, arrivo domani.", "en": "Con queste scarpe, arrivo domani.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-va-piano", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-va-piano.2.m4a?v=574c080cb256"}, "versions": {"clown": "574c080cb256"}}, {"id": "general-coerente.1", "text": "Faccio sempre la figura del pagliaccio.", "en": "Faccio sempre la figura del pagliaccio.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-coerente", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-coerente.1.m4a?v=d0cb06a909df"}, "versions": {"clown": "d0cb06a909df"}}, {"id": "general-coerente.2", "text": "Almeno sono coerente.", "en": "Almeno sono coerente.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-coerente", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-coerente.2.m4a?v=cc2baeb8ffb6"}, "versions": {"clown": "cc2baeb8ffb6"}}, {"id": "general-fare-il-pagliaccio.1", "text": "Mamma diceva sempre: smettila di fare il pagliaccio.", "en": "Mamma diceva sempre: smettila di fare il pagliaccio.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fare-il-pagliaccio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fare-il-pagliaccio.1.m4a?v=834b11cfe1c5"}, "versions": {"clown": "834b11cfe1c5"}}, {"id": "general-fare-il-pagliaccio.2", "text": "Non ho smesso. Adesso mi pagano. Poco.", "en": "Non ho smesso. Adesso mi pagano. Poco.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-fare-il-pagliaccio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fare-il-pagliaccio.2.m4a?v=67c13aceb2ed"}, "versions": {"clown": "67c13aceb2ed"}}, {"id": "general-riconoscimento.1", "text": "Mi hanno dato del pagliaccio.", "en": "Mi hanno dato del pagliaccio.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-riconoscimento", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-riconoscimento.1.m4a?v=203d73379645"}, "versions": {"clown": "203d73379645"}}, {"id": "general-riconoscimento.2", "text": "Finalmente un riconoscimento.", "en": "Finalmente un riconoscimento.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-riconoscimento", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-riconoscimento.2.m4a?v=1368d0c85901"}, "versions": {"clown": "1368d0c85901"}}, {"id": "general-bar-serio.1", "text": "Un pagliaccio entra in un bar. «Il solito?»", "en": "Un pagliaccio entra in un bar. «Il solito?»", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-bar-serio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-bar-serio.1.m4a?v=69c2e6e80655"}, "versions": {"clown": "69c2e6e80655"}}, {"id": "general-bar-serio.2", "text": "«No, oggi qualcosa di serio.» Gli portano una camomilla.", "en": "«No, oggi qualcosa di serio.» Gli portano una camomilla.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-bar-serio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-bar-serio.2.m4a?v=fec53e89c41f"}, "versions": {"clown": "fec53e89c41f"}}, {"id": "general-nascondino.1", "text": "Sai perché i pagliacci non giocano a nascondino?", "en": "Sai perché i pagliacci non giocano a nascondino?", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-nascondino", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-nascondino.1.m4a?v=6a7fb42826fb"}, "versions": {"clown": "6a7fb42826fb"}}, {"id": "general-nascondino.2", "text": "Il naso li tradisce sempre.", "en": "Il naso li tradisce sempre.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-nascondino", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-nascondino.2.m4a?v=7d627b450154"}, "versions": {"clown": "7d627b450154"}}, {"id": "general-fratello-mimo.1", "text": "Ho un fratello mimo.", "en": "Ho un fratello mimo.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-fratello-mimo", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fratello-mimo.1.m4a?v=456b84bf2fce"}, "versions": {"clown": "456b84bf2fce"}}, {"id": "general-fratello-mimo.2", "text": "Non ci parliamo da anni. Lui, almeno.", "en": "Non ci parliamo da anni. Lui, almeno.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-fratello-mimo", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-fratello-mimo.2.m4a?v=7938946039d6"}, "versions": {"clown": "7938946039d6"}}, {"id": "general-clacson-ugo.1", "text": "Il mio clacson si chiama Ugo.", "en": "Il mio clacson si chiama Ugo.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-clacson-ugo", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-clacson-ugo.1.m4a?v=b0f6f40f320b"}, "versions": {"clown": "b0f6f40f320b"}}, {"id": "general-clacson-ugo.2", "text": "È l'unico che mi risponde.", "en": "È l'unico che mi risponde.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-clacson-ugo", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-clacson-ugo.2.m4a?v=3bb4ed9adda8"}, "versions": {"clown": "3bb4ed9adda8"}}, {"id": "general-pompiere.1", "text": "Da piccolo volevo fare il pompiere.", "en": "As a kid I wanted to be a firefighter.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pompiere", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pompiere.1.m4a?v=4bee7432ae64"}, "versions": {"clown": "4bee7432ae64"}}, {"id": "general-pompiere.2", "text": "Adesso spruzzo acqua dal fiore all'occhiello. Ci sono quasi.", "en": "Now I squirt water from my buttonhole. Nearly there.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pompiere", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-pompiere.2.m4a?v=aa0c76d0f752"}, "versions": {"clown": "aa0c76d0f752"}}, {"id": "general-sorridi.1", "text": "Tutti mi dicono: sorridi!", "en": "Tutti mi dicono: sorridi!", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-sorridi", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-sorridi.1.m4a?v=39d6b58f709c"}, "versions": {"clown": "39d6b58f709c"}}, {"id": "general-sorridi.2", "text": "Lo faccio. È disegnato. Più di così…", "en": "Lo faccio. È disegnato. Più di così…", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-sorridi", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-sorridi.2.m4a?v=4b8cb204e9c6"}, "versions": {"clown": "4b8cb204e9c6"}}, {"id": "general-posto-sbagliato.1", "text": "Il pubblico ride sempre nel momento sbagliato.", "en": "The audience always laughs at the wrong moment.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-posto-sbagliato", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-posto-sbagliato.1.m4a?v=5d623e809def"}, "versions": {"clown": "5d623e809def"}}, {"id": "general-posto-sbagliato.2", "text": "Quando entro.", "en": "When I walk on.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-posto-sbagliato", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-posto-sbagliato.2.m4a?v=62d64d0da46b"}, "versions": {"clown": "62d64d0da46b"}}, {"id": "general-trucco-cola", "text": "Non sono triste. Mi cola il trucco, è diverso.", "en": "Non sono triste. Mi cola il trucco, è diverso.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-trucco-cola.m4a?v=000e6a471d6e"}, "versions": {"clown": "000e6a471d6e"}}, {"id": "general-faccia-cerone", "text": "Faccia di bronzo, io? No, di cerone.", "en": "Faccia di bronzo, io? No, di cerone.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/general-faccia-cerone.m4a?v=4a795b9e6d5c"}, "versions": {"clown": "4a795b9e6d5c"}}, {"id": "general-palestra.1", "text": "Mi sono iscritto in palestra.", "en": "I joined a gym.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-palestra", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-palestra.1.m4a?v=ae4cd2c16c73"}, "versions": {"clown": "ae4cd2c16c73"}}, {"id": "general-palestra.2", "text": "Faccio solo cadute. Sono il più bravo.", "en": "I only do the falls. I'm the best there.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "general-palestra", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/general-palestra.2.m4a?v=fd07f3205772"}, "versions": {"clown": "fd07f3205772"}}, {"id": "morning-understanding", "text": "Io e la mattina abbiamo un accordo: non ci rivolgiamo la parola.", "en": "Mornings and I have an understanding. We don't talk.", "flavor": "dry", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-understanding.m4a?v=47813e75d4f2"}, "versions": {"clown": "47813e75d4f2"}}, {"id": "morning-makeup", "text": "Mattina. Mezz'ora di trucco per avere quest'aria sorpresa.", "en": "Morning. Forty minutes of makeup to look this surprised.", "flavor": "absurd", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-makeup.m4a?v=08329d1719c6"}, "versions": {"clown": "08329d1719c6"}}, {"id": "morning-coffee-first", "text": "Prima il caffè, poi il trucco. Al contrario è stato un disastro.", "en": "Coffee, then makeup. The other way round was a disaster.", "flavor": "silly", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-coffee-first.m4a?v=a24977e3d53c"}, "versions": {"clown": "a24977e3d53c"}}, {"id": "morning-sun-show-off", "text": "Il sole si è alzato struccato. Che sfacciato.", "en": "The sun came up without any makeup. Show-off.", "flavor": "dry", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-sun-show-off.m4a?v=b277324bdbbe"}, "versions": {"clown": "b277324bdbbe"}}, {"id": "morning-horn-alarm.1", "text": "La mia sveglia è una trombetta da bicicletta.", "en": "My alarm clock is a bicycle horn.", "flavor": "absurd", "slot": "morning", "tags": "", "joke": "morning-horn-alarm", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-horn-alarm.1.m4a?v=ce5c9384a953"}, "versions": {"clown": "ce5c9384a953"}}, {"id": "morning-horn-alarm.2", "text": "Ogni mattina salto giù dal letto e mi inchino.", "en": "Every morning I jump out of bed and bow.", "flavor": "absurd", "slot": "morning", "tags": "", "joke": "morning-horn-alarm", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-horn-alarm.2.m4a?v=e814ab17855f"}, "versions": {"clown": "e814ab17855f"}}, {"id": "morning-early-clown.1", "text": "Chi tardi arriva, male alloggia.", "en": "The early bird catches the worm.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-early-clown", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-early-clown.1.m4a?v=aea3137396a9"}, "versions": {"clown": "aea3137396a9"}}, {"id": "morning-early-clown.2", "text": "Io arrivo sempre presto. Così alloggio male più a lungo.", "en": "The early clown catches an empty tent.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-early-clown", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-early-clown.2.m4a?v=199a02eb8674"}, "versions": {"clown": "199a02eb8674"}}, {"id": "morning-not-a-morning-clown", "text": "Non sono un pagliaccio mattiniero. A malapena sono pomeridiano.", "en": "I'm not a morning clown. I'm barely an afternoon clown.", "flavor": "dry", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/morning-not-a-morning-clown.m4a?v=75eb0d025557"}, "versions": {"clown": "75eb0d025557"}}, {"id": "morning-buongiorno.1", "text": "Il buongiorno si vede dal mattino.", "en": "Il buongiorno si vede dal mattino.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-buongiorno", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-buongiorno.1.m4a?v=1bb55909749b"}, "versions": {"clown": "1bb55909749b"}}, {"id": "morning-buongiorno.2", "text": "Infatti stamattina mi sono visto allo specchio. Pazienza.", "en": "Infatti stamattina mi sono visto allo specchio. Pazienza.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-buongiorno", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-buongiorno.2.m4a?v=25fd659cc9e9"}, "versions": {"clown": "25fd659cc9e9"}}, {"id": "morning-oro-in-bocca.1", "text": "Il mattino ha l'oro in bocca.", "en": "Il mattino ha l'oro in bocca.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-oro-in-bocca", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-oro-in-bocca.1.m4a?v=074729d07b81"}, "versions": {"clown": "074729d07b81"}}, {"id": "morning-oro-in-bocca.2", "text": "Io ho il cerone, che vale un po' meno.", "en": "Io ho il cerone, che vale un po' meno.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-oro-in-bocca", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-oro-in-bocca.2.m4a?v=7c59c23027ae"}, "versions": {"clown": "7c59c23027ae"}}, {"id": "morning-zucchero.1", "text": "Caffè senza zucchero, come la mia vita.", "en": "Caffè senza zucchero, come la mia vita.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-zucchero", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-zucchero.1.m4a?v=c40cf82f150b"}, "versions": {"clown": "c40cf82f150b"}}, {"id": "morning-zucchero.2", "text": "No, scherzo. Due cucchiaini. La vita no.", "en": "No, scherzo. Due cucchiaini. La vita no.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-zucchero", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-zucchero.2.m4a?v=5d9101869012"}, "versions": {"clown": "5d9101869012"}}, {"id": "morning-prima-risata.1", "text": "Sveglia alle sette, trucco alle otto.", "en": "Sveglia alle sette, trucco alle otto.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-prima-risata", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-prima-risata.1.m4a?v=c3375238f3fe"}, "versions": {"clown": "c3375238f3fe"}}, {"id": "morning-prima-risata.2", "text": "Prima risata prevista per il 2031.", "en": "Prima risata prevista per il 2031.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-prima-risata", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-prima-risata.2.m4a?v=54b3f6de4338"}, "versions": {"clown": "54b3f6de4338"}}, {"id": "morning-stile.1", "text": "Buongiorno! Ho già sbagliato il trucco tre volte.", "en": "Buongiorno! Ho già sbagliato il trucco tre volte.", "flavor": "silly", "slot": "morning", "tags": "", "joke": "morning-stile", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-stile.1.m4a?v=4705df1081c6"}, "versions": {"clown": "4705df1081c6"}}, {"id": "morning-stile.2", "text": "La quarta la chiamo stile.", "en": "La quarta la chiamo stile.", "flavor": "silly", "slot": "morning", "tags": "", "joke": "morning-stile", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-stile.2.m4a?v=92d8fa156a6c"}, "versions": {"clown": "92d8fa156a6c"}}, {"id": "morning-ridi-pagliaccio.1", "text": "«Ridi, Pagliaccio», dice l'opera.", "en": "«Ridi, Pagliaccio», dice l'opera.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-ridi-pagliaccio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-ridi-pagliaccio.1.m4a?v=994bc33c56be"}, "versions": {"clown": "994bc33c56be"}}, {"id": "morning-ridi-pagliaccio.2", "text": "Facile, alle nove di mattina.", "en": "Facile, alle nove di mattina.", "flavor": "bittersweet", "slot": "morning", "tags": "", "joke": "morning-ridi-pagliaccio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/morning-ridi-pagliaccio.2.m4a?v=3f08cacdeaa8"}, "versions": {"clown": "3f08cacdeaa8"}}, {"id": "afternoon-shoes", "text": "Il pomeriggio è lungo. Le mie scarpe, di più.", "en": "The afternoon is long. My shoes are longer.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/afternoon-shoes.m4a?v=5a11dcd2abba"}, "versions": {"clown": "5a11dcd2abba"}}, {"id": "afternoon-matinee", "text": "Spettacolo pomeridiano: biglietto ridotto. Anche le risate.", "en": "Matinee time. Half-price tickets, half-price laughs.", "flavor": "dry", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/afternoon-matinee.m4a?v=2fc0703f9c23"}, "versions": {"clown": "2fc0703f9c23"}}, {"id": "afternoon-lunch-pie", "text": "Dopo pranzo ho lasciato il naso al sole. Adesso è maturo.", "en": "Lunch was a pie. I'm still finding it in my ears.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/afternoon-lunch-pie.m4a?v=3e609a8b0b1a"}, "versions": {"clown": "3e609a8b0b1a"}}, {"id": "afternoon-nap-horn.1", "text": "Ho provato a fare un pisolino.", "en": "I tried an afternoon nap.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "afternoon-nap-horn", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-nap-horn.1.m4a?v=ecbd73f39180"}, "versions": {"clown": "ecbd73f39180"}}, {"id": "afternoon-nap-horn.2", "text": "Mi sono girato sopra la trombetta. Si è svegliato tutto il circo.", "en": "Rolled over on my horn. Woke the whole circus.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "afternoon-nap-horn", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-nap-horn.2.m4a?v=6a90106db23b"}, "versions": {"clown": "6a90106db23b"}}, {"id": "afternoon-shadow.1", "text": "Nel pomeriggio la mia ombra si allunga.", "en": "My shadow's getting longer.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-shadow", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-shadow.1.m4a?v=8a82628ee544"}, "versions": {"clown": "8a82628ee544"}}, {"id": "afternoon-shadow.2", "text": "Ormai porta il mio numero di scarpe.", "en": "It's started wearing my shoes.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-shadow", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-shadow.2.m4a?v=1b1588a53444"}, "versions": {"clown": "1b1588a53444"}}, {"id": "afternoon-siesta.1", "text": "Siesta nella mia macchinina da circo.", "en": "Siesta time. I'll lie down in my tiny car.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-siesta", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-siesta.1.m4a?v=bf250b493991"}, "versions": {"clown": "bf250b493991"}}, {"id": "afternoon-siesta.2", "text": "C'è posto per dodici pagliacci. Mi allargo.", "en": "All twelve of me.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-siesta", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-siesta.2.m4a?v=95a51779db2f"}, "versions": {"clown": "95a51779db2f"}}, {"id": "afternoon-cannon.1", "text": "Il sole è nel punto più alto.", "en": "The sun is at its highest.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-cannon", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-cannon.1.m4a?v=18451ed456d6"}, "versions": {"clown": "18451ed456d6"}}, {"id": "afternoon-cannon.2", "text": "Io, sparato dal cannone, al massimo arrivo al primo piano.", "en": "Higher than any clown ever fired from a cannon.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-cannon", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-cannon.2.m4a?v=45fa195827a0"}, "versions": {"clown": "45fa195827a0"}}, {"id": "afternoon-pranzo-torta.1", "text": "Pausa pranzo: una torta. Stavolta in bocca.", "en": "Pausa pranzo: una torta. Stavolta in bocca.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "afternoon-pranzo-torta", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-pranzo-torta.1.m4a?v=ca8b501d425e"}, "versions": {"clown": "ca8b501d425e"}}, {"id": "afternoon-pranzo-torta.2", "text": "Che lusso.", "en": "Che lusso.", "flavor": "silly", "slot": "afternoon", "tags": "", "joke": "afternoon-pranzo-torta", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-pranzo-torta.2.m4a?v=9cedaf502193"}, "versions": {"clown": "9cedaf502193"}}, {"id": "afternoon-naso-in-tasca.1", "text": "Le tre del pomeriggio, l'ora più seria del giorno.", "en": "Le tre del pomeriggio, l'ora più seria del giorno.", "flavor": "dry", "slot": "afternoon", "tags": "", "joke": "afternoon-naso-in-tasca", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-naso-in-tasca.1.m4a?v=b94241115030"}, "versions": {"clown": "b94241115030"}}, {"id": "afternoon-naso-in-tasca.2", "text": "Persino io tengo il naso in tasca.", "en": "Persino io tengo il naso in tasca.", "flavor": "dry", "slot": "afternoon", "tags": "", "joke": "afternoon-naso-in-tasca", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-naso-in-tasca.2.m4a?v=2e08a45eb57f"}, "versions": {"clown": "2e08a45eb57f"}}, {"id": "afternoon-equilibrio.1", "text": "Pomeriggio: il sole è alto, il morale è basso.", "en": "Pomeriggio: il sole è alto, il morale è basso.", "flavor": "bittersweet", "slot": "afternoon", "tags": "", "joke": "afternoon-equilibrio", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-equilibrio.1.m4a?v=20a5fb216d74"}, "versions": {"clown": "20a5fb216d74"}}, {"id": "afternoon-equilibrio.2", "text": "Le scarpe, sempre lunghe. Equilibrio.", "en": "Le scarpe, sempre lunghe. Equilibrio.", "flavor": "bittersweet", "slot": "afternoon", "tags": "", "joke": "afternoon-equilibrio", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-equilibrio.2.m4a?v=aa5c1c4bd7c5"}, "versions": {"clown": "aa5c1c4bd7c5"}}, {"id": "afternoon-merenda.1", "text": "Ora di merenda. Ho un panino nella manica.", "en": "Snack time. There's a sandwich up my sleeve.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-merenda", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-merenda.1.m4a?v=73ea2a7aea41"}, "versions": {"clown": "73ea2a7aea41"}}, {"id": "afternoon-merenda.2", "text": "Era per un numero di magia. È andato male.", "en": "It was for a magic trick. That went badly.", "flavor": "absurd", "slot": "afternoon", "tags": "", "joke": "afternoon-merenda", "part": 2, "parts": 2, "clips": {"clown": "../Voice/it/clown/afternoon-merenda.2.m4a?v=3144a7039885"}, "versions": {"clown": "3144a7039885"}}, {"id": "evening-sincere", "text": "Sera: l'ora in cui il trucco comincia a sembrare sincero.", "en": "Evening: the hour my makeup starts to feel sincere.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/evening-sincere.m4a?v=a5f57c69ab91"}, "versions": {"clown": "a5f57c69ab91"}}, {"id": "evening-sun-bow", "text": "Tramonto. Il sole fa l'inchino. Nemmeno un fiore dal pubblico.", "en": "The sun's taking its bow. Not one flower thrown.", "flavor": "bittersweet", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/it/clown/evening-sun-bow.m4a?v=1f6b86f87077"}, "versions": {"clown": "1f6b86f87077"}}, {"id": "evening-waiter.1", "text": "Cena da solo. Il cameriere mi porta una torta.", "en": "Dinner for one. The waiter brought a pie.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-waiter", "part": 1, "parts": 2, "clips": {"clown": "../Voice/it/clown/evening-waiter.1.m4a?v=e6d0ed634811"}, "versions": {"clown": "e6d0ed634811"}}, {"id": "evening-waiter.2", "text": "Mi conosce.", "en": "He knows me.", "flavor": "absurd", "slot": "evening", "tags": "", "joke": "evening-waiter", "part": 2, "parts"
