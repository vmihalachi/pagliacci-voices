<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Voice review</title>
<style>
  /* The default colors; an app sets its own in companion.json (`voice.reviewColors`), injected after this block. */
  :root {
    --paper: #FFF8E7; --card: #FFFDF7; --ink: #3D2B1F; --ink-soft: #7A6555; --line: #E8DCC4;
    --accent: #F2C94C; --accent-soft: #FCEFC4; --on-accent: #3D2B1F;
    --done: #6B8F4E; --done-soft: #E3EDD5; --flag: #C4623A; --flag-soft: #F6DED3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1F1B17; --card: #2A241D; --ink: #EFE6D8; --ink-soft: #B3A592; --line: #3E352B;
      --accent: #E2B93F; --accent-soft: #4A3D1C; --on-accent: #3D2B1F;
      --done: #9BC07A; --done-soft: #2E3A24; --flag: #E3825C; --flag-soft: #4A2C20;
    }
  }
  :root{--paper:#F6F1E9;--card:#FFF3E6;--ink:#1C1519;--ink-soft:#5E5257;--line:#DDD3C6;--accent:#B23A1F;--accent-soft:#F3D5CB;--on-accent:#FFFFFF;--done:#2D2A8A;--done-soft:#DCDAF3;--flag:#C98A12;--flag-soft:#F7E3B5;--link:#9C2F17;}@media (prefers-color-scheme: dark){:root{--paper:#1E1A20;--card:#241E27;--ink:#EFE8DD;--ink-soft:#A89EA4;--line:#3A333D;--accent:#F2B23A;--accent-soft:#3D2F17;--on-accent:#2E1608;--done:#A9A3FF;--done-soft:#2A2752;--flag:#E0644A;--flag-soft:#44201A;--link:#F2B23A;}}
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; max-width: 980px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  .progress { flex: 1 1 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 120px; }
  .progress > i { display: block; height: 100%; background: var(--done); width: 0; transition: width .2s; }
  .count { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  button, select { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  button:hover { border-color: var(--ink-soft); }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; color: var(--on-accent); }
  button.on { background: var(--done-soft); border-color: var(--done); }
  .keys { max-width: 980px; margin: 6px auto 0; color: var(--ink-soft); font-size: 12px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--card); }
  main { max-width: 980px; margin: 0 auto; padding: 12px 16px 270px; }
  .row { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; }
  .row.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row.flagged { border-color: var(--flag); }
  .row.done .num::after { content: " ✓"; color: var(--done); }
  .num { color: var(--ink-soft); font-variant-numeric: tabular-nums; padding-top: 3px; font-size: 13px; }
  .it { font-size: 18px; font-weight: 600; }
  .en { color: var(--ink-soft); font-size: 13px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--ink-soft); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .chip.flavor-0 { background: var(--accent-soft); } .chip.flavor-1 { background: var(--flag-soft); }
  .chip.new { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .chip.waiting { border-style: dashed; }
  .chip.flavor-2 { background: var(--done-soft); } .chip.flavor-3 { background: var(--line); }
  /* A joke's later parts sit under its first, indented, joined to it. */
  .row.part { margin: -6px 0 10px 34px; border-top-style: dashed; }
  .actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .pair { display: flex; gap: 6px; } .pair button:first-child { flex: 1; }
  .actions button { font-size: 13px; padding: 3px 10px; white-space: nowrap; }
  .actions button.flag.on { background: var(--flag-soft); border-color: var(--flag); }
  .actions .playing { background: var(--accent-soft); border-color: var(--accent); }
  .note { grid-column: 2 / 4; display: none; }
  .row.flagged .note { display: block; }
  .note input { width: 100%; font: inherit; font-size: 13px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1.5px solid var(--line); padding: 10px 16px; }
  footer .inner { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
  footer textarea { width: 100%; height: 96px; resize: vertical; font: 12px/1.4 ui-monospace, monospace; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; }
  footer .side { display: grid; gap: 6px; }
  .hint { font-size: 12px; color: var(--ink-soft); }
  /* The pager sits on top of the notes footer; on wide screens it is fixed under the list instead. */
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; max-width: 980px; margin: 0 auto 10px; }
  .pager button { font-size: 13px; padding: 3px 10px; min-width: 34px; font-variant-numeric: tabular-nums; }
  .pager button[aria-current] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pager button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  .pager[hidden] { display: none; }
  .pager .gap { color: var(--ink-soft); padding: 0 2px; }
  .pager .range { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .it, .en { overflow-wrap: anywhere; }
  .notice { font-size: 11px; color: var(--ink-soft); }
  /* Wide screens: the notes become a full-height column on the right, room for many flags. */
  @media (min-width: 1100px) {
    :root { --notes: clamp(320px, 28vw, 440px); }
    /* The page reserves the column, so the header bar and the list stay centered in what's left. */
    body { padding-right: var(--notes); }
    .bar, .keys, main { max-width: 1120px; }
    main { padding: 16px 24px 80px; }
    .pager { position: fixed; left: 0; right: var(--notes); bottom: 0; max-width: none; margin: 0; padding: 10px 24px; background: var(--card); border-top: 1.5px solid var(--line); }
    header { padding: 12px 24px; }
    footer { left: auto; top: 0; width: var(--notes); border-top: 0; border-left: 1.5px solid var(--line); padding: 16px; }
    footer .inner { height: 100%; display: flex; flex-direction: column; }
    footer textarea { flex: 1; height: auto; resize: none; font-size: 13px; }
    footer .side { flex: none; }
  }
  @media (max-width: 640px) {
    .row { grid-template-columns: minmax(0, 1fr); } .num { display: none; }
    .actions { flex-direction: row; flex-wrap: wrap; }
    .note { grid-column: 1; } footer .inner { grid-template-columns: 1fr; } footer textarea { height: 56px; }
    main { padding-bottom: 250px; } .keys { display: none; } .pager .range { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title"></h1>
    <select id="lang" title="Language" aria-label="Language"></select>
    <button id="listen" class="primary" title="Space">▶ Listen through</button>
    <select id="voice" title="Which voice the listen-through plays"></select>
    <select id="speed" title="Playback speed while reviewing (the app plays at your Rate setting)">
      <option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
    <select id="filter">
      <option value="all">All lines</option><option value="voiced">Voiced</option><option value="todo">New or not heard yet</option><option value="flagged">Flagged</option><option value="waiting">Waiting for a voice</option>
    </select>
    <div class="progress"><i id="bar"></i></div>
    <span class="count" id="count"></span>
  </div>
  <div class="keys"><kbd>Space</kbd> listen through / pause · <kbd>↓</kbd><kbd>↑</kbd> next / previous · <kbd>←</kbd><kbd>→</kbd> page · <kbd>1</kbd><kbd>2</kbd>… play the first, second… voice ·
    <kbd>R</kbd> retake the voice you just heard · <kbd>T</kbd> the text should change · <kbd>N</kbd> write a note · Flags are kept in this browser.</div>
</header>
<main id="list"></main>
<footer>
  <nav class="pager" id="pager" aria-label="Pages"></nav>
  <div class="inner">
    <textarea id="summary" readonly placeholder="Flag what sounds off; your notes for Claude appear here."></textarea>
    <div class="side">
      <button id="copy" class="primary">Copy notes for Claude</button>
      <button id="clear">Clear flags</button>
      <span class="hint" id="copied"></span>
      <span class="notice" id="notice" hidden></span>
    </div>
  </div>
</footer>

ct diet. Only the pies that hit me.", "flavor": "silly", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/en/clown/general-pie-diet.m4a?v=9997710f4d18"}, "versions": {"clown": "9997710f4d18"}}, {"id": "general-pie-hug", "text": "A pie in the face is just a hug with filling.", "en": "A pie in the face is just a hug with filling.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/en/clown/general-pie-hug.m4a?v=205c4b0708b5"}, "versions": {"clown": "205c4b0708b5"}}, {"id": "general-pratfall.1", "text": "I fall down for a living.", "en": "I fall down for a living.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pratfall", "part": 1, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-pratfall.1.m4a?v=03ba3d3b196b"}, "versions": {"clown": "03ba3d3b196b"}}, {"id": "general-pratfall.2", "text": "Getting up is unpaid.", "en": "Getting up is unpaid.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-pratfall", "part": 2, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-pratfall.2.m4a?v=2d048d1be856"}, "versions": {"clown": "2d048d1be856"}}, {"id": "general-squirting-flower", "text": "My squirting flower is the only plant I've kept alive.", "en": "My squirting flower is the only plant I've kept alive.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/en/clown/general-squirting-flower.m4a?v=3726133e6cf2"}, "versions": {"clown": "3726133e6cf2"}}, {"id": "general-tear.1", "text": "People ask if the tear on my cheek is painted.", "en": "People ask if the tear on my cheek is painted.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-tear", "part": 1, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-tear.1.m4a?v=bc96715654b6"}, "versions": {"clown": "bc96715654b6"}}, {"id": "general-tear.2", "text": "Mostly. Some days I save on paint.", "en": "Mostly. Some days I save on paint.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-tear", "part": 2, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-tear.2.m4a?v=9d39140a901d"}, "versions": {"clown": "9d39140a901d"}}, {"id": "general-balloon-dog.1", "text": "I made a balloon dog.", "en": "I made a balloon dog.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-balloon-dog", "part": 1, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-balloon-dog.1.m4a?v=0a0c6bb390b6"}, "versions": {"clown": "0a0c6bb390b6"}}, {"id": "general-balloon-dog.2", "text": "It ran off with a balloon giraffe. They seem happy.", "en": "It ran off with a balloon giraffe. They seem happy.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-balloon-dog", "part": 2, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-balloon-dog.2.m4a?v=36e615e10258"}, "versions": {"clown": "36e615e10258"}}, {"id": "general-long-shoes.1", "text": "My shoes are so long", "en": "My shoes are so long", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-long-shoes", "part": 1, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-long-shoes.1.m4a?v=f83db70bac8d"}, "versions": {"clown": "f83db70bac8d"}}, {"id": "general-long-shoes.2", "text": "I get to places a second before I do.", "en": "I get to places a second before I do.", "flavor": "absurd", "slot": "buttonPress, general", "tags": "", "joke": "general-long-shoes", "part": 2, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-long-shoes.2.m4a?v=a4c98adac171"}, "versions": {"clown": "a4c98adac171"}}, {"id": "general-unicycle", "text": "I bought a unicycle to save money. Half the wheels.", "en": "I bought a unicycle to save money. Half the wheels.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/en/clown/general-unicycle.m4a?v=d00fe7b27467"}, "versions": {"clown": "d00fe7b27467"}}, {"id": "general-mime-argument", "text": "I argued with a mime. He had no comeback. Still won.", "en": "I argued with a mime. He had no comeback. Still won.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"clown": "../Voice/en/clown/general-mime-argument.m4a?v=3eeff7c098ee"}, "versions": {"clown": "3eeff7c098ee"}}, {"id": "general-poster.1", "text": "The ringmaster promised me top billing.", "en": "The ringmaster promised me top billing.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-poster", "part": 1, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-poster.1.m4a?v=94de84f7d037"}, "versions": {"clown": "94de84f7d037"}}, {"id": "general-poster.2", "text": "I'm on the poster. Bottom right. Under the elephant.", "en": "I'm on the poster. Bottom right. Under the elephant.", "flavor": "bittersweet", "slot": "buttonPress, general", "tags": "", "joke": "general-poster", "part": 2, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-poster.2.m4a?v=a2eb814ec7e2"}, "versions": {"clown": "a2eb814ec7e2"}}, {"id": "general-lion-chair.1", "text": "The lion tamer has a whip and a chair. I have a chair.", "en": "The lion tamer has a whip and a chair. I have a chair.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-lion-chair", "part": 1, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-lion-chair.1.m4a?v=020c21e4259e"}, "versions": {"clown": "020c21e4259e"}}, {"id": "general-lion-chair.2", "text": "Mostly I sit on it.", "en": "Mostly I sit on it.", "flavor": "dry", "slot": "buttonPress, general", "tags": "", "joke": "general-lion-chair", "part": 2, "parts": 2, "clips": {"clown": "../Voice/en/clown/general-lion-chair.2.m4a?v=910d33a7ee2c"}, "versions": {"clo   const order = visible(), pages = Math.ceil(order.length / PAGE);
  if (p < 0 || p >= pages || p === page) return;
  stopListening(); page = p; render(); select(order[p * PAGE], false); window.scrollTo({ top: 0 });
}

function progress() {
  let done = 0, total = 0;
  for (const r of DATA.rows) for (const v of DATA.voices) if (r.clips[v.kind]) { total++; if (heard(r, v.kind)) done++; }
  const waiting = DATA.rows.filter(r => !Object.keys(r.clips).length).length;
  $("#bar").style.width = `${total ? (100 * done / total) : 0}%`;
  $("#count").textContent = `${done} / ${total} heard` + (waiting ? ` · ${waiting} waiting for a voice` : "");
}

function summarize() {
  const retakes = {}, texts = [];
  for (const r of DATA.rows) {
    const e = state[r.id]; if (!e) continue;
    for (const v of DATA.voices) if (retake(r, v.kind)) (retakes[v.kind] ||= []).push(r.id + (e.note ? ` (${e.note})` : ""));
    if (e.text) texts.push(`${r.id}: "${r.text}"${e.note ? ` — ${e.note}` : ""}`);
  }
  const lines = [];
  for (const v of DATA.voices) if (retakes[v.kind]) lines.push(`Retake ${DATA.lang}/${v.kind} (${v.name}): ${retakes[v.kind].join(", ")}`);
  if (texts.length) lines.push(`Change the ${DATA.languageName} text:`, ...texts.map(t => `- ${t}`));
  $("#summary").value = lines.join("\n");
}

function select(i, scroll = true) {
  current = i;
  const pos = visible().indexOf(i);
  if (pos >= 0 && Math.floor(pos / PAGE) !== page) { page = Math.floor(pos / PAGE); render(); }
  document.querySelectorAll(".row").forEach(el => el.classList.toggle("current", +el.dataset.index === i));
  const el = document.querySelector(`.row[data-index="${i}"]`);
  if (el && scroll) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function markPlaying(i, kind) {
  document.querySelectorAll(".actions .playing").forEach(b => b.classList.remove("playing"));
  const b = document.querySelector(`.row[data-index="${i}"] [data-play="${kind}"]`);
  if (b) b.classList.add("playing");
}

function playOne(i, kind, then) {
  const r = DATA.rows[i]; if (!r.clips[kind]) { then && then(); return; }
  lastVoice = kind;
  audio.src = r.clips[kind]; audio.playbackRate = +$("#speed").value;
  markPlaying(i, kind);
  audio.onended = () => {
    entry(r.id).heard[kind] = r.versions[kind] || true; save(); progress();
    document.querySelectorAll(".actions .playing").forEach(b => b.classList.remove("playing"));
    const row = document.querySelector(`.row[data-index="${i}"]`);
    if (row && DATA.voices.every(v => !r.clips[v.kind] || heard(r, v.kind))) row.classList.add("done");
    then && then();
  };
  audio.play().catch(() => {});
}

function listenFrom(i) {
  const order = visible(); let pos = order.indexOf(i); if (pos < 0) pos = 0;
  const kinds = $("#voice").value === "both" ? DATA.voices.map(v => v.kind) : [$("#voice").value];
  const step = (p, k) => {
    if (!listening || p >= order.length) { stopListening(); return; }
    const idx = order[p]; if (k === 0) select(idx);
    const next = () => setTimeout(() => k + 1 < kinds.length ? step(p, k + 1) : step(p + 1, 0), 450);
    playOne(idx, kinds[k], next);
  };
  listening = true; $("#listen").textContent = "❚❚ Pause"; step(pos, 0);
}
function stopListening() { listening = false; audio.onended = null; audio.pause(); $("#listen").textContent = "▶ Listen through"; }

function toggleRetake(i, kind) {
  const r = DATA.rows[i]; if (!r.clips[kind]) return;
  entry(r.id).retake[kind] = retake(r, kind) ? false : (r.versions[kind] || true); save(); render(); select(i, false);
}
function toggleText(i) { const e = entry(DATA.rows[i].id); e.text = !e.text; save(); render(); select(i, false); }

$("#listen").onclick = () => listening ? stopListening() : listenFrom(current);
$("#filter").onchange = () => { stopListening(); page = 0; render(); };
$("#speed").onchange = () => { audio.playbackRate = +$("#speed").value; };
$("#copy").onclick = async () => {
  const text = $("#summary").value || "No flags: everything sounds right.";
  try { await navigator.clipboard.writeText(text); $("#copied").textContent = SEND; }
  catch { $("#summary").select(); document.execCommand("copy"); $("#copied").textContent = "Copied."; }
};
$("#clear").onclick = () => { if (confirm("Clear every flag and note?")) { for (const id in state) { state[id].retake = {}; state[id].text = false; state[id].note = ""; } save(); render(); } };

document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA" || ev.target.tagName === "SELECT") {
    if (ev.key === "Escape") ev.target.blur(); return;
  }
  const order = visible(), pos = order.indexOf(current);
  if (ev.key === " ") { ev.preventDefault(); listening ? stopListening() : listenFrom(current); }
  else if (ev.key === "ArrowDown" || ev.key === "j") { ev.preventDefault(); stopListening(); select(order[Math.min(order.length - 1, pos + 1)] ?? current); }
  else if (ev.key === "ArrowUp" || ev.key === "k") { ev.preventDefault(); stopListening(); select(order[Math.max(0, pos - 1)] ?? current); }
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { ev.preventDefault(); goPage(page + (ev.key === "ArrowLeft" ? -1 : 1)); }
  else if (ev.key === "1" || ev.key === "2") { const v = DATA.voices[+ev.key - 1]; if (v) { stopListening(); playOne(current, v.kind); } }
  else if (ev.key === "r") toggleRetake(current, lastVoice);
  else if (ev.key === "t") toggleText(current);
  else if (ev.key === "n") { const input = document.querySelector(`.row[data-index="${current}"] .note input`); const e = entry(DATA.rows[current].id); if (!input || getComputedStyle(input.parentElement).display === "none") { e.text = e.text || !DATA.voices.some(v => retake(DATA.rows[current], v.kind)); save(); render(); select(current, false); } setTimeout(() => document.querySelector(`.row[data-index="${current}"] .note input`)?.focus(), 0); ev.preventDefault(); }
});
render(); select(0, false);
</script>
</body>
</html>
